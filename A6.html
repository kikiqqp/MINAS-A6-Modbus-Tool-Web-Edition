<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yauyih A6 Modbus Tool Web Edition</title>
<style>
/* ==========================================================================
   A6 Modbus Tool Web Edition 樣式
   版面比照原 C# 視窗：上方連線列、左側四個分頁、右側 I/O 燈號與試運轉、
   下方通訊記錄與狀態列。配色採深色主題，燈號沿用 C# 版的紅（OFF）與綠（ON）。
   命名規則：元件 id 沿用 C# 版的「名稱_控制項類型」寫法，例如 OpenPort_Button。
   ========================================================================== */

:root {
    color-scheme: dark;
    --bgPage: #12161b;
    --bgPanel: #1a2027;
    --bgRaised: #222a33;
    --bgField: #0e1216;
    --lineColor: #2e3945;
    --lineStrong: #43515f;
    --textMain: #dbe3ea;
    --textMuted: #8997a6;
    --accent: #4c9be8;
    --accentDark: #1d4f82;
    --accentText: #06121f;
    --lampOn: #2bd45a;
    --lampOff: #b3261e;
    --warnColor: #e8a93b;
    --dangerColor: #e5534b;
    --okColor: #35c46a;
    --fontUi: "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    --fontMono: "Cascadia Mono", Consolas, "Courier New", monospace;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--bgPage);
    color: var(--textMain);
    font-family: var(--fontUi);
    font-size: 13px;
    line-height: 1.35;
}

body { min-height: 100vh; }

button, input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
}

:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
}

/* ---------- 版面骨架 ---------- */
#appRoot {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    min-height: 100vh;
    max-width: 1500px;
    margin: 0 auto;
}

.connectionBar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    padding: 8px 10px;
    background: var(--bgPanel);
    border: 1px solid var(--lineColor);
    border-radius: 4px;
}

.connectionBar .fieldGroup {
    display: flex;
    align-items: center;
    gap: 6px;
}

.connectionBar label { color: var(--textMuted); }

.connectionBar select,
.connectionBar input[type="number"] {
    background: var(--bgField);
    border: 1px solid var(--lineStrong);
    border-radius: 3px;
    padding: 3px 6px;
    height: 26px;
}

#ComPort_ComboBox { min-width: 220px; }
#SlaveAddress_textBox { width: 58px; }

.errorCodeBox {
    flex: 1 1 260px;
    min-width: 220px;
    padding: 4px 8px;
    border: 1px solid var(--lineColor);
    border-radius: 3px;
    background: var(--bgField);
    font-weight: 600;
    white-space: pre-line;
    line-height: 1.3;
}
.errorCodeBox.hasError { color: #ffd9d6; background: #4a1613; border-color: var(--dangerColor); }
.errorCodeBox.noError { color: var(--okColor); }

.safetyBar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    padding: 6px 10px;
    background: var(--bgPanel);
    border: 1px solid var(--lineColor);
    border-radius: 4px;
    color: var(--textMuted);
}
.safetyBar .fieldGroup { display: flex; align-items: center; gap: 6px; }
.safetyBar input[type="number"] {
    width: 78px; background: var(--bgField); border: 1px solid var(--lineStrong);
    border-radius: 3px; padding: 2px 6px; height: 24px;
}

.mainArea {
    display: grid;
    grid-template-columns: minmax(720px, 780px) minmax(0, 1fr);
    gap: 8px;
    align-items: start;
}

@media (max-width: 1200px) {
    .mainArea { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- 按鈕與文字欄位 ---------- */
button {
    background: var(--bgRaised);
    border: 1px solid var(--lineStrong);
    border-radius: 3px;
    padding: 4px 12px;
    min-height: 26px;
    cursor: pointer;
}
button:hover:not(:disabled) { background: #2c3743; border-color: var(--accent); }
button:active:not(:disabled) { background: var(--accentDark); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accentText); font-weight: 600; }
button.primary:hover:not(:disabled) { background: #6aaef0; }
button.danger { background: #5a1b17; border-color: var(--dangerColor); color: #ffe3e0; }
button.danger:hover:not(:disabled) { background: #7a2620; }
button.isOn { background: #1d5a33; border-color: var(--okColor); color: #dcffe8; }

input[type="text"], input[type="number"], select, textarea {
    background: var(--bgField);
    border: 1px solid var(--lineStrong);
    border-radius: 3px;
    padding: 3px 6px;
    min-height: 24px;
}
input[type="text"]:disabled, select:disabled { opacity: 0.55; }
input.valueBox {
    width: 100%;
    font-family: var(--fontMono);
    text-align: right;
}
input.valueBox[readonly] { background: #0b0f13; color: #cfe6ff; border-color: var(--lineColor); }
input.invalid { border-color: var(--dangerColor); background: #2a1210; }

/* ---------- 分頁 ---------- */
.tabHost {
    background: var(--bgPanel);
    border: 1px solid var(--lineColor);
    border-radius: 4px;
    overflow: hidden;
}
.tabList { display: flex; background: var(--bgRaised); border-bottom: 1px solid var(--lineColor); }
.tabList button {
    flex: 1 1 auto;
    border: 0;
    border-right: 1px solid var(--lineColor);
    border-radius: 0;
    background: transparent;
    padding: 7px 8px;
    min-height: 32px;
}
.tabList button[aria-selected="true"] { background: var(--bgPanel); color: #fff; box-shadow: inset 0 -2px 0 var(--accent); }
.tabPanel { padding: 10px; min-height: 470px; overflow: auto; }
.tabPanel[hidden] { display: none; }

/* 狀態頁面：三欄欄位 */
.fieldColumns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 14px; }
.fieldColumn { display: flex; flex-direction: column; gap: 6px; }
.fieldRow { display: flex; flex-direction: column; gap: 1px; }
.fieldRow > span { color: var(--textMuted); font-size: 11.5px; line-height: 1.2; }
.fieldRow .withButton { display: flex; gap: 4px; align-items: center; }
.fieldRow .withButton input.shortBox { width: 52px; text-align: center; font-family: var(--fontMono); }

/* 區塊動作參數分頁 */
.paramLayout { display: grid; grid-template-columns: auto 200px; gap: 14px; align-items: start; }
.paramGrid { display: grid; grid-template-columns: auto 56px auto 56px auto 56px; gap: 4px 6px; align-items: center; }
.paramGrid input.valueBox { width: 56px; padding: 2px 4px; }
.paramGrid span { color: var(--textMuted); font-size: 12px; white-space: nowrap; }
.paramSide { display: flex; flex-direction: column; gap: 6px; }
.paramSide select { width: 100%; }
.paramSide .fieldRow > span { white-space: normal; }
.paramSide .buttonRow { display: flex; gap: 6px; }
.paramSide .buttonRow button { flex: 1 1 0; }

.noteText { color: var(--textMuted); font-size: 11.5px; }
.noteText.warn { color: var(--warnColor); }

/* 區塊規劃分頁 */
.planToolbar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 8px; }
.planToolbar .planInfo { flex: 1 1 200px; }
.planTableWrap { height: 372px; overflow: auto; border: 1px solid var(--lineColor); border-radius: 3px; }
table.planTable { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12px; }
table.planTable th {
    position: sticky; top: 0; background: var(--bgRaised); color: var(--textMuted);
    text-align: left; font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--lineStrong); z-index: 1;
}
table.planTable td { padding: 2px 4px; border-bottom: 1px solid #1f2730; vertical-align: middle; }
table.planTable td.blockIndex { color: var(--textMuted); text-align: right; width: 44px; font-family: var(--fontMono); }
table.planTable input { font-family: var(--fontMono); text-align: right; min-height: 22px; padding: 1px 4px; }
table.planTable td:nth-child(2) input, table.planTable td:nth-child(4) input { width: 108px; }
table.planTable td:nth-child(3) input, table.planTable td:nth-child(5) input { width: 88px; }
table.planTable input.hexBox { text-align: left; }
table.planTable td.descCell { color: #a9c7e6; min-width: 220px; white-space: nowrap; }
table.planTable tr.rowDirty td { background: #22301f; }
table.planTable tr.rowDirty td.blockIndex { color: var(--warnColor); }
table.planTable tr.rowEmpty td.descCell { color: #566474; }

/* ---------- 右側面板 ---------- */
.rightColumn { display: flex; flex-direction: column; gap: 8px; }
.panelBox {
    background: var(--bgPanel);
    border: 1px solid var(--lineColor);
    border-radius: 4px;
    padding: 8px 10px;
}
.panelBox h3 { margin: 0 0 6px 0; font-size: 12.5px; font-weight: 600; color: var(--textMuted); }

.ioGrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 14px; }
.ioBlock { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ioBlock .labelLine { display: flex; flex-direction: column; align-items: stretch; gap: 1px; color: var(--textMuted); }
.ioBlock .labelLine span { font-size: 12px; }
.ioBlock .labelLine input { width: 100%; min-width: 0; font-family: var(--fontMono); }

.lampGrid { display: grid; gap: 3px; }
.lampGrid.cols5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.lampGrid.cols3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.lampGrid.cols4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.lampGrid.cols2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lampGrid.cols1 { grid-template-columns: minmax(0, 1fr); }
.lampGrid.cols6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }

.lamp {
    display: block;
    padding: 1px 4px;
    border-radius: 2px;
    text-align: center;
    font-size: 11px;
    line-height: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--lampOff);
    color: #ffe6e3;
    border: 1px solid #00000033;
    user-select: none;
}
.lamp.isOn { background: var(--lampOn); color: #05240f; font-weight: 600; }
.lamp.isUnknown { background: #3a424b; color: #8997a6; }
.lamp.wide { text-align: left; padding-left: 8px; }

/* 試運轉群組 */
fieldset.trialGroup {
    margin: 0;
    padding: 8px 10px 10px;
    border: 1px solid var(--lineStrong);
    border-radius: 4px;
    background: var(--bgPanel);
}
fieldset.trialGroup legend { padding: 0 6px; }
fieldset.trialGroup legend label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; }
.trialGrid { display: grid; grid-template-columns: 92px minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 6px 8px; align-items: end; }
.trialGrid .full { grid-column: 1 / -1; }
.trialGrid label.small { color: var(--textMuted); font-size: 11.5px; display: flex; flex-direction: column; gap: 2px; }
.trialButtons { display: flex; flex-wrap: wrap; gap: 6px; }
.trialButtons button { min-width: 84px; min-height: 34px; }
.trialButtons button.jogButton { touch-action: none; user-select: none; min-width: 96px; font-weight: 600; }
.trialButtons button.jogButton.isHolding { background: #7a4a05; border-color: var(--warnColor); color: #fff3d9; }
.trialStateLine { margin-top: 6px; min-height: 18px; }

/* ---------- 通訊記錄與狀態列 ---------- */
.logArea { background: var(--bgPanel); border: 1px solid var(--lineColor); border-radius: 4px; display: flex; flex-direction: column; }
.logToolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 5px 8px; border-bottom: 1px solid var(--lineColor); color: var(--textMuted); }
.logToolbar label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.logToolbar button { min-height: 22px; padding: 1px 10px; }
#CommLog_richTextBox {
    margin: 0;
    height: 168px;
    overflow: auto;
    padding: 6px 8px;
    background: var(--bgField);
    font-family: var(--fontMono);
    font-size: 12px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-all;
}
#CommLog_richTextBox .logError { color: #ff9a92; }
#CommLog_richTextBox .logWarn { color: var(--warnColor); }
#CommLog_richTextBox .logSend { color: #8fc2f2; }
#CommLog_richTextBox .logRead { color: #8fdcab; }
#CommLog_richTextBox .logInfo { color: #cfd8e1; }

.statusStrip {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
    padding: 4px 10px;
    background: var(--bgRaised);
    border: 1px solid var(--lineColor);
    border-radius: 4px;
    color: var(--textMuted);
}
.statusStrip .stateOn { color: var(--okColor); font-weight: 600; }
.statusStrip .stateOff { color: var(--textMuted); }
.statusStrip .stateLost { color: var(--dangerColor); font-weight: 600; }

/* ---------- 對話框（取代會卡住程式的 alert 與 confirm）---------- */
.dialogOverlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(5, 8, 12, 0.72);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
}
.dialogBox {
    width: min(560px, 100%);
    max-height: 90vh;
    overflow: auto;
    background: var(--bgPanel);
    border: 1px solid var(--lineStrong);
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
}
.dialogBox h2 { margin: 0; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--lineColor); }
.dialogBox.kindError h2 { color: #ffb4ae; }
.dialogBox.kindWarning h2 { color: var(--warnColor); }
.dialogBox .dialogBody { padding: 14px 16px; white-space: pre-wrap; line-height: 1.55; }
.dialogBox .dialogButtons { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 14px; }
.dialogBox .dialogButtons button { min-width: 84px; min-height: 30px; }

.unsupportedBanner {
    margin: 8px;
    padding: 12px 14px;
    border: 1px solid var(--warnColor);
    border-radius: 4px;
    background: #3a2b0c;
    color: #ffe9bf;
}

@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
}

/* ---------- 補充樣式（建立畫面後確認需要的項目）---------- */
.appTitle { font-weight: 600; color: var(--textMuted); padding: 0 2px; flex: 1 1 100%; }

/* ---------- 標題列 LOGO（純 CSS 繪製，不使用圖片）----------
   LOGO 是三塊斜平行四邊形：紅（左，Y 的左臂）、綠（中）、紅（右）。
   每一塊都鋪滿整個 .brandLogo 方框，再用 clip-path: polygon() 以百分比裁出形狀，
   所以只要改 height，整個 LOGO 就會依比例縮放。座標由原始圖檔量測而來。
   forced-color-adjust: none 避免 Windows 高對比模式把顏色改掉。
   ※ 這段數字必須與 05c_brand_guard.js 的 BRAND_LOGO_SPEC 一致，改其中一邊，另一邊也要改，
     否則防護會判定 LOGO 被修改而鎖定程式。 */
.appTitleBar { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
.appTitleBar .appTitle { flex: 0 1 auto; padding: 0; }
.brandLogo {
    position: relative;
    display: block;
    flex: none;
    height: 24px;
    aspect-ratio: 2.11 / 1;
    forced-color-adjust: none;
}
.brandLogoPart { position: absolute; inset: 0; display: block; forced-color-adjust: none; }
.brandLogoPart[data-part="redLeft"] {
    background: #ed1c24;
    clip-path: polygon(0% 0%, 24.28% 0%, 37.11% 33.78%, 25.67% 64.69%);
}
.brandLogoPart[data-part="green"] {
    background: #00a650;
    clip-path: polygon(71.39% 0%, 50.01% 0%, 13.03% 100%, 34.39% 100%);
}
.brandLogoPart[data-part="redRight"] {
    background: #ed1c24;
    clip-path: polygon(100% 0%, 78.6% 0%, 41.61% 100%, 63.01% 100%);
}

/* 邏輯輸入輸出燈號：由上往下、由左往右排列（與 C# 版相同的三欄配置） */
.lampGrid.columnFlow8 { grid-auto-flow: column; grid-template-rows: repeat(8, auto); }
.lampGrid.columnFlow6 { grid-auto-flow: column; grid-template-rows: repeat(6, auto); }

/* 試運轉群組版面 */
.trialGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; }
.trialRow { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: end; }
.trialRow label.small { color: var(--textMuted); font-size: 11.5px; display: flex; flex-direction: column; gap: 2px; }
.trialRow input.valueBox { width: 78px; }

/* ==========================================================================
   多語系
   ========================================================================== */

/* 不同語言用各自合適的字型。中文（簡體）與日文若沿用繁體字型清單，部分字會用到字形不同的後備字型。 */
html:lang(zh-CN) { --fontUi: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
html:lang(ja) { --fontUi: "Segoe UI", "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
html:lang(en) { --fontUi: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }

/* 連線列上的語言選單 */
.connectionBar .languageGroup select { min-width: 110px; }

/* 開場警告對話框內的語言選單 */
.dialogBox .dialogLanguage {
    display: flex; align-items: center; gap: 8px;
    padding: 0 16px 6px;
    color: var(--textMuted);
}
.dialogBox .dialogLanguage select {
    background: var(--bgField);
    border: 1px solid var(--lineStrong);
    border-radius: 3px;
    padding: 3px 6px;
    height: 28px;
    min-width: 130px;
    color: inherit;
}

</style>
</head>
<body>
<div id="appRoot">

    <!-- 標題列：左側是純 CSS 繪製的 LOGO（樣式見 style.css 的 .brandLogo，完整性由 brandGuard 監看） -->
    <div class="appTitleBar">
        <span class="brandLogo" id="BrandLogo_panel" role="img" aria-label="Yauyih">
            <span class="brandLogoPart" data-part="redLeft"></span>
            <span class="brandLogoPart" data-part="green"></span>
            <span class="brandLogoPart" data-part="redRight"></span>
        </span>
        <div class="appTitle" id="AppTitle_label"></div>
    </div>

    <header class="connectionBar">
        <div class="fieldGroup">
            <label id="ComPort_label" for="ComPort_ComboBox" data-i18n="COM Port">COM Port</label>
            <select id="ComPort_ComboBox"></select>
            <button type="button" id="ComportUpdate_Button" data-i18n="Select Port">Select Port</button>
        </div>
        <div class="fieldGroup">
            <label for="BaudRate_ComboBox" data-i18n="Baud Rate">Baud Rate</label>
            <select id="BaudRate_ComboBox"></select>
        </div>
        <div class="fieldGroup">
            <label for="DataBit_ComboBox" data-i18n="Data Bit">Data Bit</label>
            <select id="DataBit_ComboBox"></select>
        </div>
        <div class="fieldGroup">
            <label for="Parity_ComboBox" data-i18n="Parity">Parity</label>
            <select id="Parity_ComboBox"></select>
        </div>
        <div class="fieldGroup">
            <label for="StopBit_ComboBox" data-i18n="Stop Bit">Stop Bit</label>
            <select id="StopBit_ComboBox"></select>
        </div>
        <div class="fieldGroup">
            <label for="SlaveAddress_textBox" data-i18n="Slave">Slave</label>
            <input type="number" id="SlaveAddress_textBox" min="1" max="127" value="1">
        </div>
        <button type="button" id="OpenPort_Button" class="primary" disabled>Open Port</button>
        <div class="fieldGroup languageGroup">
            <label for="Language_ComboBox" id="Language_label">Language / 語言 / 言語</label>
            <select id="Language_ComboBox" class="languageSelect"></select>
        </div>
        <div id="ErrorCodeMess_label" class="errorCodeBox" role="status" aria-live="polite">尚未連線</div>
    </header>

    <section class="safetyBar" aria-label="Safety options" data-i18n-aria="Safety options">
        <label class="fieldGroup"><input type="checkbox" id="CommRight_checkBox" disabled> <span data-i18n="通訊權保護（4300h 加 Pr5.40 逾時，選用）">通訊權保護（4300h 加 Pr5.40 逾時，選用）</span></label>
        <span class="fieldGroup">
            <label for="CommRightTimeout_textBox" data-i18n="逾時 (ms)">逾時 (ms)</label>
            <input type="number" id="CommRightTimeout_textBox" value="1000" min="100" max="10000" disabled>
        </span>
        <span class="noteText" data-i18n="取得通訊權後，驅動器前面板除監視模式外無法操作；通訊中斷超過逾時時間，驅動器會自行以 Err80.0 停止。">取得通訊權後，驅動器前面板除監視模式外無法操作；通訊中斷超過逾時時間，驅動器會自行以 Err80.0 停止。</span>
    </section>

    <main class="mainArea">

        <section class="tabHost" id="A6_tabControl">
            <div class="tabList" role="tablist" aria-label="A6 pages" data-i18n-aria="A6 pages">
                <button type="button" role="tab" id="StatusPage_tab" aria-controls="StatusPage_tabPage" aria-selected="true" data-i18n="Status Page">Status Page</button>

   【相對於舊版 A6.html 修正的問題】

   3. 開埠參數寫死為無同位檢查。現在可選擇資料位元、同位檢查、停止位元與站號。
   4. 輪詢用 setInterval 造成交易重疊、空 catch 吞掉所有錯誤、每按一次 Read 就多一組輪詢。

   5. 每次交易重建 reader 並用 Promise.race 逾時，造成資料錯位。改為常駐讀取迴圈加緩衝區。
   6. 補齊 16 個輪詢群組與所有欄位解碼，修正邏輯輸入輸出燈號的位元對應。
   7. 補上 Block 參數與規劃的寫入、EEPROM、清除多圈、清除警報、Servo ON、JOG、Block RUN。

   【相對於 C# 版修正的問題】
   1. Block 參數讀寫改為 4600h 到 463Ch，寫入時保留 Pr60.48（4630h），並支援 Pr60.56 與 Pr60.57。
   2. 逾時改用真實時間，不再以 Sleep(1) 計次（Windows 計時器解析度會讓它拖長到十幾秒）。
   3. 例外回應（5 位元組）立即回報，不再空等到逾時，也不會殘留位元組污染下一筆交易。
   4. 所有操作在背景佇列執行，畫面不會被卡住，關閉連線不再等待 1 秒。
   5. 讀取 Block 規劃失敗時不會把全 0 顯示到畫面，避免使用者誤按寫入而覆蓋全部 Block。
   6. 寫入回應不再誤觸發參數頁刷新，使用者尚未寫入的編輯不會被蓋掉。
   7. 所有寫入後都讀回驗證；Block 規劃寫入前檢查是否引用到數值為 0 的速度或加減速（Err93.1）。
   8. 試運轉會備份並還原 Block 254、255 與第 15 組參數；JOG 只寫三個暫存器。
   9. JOG 放開、視窗失去焦點、分頁隱藏、連線中斷都會停止；停止流程會確認馬達低於 30 r/min，

   11. 站號可設定；狀態列的連線、錯誤與逾時次數會真正更新；錯誤碼表補上 83.2、94.3、97.0。
   12. 使用非阻塞對話框取代 alert 與 confirm；通訊錯誤只寫入記錄，不再每次彈出對話框。

   15. 自動偵測驅動器韌體是否支援 463Bh 與 463Ch（Pr60.56、Pr60.57，需功能增強版 8 以上）：

'use strict';

/* ==========================================================================
   第零部分：多語系引擎
   支援語言：繁體中文 (zh-TW)、簡體中文 (zh-CN)、English (en)、日本語 (ja)

   設計重點（註解一律維持繁體中文，與介面語言無關）：
   1. 字典 I18N 以「原文」當 key（繁體中文原句，或英文標籤），
      每個 key 對應四種語言的譯文。找不到譯文時依序退回 en、再退回 key 本身。
   2. 譯文可用 {0}、{1}… 當位置參數。參數本身也可以是 LText（巢狀翻譯）。
   3. 「已經顯示出去的訊息」（記錄、錯誤、彈跳視窗）不能直接存字串，
      否則切換語言時無法重翻。因此訊息一律用 LText（延遲翻譯物件）保存，
      真正要顯示時才呼叫 resolveText 依「目前語言」轉成字串。
   4. 靜態畫面元件（標籤、按鈕、頁籤）用 bindText 綁定，切換語言時一次重刷。
   5. 語言決定順序：使用者上次手動選擇 → 瀏覽器／系統語言 → 英文。
   ========================================================================== */

// 可選語言清單。name 一律用該語言自己的寫法，不隨介面語言翻譯。
const LANGUAGES = [
    { code: 'zh-TW', name: '繁體中文' },
    { code: 'zh-CN', name: '简体中文' },
    { code: 'en', name: 'English' },
    { code: 'ja', name: '日本語' }
];
const LANGUAGE_STORAGE_KEY = 'A6WebLanguage';   // 記住使用者選擇用的 localStorage 名稱
const DEFAULT_LANGUAGE = 'en';                  // 系統語言不在清單內時使用英文

// 目前語言狀態（切換語言只需改這裡再重刷畫面）
const i18nState = { language: DEFAULT_LANGUAGE };

// 字典：I18N[key] = { 'zh-TW': ..., 'zh-CN': ..., en: ..., ja: ... }，由 00_i18n_dict.js 填入。
const I18N = {};

// --------------------------------------------------------------------------
// 延遲翻譯物件
// --------------------------------------------------------------------------

// LText 只保存 key 與參數，不立刻翻譯。toString 會依當下語言翻譯，
// 所以不小心與字串相加時仍可得到可讀文字（只是那一刻就固定了）。
class LText {
    constructor(key, args) {
        this.key = key;
        this.args = args;
    }
    toString() { return resolveText(this); }
}

// 依目前語言套用字典並代入參數。
function formatText(key, args) {
    const entry = I18N[key];
    let template = key;
    if (entry) {
        template = entry[i18nState.language];
        if (template === undefined) { template = entry.en; }
        if (template === undefined) { template = key; }
    }
    return template.replace(/\{(\d+)\}/g, function (match, index) {
        const value = args[Number(index)];
        return (value === undefined) ? match : resolveText(value);
    });
}

// t：立刻翻譯成字串（用在「當下就要顯示、且之後會被整個重刷」的地方）。
function t(key) {
    return formatText(key, Array.prototype.slice.call(arguments, 1));
}

// lx：建立延遲翻譯物件（用在要保存起來、之後切換語言仍需重翻的訊息）。
function lx(key) {
    return new LText(key, Array.prototype.slice.call(arguments, 1));
}

// 把 LText、字串、數字、陣列（以換行串接）統一轉成目前語言的字串。
function resolveText(value) {
    if (value === null || value === undefined) { return ''; }
    if (value instanceof LText) { return formatText(value.key, value.args); }
    if (Array.isArray(value)) { return value.map(resolveText).join('\n'); }
    return String(value);
}

// --------------------------------------------------------------------------
// 可延遲翻譯的錯誤
// --------------------------------------------------------------------------

// 錯誤訊息建立時就先翻成目前語言放進 message（方便除錯與主控台），
// 同時保留原始 LText 於 text，顯示時改用 errorText 取回，才能隨語言切換重翻。
class LocalizedError extends Error {
    constructor(text) {
        super(resolveText(text));
        this.name = 'LocalizedError';
        this.text = text;
    }
}

// 取得錯誤的「可重翻訊息」。一般 Error 沒有 text 時退回 message。
function errorText(error) {
    if (error && error.text !== undefined) { return error.text; }
    if (error && error.message) { return error.message; }
    return String(error);
}

// --------------------------------------------------------------------------
// 靜態元件綁定
// --------------------------------------------------------------------------

const i18nBindings = [];

// 依綁定的屬性種類把譯文寫到元件上。property：text、aria，或任何元件屬性名（如 title、placeholder）。
function applyBinding(binding) {
    const text = formatText(binding.key, binding.args);
    if (binding.property === 'text') {
        binding.element.textContent = text;
    } else if (binding.property === 'aria') {
        binding.element.setAttribute('aria-label', text);
    } else {
        binding.element[binding.property] = text;
    }
}

// 綁定元件屬性與 key，並立刻套用一次。回傳 element 方便串接。
function bindText(element, property, key) {
    const binding = { element: element, property: property, key: key, args: Array.prototype.slice.call(arguments, 3) };
    i18nBindings.push(binding);
    applyBinding(binding);
    return element;
}

// 切換語言後重刷所有綁定。已不在文件內的元件（被移除重建）順便清掉，避免綁定無限增加。
function refreshBindings() {
    for (let i = i18nBindings.length - 1; i >= 0; i--) {
        const binding = i18nBindings[i];
        if (binding.element.isConnected === false) {
            i18nBindings.splice(i, 1);
        }
    }
    for (const binding of i18nBindings) { applyBinding(binding); }
}

// --------------------------------------------------------------------------
// 語言偵測與記憶
// --------------------------------------------------------------------------

function isSupportedLanguage(code) {
    return LANGUAGES.some(function (language) { return language.code === code; });
}

// 把瀏覽器語言標籤（如 zh-Hant-TW、ja-JP、en-US）對應到支援的語言，對不上回傳空字串。
// 中文：台灣、香港、澳門或繁體字集（Hant）用繁體，其餘（含 zh、zh-CN、zh-SG）用簡體。
function matchLanguageTag(rawTag) {
    const tag = String(rawTag || '').toLowerCase();
    if (tag.indexOf('ja') === 0) { return 'ja'; }
    if (tag.indexOf('en') === 0) { return 'en'; }
    if (tag.indexOf('zh') === 0) { return /(tw|hk|mo|hant)/.test(tag) ? 'zh-TW' : 'zh-CN'; }
    return '';
}

// 依瀏覽器偏好語言清單由前往後比對，第一個對得上的就採用；都對不上則英文。
function detectLanguage() {
    const candidates = [];
    try {
        if (navigator.languages && navigator.languages.length) {
            for (const tag of navigator.languages) { candidates.push(tag); }
        }
        if (navigator.language) { candidates.push(navigator.language); }
    } catch (ignore) { /* 取不到就算了 */ }
    for (const tag of candidates) {
        const code = matchLanguageTag(tag);
        if (code) { return code; }
    }
    return DEFAULT_LANGUAGE;
}

// 讀取使用者上次的選擇。localStorage 在隱私模式或被封鎖時會丟例外，一律包 try。
function loadSavedLanguage() {
    try {
        const code = window.localStorage.getItem(LANGUAGE_STORAGE_KEY);
        return isSupportedLanguage(code) ? code : '';
    } catch (ignore) {
        return '';
    }
}

function saveLanguage(code) {
    try { window.localStorage.setItem(LANGUAGE_STORAGE_KEY, code); } catch (ignore) { /* 無法記住也不影響使用 */ }
}

// 啟動時採用的語言：使用者上次手動選擇優先，其次是系統語言，最後才是英文。
function chooseInitialLanguage() {
    return loadSavedLanguage() || detectLanguage();
}

    "正向軟體限位（{0}）沒有大於負向軟體限位（{1}），文件要求正向須大於負向。": { "zh-TW": "正向軟體限位（{0}）沒有大於負向軟體限位（{1}），文件要求正向須大於負向。", "zh-CN": "正向软件限位（{0}）没有大于负向软件限位（{1}），文档要求正向须大于负向。", en: "The positive software limit ({0}) is not greater than the negative software limit ({1}). The manual requires the positive limit to be greater.", ja: "正方向ソフトリミット（{0}）が負方向ソフトリミット（{1}）より大きくありません。マニュアルでは正方向が大きい必要があります。" },
    "原點偏移（{0}）不在負向與正向軟體限位之間，文件要求必須落在兩者之間。": { "zh-TW": "原點偏移（{0}）不在負向與正向軟體限位之間，文件要求必須落在兩者之間。", "zh-CN": "原点偏移（{0}）不在负向与正向软件限位之间，文档要求必须落在两者之间。", en: "The home offset ({0}) is not between the negative and positive software limits. The manual requires it to be between them.", ja: "原点オフセット（{0}）が負方向と正方向のソフトリミットの間にありません。マニュアルでは両者の間にある必要があります。" },
    "驅動器型號：{0}，軟體版本：{1}": { "zh-TW": "驅動器型號：{0}，軟體版本：{1}", "zh-CN": "驱动器型号：{0}，软件版本：{1}", en: "Drive model: {0}, software version: {1}", ja: "ドライバ型式：{0}、ソフトウェアバージョン：{1}" },
    "無法讀取驅動器型號與軟體版本：{0}": { "zh-TW": "無法讀取驅動器型號與軟體版本：{0}", "zh-CN": "无法读取驱动器型号与软件版本：{0}", en: "Unable to read the drive model and software version: {0}", ja: "ドライバの型式とソフトウェアバージョンを読み出せません：{0}" },
    "Pr{0}.{1} 寫入後讀回為 {2}，與寫入值 {3} 不一致": { "zh-TW": "Pr{0}.{1} 寫入後讀回為 {2}，與寫入值 {3} 不一致", "zh-CN": "Pr{0}.{1} 写入后读回为 {2}，与写入值 {3} 不一致", en: "Pr{0}.{1} reads back as {2} after writing, which differs from the written value {3}", ja: "Pr{0}.{1} を書き込んだ後の読み戻し値は {2} で、書き込んだ値 {3} と一致しません" },
    "Servo 尚未 ON，無法 JOG。請先按 Servo ON。": { "zh-TW": "Servo 尚未 ON，無法 JOG。請先按 Servo ON。", "zh-CN": "Servo 尚未 ON，无法 JOG。请先按 Servo ON。", en: "The servo is not ON, so JOG is not possible. Press Servo ON first.", ja: "サーボが ON ではないため JOG できません。先に Servo ON を押してください。" },
    "驅動器目前有警報，無法 JOG。請先排除警報並清除。": { "zh-TW": "驅動器目前有警報，無法 JOG。請先排除警報並清除。", "zh-CN": "驱动器目前有警报，无法 JOG。请先排除警报并清除。", en: "The drive has an active alarm, so JOG is not possible. Remove the cause and clear the alarm first.", ja: "ドライバにアラームが発生しているため JOG できません。原因を取り除いてアラームをクリアしてください。" },
    "JOG 在啟動前就被取消（按鈕已放開或視窗失去焦點），未啟動。": { "zh-TW": "JOG 在啟動前就被取消（按鈕已放開或視窗失去焦點），未啟動。", "zh-CN": "JOG 在启动前就被取消（按钮已放开或窗口失去焦点），未启动。", en: "JOG was canceled before it started (the button was released or the window lost focus). It did not start.", ja: "JOG は起動前に取り消されました（ボタンが離されたか、ウィンドウがフォーカスを失いました）。起動していません。" },
    "啟動途中按鈕已放開": { "zh-TW": "啟動途中按鈕已放開", "zh-CN": "启动途中按钮已放开", en: "the button was released during start-up", ja: "起動中にボタンが離されました" },
    "JOG 啟動失敗：{0}": { "zh-TW": "JOG 啟動失敗：{0}", "zh-CN": "JOG 启动失败：{0}", en: "JOG failed to start: {0}", ja: "JOG の起動に失敗しました：{0}" },
    "啟動失敗後的保險停止": { "zh-TW": "啟動失敗後的保險停止", "zh-CN": "启动失败后的保险停止", en: "safety stop after a failed start", ja: "起動失敗後の安全停止" },
    "安全檢查：按鈕已放開或視窗失去焦點": { "zh-TW": "安全檢查：按鈕已放開或視窗失去焦點", "zh-CN": "安全检查：按钮已放开或窗口失去焦点", en: "safety check: the button was released or the window lost focus", ja: "安全チェック：ボタンが離されたか、ウィンドウがフォーカスを失いました" },
    "馬達在時限內沒有停止，請立刻使用外部緊急停止！（原因：{0}）": { "zh-TW": "馬達在時限內沒有停止，請立刻使用外部緊急停止！（原因：{0}）", "zh-CN": "电机在时限内没有停止，请立刻使用外部紧急停止！（原因：{0}）", en: "The motor did not stop within the time limit. Use the external emergency stop immediately! (Reason: {0})", ja: "モータが制限時間内に停止しませんでした。直ちに外部の非常停止を使用してください！（原因：{0}）" },
    "減速停止未能完成，已改用立即停止（H-STOP）。（原因：{0}）": { "zh-TW": "減速停止未能完成，已改用立即停止（H-STOP）。（原因：{0}）", "zh-CN": "减速停止未能完成，已改用立即停止（H-STOP）。（原因：{0}）", en: "The decelerating stop could not be completed, so an immediate stop (H-STOP) was used instead. (Reason: {0})", ja: "減速停止を完了できなかったため、即時停止（H-STOP）に切り替えました。（原因：{0}）" },
    "停止命令失敗：{0}。請立刻使用外部緊急停止！": { "zh-TW": "停止命令失敗：{0}。請立刻使用外部緊急停止！", "zh-CN": "停止命令失败：{0}。请立刻使用外部紧急停止！", en: "The stop command failed: {0}. Use the external emergency stop immediately!", ja: "停止コマンドが失敗しました：{0}。直ちに外部の非常停止を使用してください！" },
    "要寫入的十六進位值": { "zh-TW": "要寫入的十六進位值", "zh-CN": "要写入的十六进位值", en: "Hexadecimal value to write", ja: "書き込む 16 進数の値" },
    "{0} 寫入值": { "zh-TW": "{0} 寫入值", "zh-CN": "{0} 写入值", en: "{0} value to write", ja: "{0} の書き込み値" },
    "尚未取得資料": { "zh-TW": "尚未取得資料", "zh-CN": "尚未取得数据", en: "No data yet", ja: "データ未取得" },
    "Comm Lost（通訊中斷）": { "zh-TW": "Comm Lost（通訊中斷）", "zh-CN": "Comm Lost（通信中断）", en: "Comm Lost", ja: "通信断（Comm Lost）" },
    "操作": { "zh-TW": "操作", "zh-CN": "操作", en: "Operation", ja: "操作" },
    "{0} 逾時": { "zh-TW": "{0} 逾時", "zh-CN": "{0} 超时", en: "{0} timed out", ja: "{0} がタイムアウトしました" },
    "{0} 已中止：連線已關閉": { "zh-TW": "{0} 已中止：連線已關閉", "zh-CN": "{0} 已中止：连接已关闭", en: "{0} was aborted: the connection was closed", ja: "{0} は中止されました：接続が閉じられました" },
    "{0} 失敗：{1}": { "zh-TW": "{0} 失敗：{1}", "zh-CN": "{0} 失败：{1}", en: "{0} failed: {1}", ja: "{0} に失敗しました：{1}" },
    "{0} 失敗": { "zh-TW": "{0} 失敗", "zh-CN": "{0} 失败", en: "{0} failed", ja: "{0} に失敗しました" },
    "正在執行「{0}」，請稍候再執行「{1}」。": { "zh-TW": "正在執行「{0}」，請稍候再執行「{1}」。", "zh-CN": "正在运行「{0}」，请稍候再运行「{1}」。", en: "\"{0}\" is in progress. Please wait before running \"{1}\".", ja: "「{0}」を実行中です。しばらくしてから「{1}」を実行してください。" },
    "(尚未授權序列埠，請按 Select Port)": { "zh-TW": "(尚未授權序列埠，請按 Select Port)", "zh-CN": "(尚未授权串口，请按 Select Port)", en: "(No serial port authorized yet. Press Select Port)", ja: "(シリアルポートが未許可です。Select Port を押してください)" },
    "已授權序列埠：{0}": { "zh-TW": "已授權序列埠：{0}", "zh-CN": "已授权串口：{0}", en: "Serial port authorized: {0}", ja: "シリアルポートを許可しました：{0}" },
    "未選擇序列埠。": { "zh-TW": "未選擇序列埠。", "zh-CN": "未选择串口。", en: "No serial port was selected.", ja: "シリアルポートが選択されませんでした。" },
    "選擇序列埠失敗：{0}": { "zh-TW": "選擇序列埠失敗：{0}", "zh-CN": "选择串口失败：{0}", en: "Failed to select a serial port: {0}", ja: "シリアルポートの選択に失敗しました：{0}" },
    "無法開啟序列埠。": { "zh-TW": "無法開啟序列埠。", "zh-CN": "无法打开串口。", en: "Unable to open the serial port.", ja: "シリアルポートを開けません。" },
    "這個序列埠已經是開啟狀態，可能被本頁面的另一個分頁使用。": { "zh-TW": "這個序列埠已經是開啟狀態，可能被本頁面的另一個分頁使用。", "zh-CN": "这个串口已经是打开状态，可能被本页面的另一个标签页使用。", en: "This serial port is already open. It may be in use by another tab of this page.", ja: "このシリアルポートはすでに開かれています。このページの別のタブで使用されている可能性があります。" },
    "最常見的原因是這個 COM 埠正被其他程式占用，例如 C# 版程式、PANATERM、序列埠終端機，或另一個瀏覽器分頁。請先關閉它們再重試。也請確認 USB 轉 RS485 或 RS232 轉接器已插好。": { "zh-TW": "最常見的原因是這個 COM 埠正被其他程式占用，例如 C# 版程式、PANATERM、序列埠終端機，或另一個瀏覽器分頁。請先關閉它們再重試。也請確認 USB 轉 RS485 或 RS232 轉接器已插好。", "zh-CN": "最常见的原因是这个 COM 端口正被其他程序占用，例如 C# 版程序、PANATERM、串口终端机，或另一个浏览器标签页。请先关闭它们再重试。也请确认 USB 转 RS485 或 RS232 转接器已插好。", en: "The most common cause is that this COM port is in use by another program, such as the C# version, PANATERM, a serial terminal, or another browser tab. Close them and try again. Also make sure the USB-to-RS485 or RS232 adapter is plugged in properly.", ja: "最も多い原因は、この COM ポートが他のプログラム（C# 版、PANATERM、シリアルターミナル、別のブラウザタブなど）に使用されていることです。それらを閉じてから再試行してください。USB-RS485 または RS232 変換アダプタが正しく接続されているかも確認してください。" },
    "請先按「Select Port」，在瀏覽器對話框中選擇要使用的序列埠。": { "zh-TW": "請先按「Select Port」，在瀏覽器對話框中選擇要使用的序列埠。", "zh-CN": "请先按「Select Port」，在浏览器对话框中选择要使用的串口。", en: "Press \"Select Port\" first and choose the serial port to use in the browser dialog.", ja: "先に「Select Port」を押し、ブラウザのダイアログで使用するシリアルポートを選択してください。" },
    "站號必須是 1 到 127 的整數（對應驅動器 Pr5.31）。": { "zh-TW": "站號必須是 1 到 127 的整數（對應驅動器 Pr5.31）。", "zh-CN": "站号必须是 1 到 127 的整数（对应驱动器 Pr5.31）。", en: "The slave address must be an integer from 1 to 127 (corresponds to the drive's Pr5.31).", ja: "スレーブアドレスは 1 〜 127 の整数にしてください（ドライバの Pr5.31 に対応）。" },
    "開啟序列埠失敗：{0}": { "zh-TW": "開啟序列埠失敗：{0}", "zh-CN": "打开串口失败：{0}", en: "Failed to open the serial port: {0}", ja: "シリアルポートを開くのに失敗しました：{0}" },
    "序列埠已開啟：{0} bps，資料位元 {1}，同位檢查 {2}，停止位元 {3}，站號 {4}": { "zh-TW": "序列埠已開啟：{0} bps，資料位元 {1}，同位檢查 {2}，停止位元 {3}，站號 {4}", "zh-CN": "串口已打开：{0} bps，数据位 {1}，奇偶校验 {2}，停止位 {3}，站号 {4}", en: "Serial port opened: {0} bps, data bits {1}, parity {2}, stop bits {3}, slave {4}", ja: "シリアルポートを開きました：{0} bps、データビット {1}、パリティ {2}、ストップビット {3}、スレーブ {4}" },
    "關閉連線": { "zh-TW": "關閉連線", "zh-CN": "关闭连接", en: "closing the connection", ja: "接続を閉じる" },
    "還原試運轉資料": { "zh-TW": "還原試運轉資料", "zh-CN": "还原试运转数据", en: "Restore trial operation data", ja: "試運転データの復元" },
    "已還原試運轉改寫的資料。": { "zh-TW": "已還原試運轉改寫的資料。", "zh-CN": "已还原试运转改写的数据。", en: "The data changed by trial operation has been restored.", ja: "試運転で書き換えたデータを復元しました。" },
    "關閉連線前還原試運轉資料失敗：{0}，請重新讀取 Block 資料確認。": { "zh-TW": "關閉連線前還原試運轉資料失敗：{0}，請重新讀取 Block 資料確認。", "zh-CN": "关闭连接前还原试运转数据失败：{0}，请重新读取 Block 数据确认。", en: "Failed to restore the trial operation data before closing: {0}. Read the Block data again to check.", ja: "接続を閉じる前の試運転データの復元に失敗しました：{0}。Block データを再読み出しして確認してください。" },
    "釋放通訊權": { "zh-TW": "釋放通訊權", "zh-CN": "释放通信权", en: "Release communication right", ja: "通信権の解放" },
    "已釋放通訊權。": { "zh-TW": "已釋放通訊權。", "zh-CN": "已释放通信权。", en: "The communication right has been released.", ja: "通信権を解放しました。" },
    "釋放通訊權失敗：{0}": { "zh-TW": "釋放通訊權失敗：{0}", "zh-CN": "释放通信权失败：{0}", en: "Failed to release the communication right: {0}", ja: "通信権の解放に失敗しました：{0}" },
    "序列埠已關閉。": { "zh-TW": "序列埠已關閉。", "zh-CN": "串口已关闭。", en: "The serial port was closed.", ja: "シリアルポートを閉じました。" },
    "序列埠接收錯誤（{0}）：請確認同位檢查、停止位元與傳輸速率和驅動器設定一致（Pr5.29、Pr5.30、Pr5.38）。": { "zh-TW": "序列埠接收錯誤（{0}）：請確認同位檢查、停止位元與傳輸速率和驅動器設定一致（Pr5.29、Pr5.30、Pr5.38）。", "zh-CN": "串口接收错误（{0}）：请确认奇偶校验、停止位与波特率和驱动器设置一致（Pr5.29、Pr5.30、Pr5.38）。", en: "Serial port receive error ({0}): check that the parity, stop bits and baud rate match the drive settings (Pr5.29, Pr5.30, Pr5.38).", ja: "シリアルポート受信エラー（{0}）：パリティ、ストップビット、ボーレートがドライバの設定（Pr5.29、Pr5.30、Pr5.38）と一致しているか確認してください。" },
    "序列埠已中斷：{0}": { "zh-TW": "序列埠已中斷：{0}", "zh-CN": "串口已中断：{0}", en: "The serial port was disconnected: {0}", ja: "シリアルポートが切断されました：{0}" },
    "序列埠已中斷（可能是轉接器被拔除）。連線已關閉。": { "zh-TW": "序列埠已中斷（可能是轉接器被拔除）。連線已關閉。", "zh-CN": "串口已中断（可能是转接器被拔除）。连接已关闭。", en: "The serial port was disconnected (the adapter may have been unplugged). The connection has been closed.", ja: "シリアルポートが切断されました（アダプタが抜かれた可能性があります）。接続を閉じました。" },
    "注意：中斷當下馬達可能仍在運轉，請立即使用外部緊急停止確認！": { "zh-TW": "注意：中斷當下馬達可能仍在運轉，請立即使用外部緊急停止確認！", "zh-CN": "注意：中断当下电机可能仍在运转，请立即使用外部紧急停止确认！", en: "Caution: the motor may still be running at the moment of disconnection. Check immediately with the external emergency stop!", ja: "注意：切断された時点でモータが回転し続けている可能性があります。直ちに外部の非常停止で確認してください！" },
    "若驅動器的 Pr5.40 逾時保護與通訊權已啟用，驅動器會自行發生 Err80.0 並停止。": { "zh-TW": "若驅動器的 Pr5.40 逾時保護與通訊權已啟用，驅動器會自行發生 Err80.0 並停止。", "zh-CN": "若驱动器的 Pr5.40 超时保护与通信权已激活，驱动器会自行发生 Err80.0 并停止。", en: "If the drive's Pr5.40 timeout protection and the communication right are enabled, the drive will trip with Err80.0 by itself and stop.", ja: "ドライバの Pr5.40 タイムアウト保護と通信権が有効な場合、ドライバは自ら Err80.0 を発生して停止します。" },
    "通訊已恢復。": { "zh-TW": "通訊已恢復。", "zh-CN": "通信已恢复。", en: "Communication has been restored.", ja: "通信が復旧しました。" },
    "通訊中斷：連續 {0} 次交易失敗。請檢查接線、站號與驅動器通訊參數。": { "zh-TW": "通訊中斷：連續 {0} 次交易失敗。請檢查接線、站號與驅動器通訊參數。", "zh-CN": "通信中断：连续 {0} 次交易失败。请检查接线、站号与驱动器通信参数。", en: "Communication lost: {0} transactions failed in a row. Check the wiring, slave address and the drive's communication parameters.", ja: "通信断：{0} 回連続でトランザクションに失敗しました。配線、スレーブアドレス、ドライバの通信パラメータを確認してください。" },
    "清除多圈資料": { "zh-TW": "清除多圈資料", "zh-CN": "清除多圈数据", en: "Clear multi-turn data", ja: "マルチターンデータのクリア" },
    "寫入值必須是 6165（十六進位）才會執行清除多圈資料。": { "zh-TW": "寫入值必須是 6165（十六進位）才會執行清除多圈資料。", "zh-CN": "写入值必须是 6165（十六进位）才会运行清除多圈数据。", en: "The value to write must be 6165 (hexadecimal) to clear the multi-turn data.", ja: "マルチターンデータをクリアするには、書き込み値を 6165（16 進数）にする必要があります。" },
    "目前 Servo 為 ON。清除多圈資料前必須先關閉 Servo（文件 2-7-2）。": { "zh-TW": "目前 Servo 為 ON。清除多圈資料前必須先關閉 Servo（文件 2-7-2）。", "zh-CN": "目前 Servo 为 ON。清除多圈数据前必须先关闭 Servo（文档 2-7-2）。", en: "The servo is currently ON. Turn the servo OFF before clearing the multi-turn data (manual 2-7-2).", ja: "現在サーボが ON です。マルチターンデータをクリアする前にサーボを OFF にしてください（マニュアル 2-7-2）。" },
    "即將清除絕對式編碼器的多圈資料。": { "zh-TW": "即將清除絕對式編碼器的多圈資料。", "zh-CN": "即将清除绝对式编码器的多圈数据。", en: "The multi-turn data of the absolute encoder is about to be cleared.", ja: "アブソリュートエンコーダのマルチターンデータをクリアします。" },
    "請確認：": { "zh-TW": "請確認：", "zh-CN": "请确认：", en: "Please confirm:", ja: "次の点を確認してください：" },
    "1. Servo 已關閉，並已用煞車或其他方式固定機構": { "zh-TW": "1. Servo 已關閉，並已用煞車或其他方式固定機構", "zh-CN": "1. Servo 已关闭，并已用煞车或其他方式固定机构", en: "1. The servo is OFF and the mechanism is held by the brake or another means", ja: "1. サーボが OFF で、ブレーキなどで機構が固定されている" },
    "2. 清除後必須關閉控制電源再重新送電，位置座標才會重新建立": { "zh-TW": "2. 清除後必須關閉控制電源再重新送電，位置座標才會重新建立", "zh-CN": "2. 清除后必须关闭控制电源再重新上电，位置座标才会重新创建", en: "2. After clearing, turn the control power off and on again so that the position coordinates are re-established", ja: "2. クリア後は制御電源を切って再投入しないと、位置座標が再構築されない" },
    "3. 透過 Modbus 清除時不會發生 Err27.1，但仍然要重新送電": { "zh-TW": "3. 透過 Modbus 清除時不會發生 Err27.1，但仍然要重新送電", "zh-CN": "3. 通过 Modbus 清除时不会发生 Err27.1，但仍然要重新上电", en: "3. Err27.1 does not occur when clearing over Modbus, but the power must still be cycled", ja: "3. Modbus 経由のクリアでは Err27.1 は発生しませんが、電源の再投入は必要です" },
    "是否繼續？": { "zh-TW": "是否繼續？", "zh-CN": "是否继续？", en: "Do you want to continue?", ja: "続行しますか？" },
    "已送出清除多圈資料（4100h = 6165h），請關閉控制電源後重新送電。": { "zh-TW": "已送出清除多圈資料（4100h = 6165h），請關閉控制電源後重新送電。", "zh-CN": "已送出清除多圈数据（4100h = 6165h），请关闭控制电源后重新上电。", en: "The multi-turn data clear command was sent (4100h = 6165h). Turn the control power off and on again.", ja: "マルチターンデータのクリアを送信しました（4100h = 6165h）。制御電源を切って再投入してください。" },
    "已送出清除多圈資料。": { "zh-TW": "已送出清除多圈資料。", "zh-CN": "已送出清除多圈数据。", en: "The multi-turn data clear command was sent.", ja: "マルチターンデータのクリアを送信しました。" },
    "請關閉控制電源，再重新送電。": { "zh-TW": "請關閉控制電源，再重新送電。", "zh-CN": "请关闭控制电源，再重新上电。", en: "Turn the control power off and on again.", ja: "制御電源を切って再投入してください。" },
    "清除警報": { "zh-TW": "清除警報", "zh-CN": "清除警报", en: "Clear alarm", ja: "アラームのクリア" },
    "寫入值必須是 7274（十六進位）才會執行清除警報。": { "zh-TW": "寫入值必須是 7274（十六進位）才會執行清除警報。", "zh-CN": "写入值必须是 7274（十六进位）才会运行清除警报。", en: "The value to write must be 7274 (hexadecimal) to clear the alarm.", ja: "アラームをクリアするには、書き込み値を 7274（16 進数）にする必要があります。" },
    "已送出清除警報與警告（4102h = 7274h）。部分警報屬於不可清除類型，需重新送電。": { "zh-TW": "已送出清除警報與警告（4102h = 7274h）。部分警報屬於不可清除類型，需重新送電。", "zh-CN": "已送出清除警报与警告（4102h = 7274h）。部分警报属于不可清除类型，需重新上电。", en: "The alarm and warning clear command was sent (4102h = 7274h). Some alarms cannot be cleared this way and require a power cycle.", ja: "アラームと警告のクリアを送信しました（4102h = 7274h）。一部のアラームはクリアできず、電源の再投入が必要です。" },
    "只讀取、寫入時保留原值，不允許在此修改": { "zh-TW": "只讀取、寫入時保留原值，不允許在此修改", "zh-CN": "只读取、写入时保留原值，不允许在此修改", en: "Read only. The original value is preserved when writing; it cannot be changed here", ja: "読み出し専用です。書き込み時は元の値が保持され、ここでは変更できません" },
    "寫入前須先按 Read。寫入時會保留 Pr60.48，寫入後自動讀回驗證。Pr60.48 到 Pr60.55 屬於重新上電後生效的參數。": { "zh-TW": "寫入前須先按 Read。寫入時會保留 Pr60.48，寫入後自動讀回驗證。Pr60.48 到 Pr60.55 屬於重新上電後生效的參數。", "zh-CN": "写入前须先按 Read。写入时会保留 Pr60.48，写入后自动读回验证。Pr60.48 到 Pr60.55 属于重新上电后生效的参数。", en: "Press Read before writing. Pr60.48 is preserved when writing, and the values are read back and verified automatically afterwards. Pr60.48 to Pr60.55 take effect after the power is cycled.", ja: "書き込む前に Read を押してください。書き込み時は Pr60.48 が保持され、書き込み後に自動で読み戻して検証します。Pr60.48〜Pr60.55 は電源再投入後に有効になるパラメータです。" },
    "{0} : 未定義值": { "zh-TW": "{0} : 未定義值", "zh-CN": "{0} : 未定义值", en: "{0} : undefined", ja: "{0} : 未定義" },
    "此驅動器韌體不支援加減速時間單位（Pr60.56、Pr60.57 需功能增強版 8 以上），時間單位固定為 ms。": { "zh-TW": "此驅動器韌體不支援加減速時間單位（Pr60.56、Pr60.57 需功能增強版 8 以上），時間單位固定為 ms。", "zh-CN": "此驱动器固件不支持加减速时间单位（Pr60.56、Pr60.57 需功能增强版 8 以上），时间单位固定为 ms。", en: "This drive's firmware does not support the acceleration/deceleration time unit (Pr60.56 and Pr60.57 require function enhancement version 8 or later). The time unit is fixed to ms.", ja: "このドライバのファームウェアは加減速時間の単位に対応していません（Pr60.56、Pr60.57 には機能拡張版 8 以上が必要）。時間の単位は ms に固定されます。" },
    "Block 參數讀取": { "zh-TW": "Block 參數讀取", "zh-CN": "Block 参数读取", en: "Read Block parameters", ja: "Block パラメータの読み出し" },
    "Block 參數讀取完成。": { "zh-TW": "Block 參數讀取完成。", "zh-CN": "Block 参数读取完成。", en: "Block parameters read.", ja: "Block パラメータの読み出しが完了しました。" },
    "Block 參數自動讀取失敗：{0}": { "zh-TW": "Block 參數自動讀取失敗：{0}", "zh-CN": "Block 参数自动读取失败：{0}", en: "Automatic read of Block parameters failed: {0}", ja: "Block パラメータの自動読み出しに失敗しました：{0}" },
    "Block 參數寫入": { "zh-TW": "Block 參數寫入", "zh-CN": "Block 参数写入", en: "Write Block parameters", ja: "Block パラメータの書き込み" },
    "有 {0} 個欄位不是有效的整數（已標示紅框），請修正後再寫入。": { "zh-TW": "有 {0} 個欄位不是有效的整數（已標示紅框），請修正後再寫入。", "zh-CN": "有 {0} 个字段不是有效的整数（已标示红框），请修正后再写入。", en: "{0} field(s) are not valid integers (marked with a red border). Correct them and write again.", ja: "{0} 個の欄が有効な整数ではありません（赤枠で表示）。修正してから書き込んでください。" },
    "輸入資料有錯誤，未寫入：": { "zh-TW": "輸入資料有錯誤，未寫入：", "zh-CN": "输入数据有错误，未写入：", en: "The input contains errors. Nothing was written:", ja: "入力にエラーがあるため、書き込みませんでした：" },
    "... 另有 {0} 項": { "zh-TW": "... 另有 {0} 項", "zh-CN": "... 另有 {0} 项", en: "... and {0} more", ja: "... 他に {0} 件" },
    "仍要寫入嗎？": { "zh-TW": "仍要寫入嗎？", "zh-CN": "仍要写入吗？", en: "Write anyway?", ja: "それでも書き込みますか？" },
    "Block 參數寫入完成，讀回驗證一致。尚未寫入 EEPROM，斷電後會遺失。": { "zh-TW": "Block 參數寫入完成，讀回驗證一致。尚未寫入 EEPROM，斷電後會遺失。", "zh-CN": "Block 参数写入完成，读回验证一致。尚未写入 EEPROM，断电后会遗失。", en: "Block parameters written and verified by read-back. They are not yet saved to EEPROM and will be lost at power-off.", ja: "Block パラメータを書き込み、読み戻しで一致を確認しました。EEPROM には未保存のため、電源を切ると失われます。" },
    "Block 參數已寫入並讀回驗證一致。": { "zh-TW": "Block 參數已寫入並讀回驗證一致。", "zh-CN": "Block 参数已写入并读回验证一致。", en: "The Block parameters were written and verified by read-back.", ja: "Block パラメータを書き込み、読み戻しで一致を確認しました。" },
    "尚未寫入 EEPROM，斷電後會遺失；要永久保存請按 EEP。": { "zh-TW": "尚未寫入 EEPROM，斷電後會遺失；要永久保存請按 EEP。", "zh-CN": "尚未写入 EEPROM，断电后会遗失；要永久保存请按 EEP。", en: "They are not yet saved to EEPROM and will be lost at power-off. Press EEP to save them permanently.", ja: "EEPROM には未保存のため、電源を切ると失われます。永続的に保存するには EEP を押してください。" },
    "Block 參數讀回不一致：{0}": { "zh-TW": "Block 參數讀回不一致：{0}", "zh-CN": "Block 参数读回不一致：{0}", en: "Block parameter read-back mismatch: {0}", ja: "Block パラメータの読み戻しが一致しません：{0}" },
    "寫入後讀回有 {0} 個暫存器與寫入值不同：": { "zh-TW": "寫入後讀回有 {0} 個暫存器與寫入值不同：", "zh-CN": "写入后读回有 {0} 个寄存器与写入值不同：", en: "After writing, {0} register(s) read back differently from the written values:", ja: "書き込み後の読み戻しで、{0} 個のレジスタが書き込み値と異なっていました：" },
    "Pr60.48 到 Pr60.55 屬於重新上電後生效的參數，讀回值可能維持舊值；其餘位址不一致請重新讀取確認。": { "zh-TW": "Pr60.48 到 Pr60.55 屬於重新上電後生效的參數，讀回值可能維持舊值；其餘位址不一致請重新讀取確認。", "zh-CN": "Pr60.48 到 Pr60.55 属于重新上电后生效的参数，读回值可能维持旧值；其余地址不一致请重新读取确认。", en: "Pr60.48 to Pr60.55 take effect after a power cycle, so they may still read back the old value. For mismatches at any other address, read again to check.", ja: "Pr60.48〜Pr60.55 は電源再投入後に有効になるパラメータのため、読み戻し値が古いままの場合があります。それ以外のアドレスの不一致は、再度読み出して確認してください。" },
    "即將把驅動器內「全部」伺服參數寫入 EEPROM（不只 Block 資料），約需 0.3 秒。": { "zh-TW": "即將把驅動器內「全部」伺服參數寫入 EEPROM（不只 Block 資料），約需 0.3 秒。", "zh-CN": "即将把驱动器内「全部」伺服参数写入 EEPROM（不只 Block 数据），约需 0.3 秒。", en: "ALL servo parameters in the drive (not only the Block data) are about to be written to EEPROM. This takes about 0.3 seconds.", ja: "ドライバ内の「すべての」サーボパラメータ（Block データだけではありません）を EEPROM に書き込みます。約 0.3 秒かかります。" },
    "寫入期間請勿切斷電源。": { "zh-TW": "寫入期間請勿切斷電源。", "zh-CN": "写入期间请勿切断电源。", en: "Do not turn off the power while writing.", ja: "書き込み中は電源を切らないでください。" },
    "已寫入 EEPROM（1020h = 6173h）。": { "zh-TW": "已寫入 EEPROM（1020h = 6173h）。", "zh-CN": "已写入 EEPROM（1020h = 6173h）。", en: "Written to EEPROM (1020h = 6173h).", ja: "EEPROM に書き込みました（1020h = 6173h）。" },
    "已寫入 EEPROM。": { "zh-TW": "已寫入 EEPROM。", "zh-CN": "已写入 EEPROM。", en: "Written to EEPROM.", ja: "EEPROM に書き込みました。" },
    "寫入 EEPROM": { "zh-TW": "寫入 EEPROM", "zh-CN": "写入 EEPROM", en: "Write to EEPROM", ja: "EEPROM への書き込み" },
    "尚未讀取。修改的列會以綠底標示。": { "zh-TW": "尚未讀取。修改的列會以綠底標示。", "zh-CN": "尚未读取。修改的列会以绿底标示。", en: "Not read yet. Modified rows are highlighted in green.", ja: "未読み出しです。変更した行は緑色で表示されます。" },
    "Block {0} 的輸入值無效：{1}（十進位須為 32 位元整數，十六進位須為 1 到 8 位）": { "zh-TW": "Block {0} 的輸入值無效：{1}（十進位須為 32 位元整數，十六進位須為 1 到 8 位）", "zh-CN": "Block {0} 的输入值无效：{1}（十进位须为 32 位整数，十六进位须为 1 到 8 位）", en: "Invalid value for Block {0}: {1} (decimal must be a 32-bit integer; hexadecimal must be 1 to 8 digits)", ja: "Block {0} の入力値が無効です：{1}（10 進数は 32 ビット整数、16 進数は 1〜8 桁）" },
    "Block 規劃讀取": { "zh-TW": "Block 規劃讀取", "zh-CN": "Block 规划读取", en: "Read Block plan", ja: "Block プランの読み出し" },
    "讀取中 {0} / {1}": { "zh-TW": "讀取中 {0} / {1}", "zh-CN": "读取中 {0} / {1}", en: "Reading {0} / {1}", ja: "読み出し中 {0} / {1}" },
    "讀取完成。修改的列會以綠底標示。": { "zh-TW": "讀取完成。修改的列會以綠底標示。", "zh-CN": "读取完成。修改的列会以绿底标示。", en: "Read complete. Modified rows are highlighted in green.", ja: "読み出しが完了しました。変更した行は緑色で表示されます。" },
    "Block 規劃讀取完成（256 個 Block）。": { "zh-TW": "Block 規劃讀取完成（256 個 Block）。", "zh-CN": "Block 规划读取完成（256 个 Block）。", en: "Block plan read (256 Blocks).", ja: "Block プランの読み出しが完了しました（256 個の Block）。" },
    "讀取失敗，畫面資料維持不變。": { "zh-TW": "讀取失敗，畫面資料維持不變。", "zh-CN": "读取失败，画面数据维持不变。", en: "Read failed. The data on screen is unchanged.", ja: "読み出しに失敗しました。画面のデータは変更されません。" },
    "Block 規劃自動讀取失敗：{0}": { "zh-TW": "Block 規劃自動讀取失敗：{0}", "zh-CN": "Block 规划自动读取失败：{0}", en: "Automatic read of the Block plan failed: {0}", ja: "Block プランの自動読み出しに失敗しました：{0}" },
    "Block 參數頁有無效的欄位，無法檢查。請先修正。": { "zh-TW": "Block 參數頁有無效的欄位，無法檢查。請先修正。", "zh-CN": "Block 参数页有无效的字段，无法检查。请先修正。", en: "The Block parameter page has invalid fields, so the check cannot run. Correct them first.", ja: "Block パラメータのページに無効な欄があるため、チェックできません。先に修正してください。" },
    "Block 規劃檢查：沒有發現引用到 0 的速度或加減速時間。": { "zh-TW": "Block 規劃檢查：沒有發現引用到 0 的速度或加減速時間。", "zh-CN": "Block 规划检查：没有发现引用到 0 的速度或加减速时间。", en: "Block plan check: no reference to a velocity or acceleration/deceleration time of 0 was found.", ja: "Block プランのチェック：値が 0 の速度または加減速時間を参照している箇所はありません。" },
    "沒有發現引用到數值為 0 的速度、加速時間或減速時間。": { "zh-TW": "沒有發現引用到數值為 0 的速度、加速時間或減速時間。", "zh-CN": "没有发现引用到数值为 0 的速度、加速时间或减速时间。", en: "No reference to a velocity, acceleration time or deceleration time whose value is 0 was found.", ja: "値が 0 の速度、加速時間、減速時間を参照している箇所は見つかりませんでした。" },
    "Block 規劃檢查發現 {0} 個問題。": { "zh-TW": "Block 規劃檢查發現 {0} 個問題。", "zh-CN": "Block 规划检查发现 {0} 个问题。", en: "The Block plan check found {0} problems.", ja: "Block プランのチェックで {0} 件の問題が見つかりました。" },
    "發現 {0} 個問題（啟動時會發生 Err93.1）：": { "zh-TW": "發現 {0} 個問題（啟動時會發生 Err93.1）：", "zh-CN": "发现 {0} 个问题（启动时会发生 Err93.1）：", en: "{0} problems found (Err93.1 will occur at start-up):", ja: "{0} 件の問題が見つかりました（起動時に Err93.1 が発生します）：" },
    "Block 規劃寫入": { "zh-TW": "Block 規劃寫入", "zh-CN": "Block 规划写入", en: "Write Block plan", ja: "Block プランの書き込み" },
    "尚未成功讀取過 Block 規劃。": { "zh-TW": "尚未成功讀取過 Block 規劃。", "zh-CN": "尚未成功读取过 Block 规划。", en: "The Block plan has not been read successfully yet.", ja: "Block プランをまだ正常に読み出していません。" },
    "寫入會以畫面上的 256 個 Block 覆蓋驅動器內容，沒有填寫的列會變成 0。": { "zh-TW": "寫入會以畫面上的 256 個 Block 覆蓋驅動器內容，沒有填寫的列會變成 0。", "zh-CN": "写入会以画面上的 256 个 Block 覆盖驱动器内容，没有填写的列会变成 0。", en: "Writing will overwrite the drive with the 256 Blocks on screen; rows that are left empty become 0.", ja: "書き込むと、画面上の 256 個の Block でドライバの内容が上書きされ、未入力の行は 0 になります。" },
    "發現 {0} 個引用到數值為 0 的速度或加減速時間（啟動時會發生 Err93.1）：": { "zh-TW": "發現 {0} 個引用到數值為 0 的速度或加減速時間（啟動時會發生 Err93.1）：", "zh-CN": "发现 {0} 个引用到数值为 0 的速度或加减速时间（启动时会发生 Err93.1）：", en: "{0} references to a velocity or acceleration/deceleration time of 0 were found (Err93.1 will occur at start-up):", ja: "値が 0 の速度または加減速時間を参照している箇所が {0} 件あります（起動時に Err93.1 が発生します）：" },
    "寫入與驗證中 {0} / {1}": { "zh-TW": "寫入與驗證中 {0} / {1}", "zh-CN": "写入与验证中 {0} / {1}", en: "Writing and verifying {0} / {1}", ja: "書き込み・検証中 {0} / {1}" },
    "寫入完成，讀回驗證一致。": { "zh-TW": "寫入完成，讀回驗證一致。", "zh-CN": "写入完成，读回验证一致。", en: "Write complete. The read-back matches.", ja: "書き込みが完了し、読み戻しで一致を確認しました。" },
    "Block 規劃寫入完成，讀回驗證一致。尚未寫入 EEPROM。": { "zh-TW": "Block 規劃寫入完成，讀回驗證一致。尚未寫入 EEPROM。", "zh-CN": "Block 规划写入完成，读回验证一致。尚未写入 EEPROM。", en: "Block plan written and verified by read-back. Not yet saved to EEPROM.", ja: "Block プランを書き込み、読み戻しで一致を確認しました。EEPROM には未保存です。" },
    "Block 規劃已寫入並讀回驗證一致。": { "zh-TW": "Block 規劃已寫入並讀回驗證一致。", "zh-CN": "Block 规划已写入并读回验证一致。", en: "The Block plan was written and verified by read-back.", ja: "Block プランを書き込み、読み戻しで一致を確認しました。" },
    "讀回驗證失敗，共 {0} 個 Block 不一致。": { "zh-TW": "讀回驗證失敗，共 {0} 個 Block 不一致。", "zh-CN": "读回验证失败，共 {0} 个 Block 不一致。", en: "Read-back verification failed: {0} Blocks do not match.", ja: "読み戻しの検証に失敗しました：{0} 個の Block が一致しません。" },
    "Block 規劃讀回不一致：{0}": { "zh-TW": "Block 規劃讀回不一致：{0}", "zh-CN": "Block 规划读回不一致：{0}", en: "Block plan read-back mismatch: {0}", ja: "Block プランの読み戻しが一致しません：{0}" },
    "寫入後讀回有 {0} 個 Block 與畫面不同：": { "zh-TW": "寫入後讀回有 {0} 個 Block 與畫面不同：", "zh-CN": "写入后读回有 {0} 个 Block 与画面不同：", en: "After writing, {0} Blocks read back differently from the screen:", ja: "書き込み後の読み戻しで、{0} 個の Block が画面と異なっていました：" },
    "請重新讀取確認。": { "zh-TW": "請重新讀取確認。", "zh-CN": "请重新读取确认。", en: "Read again to check.", ja: "再度読み出して確認してください。" },
    "試運轉模式會暫時改寫驅動器內的下列資料：": { "zh-TW": "試運轉模式會暫時改寫驅動器內的下列資料：", "zh-CN": "试运转模式会暂时改写驱动器内的下列数据：", en: "Trial operation mode temporarily overwrites the following data in the drive:", ja: "試運転モードでは、ドライバ内の次のデータを一時的に書き換えます：" },
    "• Block 254 與 Block 255（測試用的正向與負向 JOG）": { "zh-TW": "• Block 254 與 Block 255（測試用的正向與負向 JOG）", "zh-CN": "• Block 254 与 Block 255（测试用的正向与负向 JOG）", en: "• Block 254 and Block 255 (forward and reverse JOG for testing)", ja: "• Block 254 と Block 255（テスト用の正方向・負方向 JOG）" },
    "• Velocity 15、Acceleration 15、Deceleration 15": { "zh-TW": "• Velocity 15、Acceleration 15、Deceleration 15", "zh-CN": "• Velocity 15、Acceleration 15、Deceleration 15", en: "• Velocity 15, Acceleration 15, Deceleration 15", ja: "• Velocity 15、Acceleration 15、Deceleration 15" },
    "原本的資料會先備份，關閉試運轉模式或關閉連線時自動還原。": { "zh-TW": "原本的資料會先備份，關閉試運轉模式或關閉連線時自動還原。", "zh-CN": "原本的数据会先备份，关闭试运转模式或关闭连接时自动还原。", en: "The original data is backed up first and restored automatically when trial operation mode ends or the connection is closed.", ja: "元のデータは先にバックアップされ、試運転モードの終了時または接続を閉じるときに自動で復元されます。" },
    "如果試運轉期間直接關閉網頁或斷線，驅動器內會殘留測試資料，請重新讀取確認。": { "zh-TW": "如果試運轉期間直接關閉網頁或斷線，驅動器內會殘留測試資料，請重新讀取確認。", "zh-CN": "如果试运转期间直接关闭网页或断线，驱动器内会残留测试数据，请重新读取确认。", en: "If you close the page or the connection drops during trial operation, test data remains in the drive. Read it again to check.", ja: "試運転中にページを閉じたり接続が切れたりすると、テストデータがドライバに残ります。再度読み出して確認してください。" },
    "警告：JOG 會讓馬達實際轉動。": { "zh-TW": "警告：JOG 會讓馬達實際轉動。", "zh-CN": "警告：JOG 会让电机实际转动。", en: "WARNING: JOG makes the motor actually rotate.", ja: "警告：JOG ではモータが実際に回転します。" },
    "1. 馬達與機構周圍沒有人員與障礙物": { "zh-TW": "1. 馬達與機構周圍沒有人員與障礙物", "zh-CN": "1. 电机与机构周围没有人员与障碍物", en: "1. There are no people or obstacles around the motor and the mechanism", ja: "1. モータと機構の周囲に人や障害物がない" },
    "2. 已備妥外部緊急停止": { "zh-TW": "2. 已備妥外部緊急停止", "zh-CN": "2. 已备妥外部紧急停止", en: "2. An external emergency stop is ready", ja: "2. 外部の非常停止を用意してある" },
    "3. 驅動器已設定為 Modbus 啟動的 Block 運轉（Pr6.28 為 1，Pr5.37 為 1 或 2，並已重新上電）": { "zh-TW": "3. 驅動器已設定為 Modbus 啟動的 Block 運轉（Pr6.28 為 1，Pr5.37 為 1 或 2，並已重新上電）", "zh-CN": "3. 驱动器已设置为 Modbus 启动的 Block 运转（Pr6.28 为 1，Pr5.37 为 1 或 2，并已重新上电）", en: "3. The drive is set up for Modbus-started Block operation (Pr6.28 = 1, Pr5.37 = 1 or 2, and the power has been cycled)", ja: "3. ドライバが Modbus 起動の Block 運転に設定されている（Pr6.28 = 1、Pr5.37 = 1 または 2、電源再投入済み）" },
    "只有按住 JOG 按鈕時馬達才會轉，放開、切換視窗或關閉分頁都會立刻減速停止。": { "zh-TW": "只有按住 JOG 按鈕時馬達才會轉，放開、切換視窗或關閉分頁都會立刻減速停止。", "zh-CN": "只有按住 JOG 按钮时电机才会转，放开、切换窗口或关闭标签页都会立刻减速停止。", en: "The motor runs only while the JOG button is held. Releasing it, switching windows or closing the tab decelerates the motor to a stop immediately.", ja: "JOG ボタンを押している間だけモータが回転します。ボタンを離す、ウィンドウを切り替える、タブを閉じると直ちに減速停止します。" },
    "Velocity 必須是 1 到 20000 的整數（r/min）": { "zh-TW": "Velocity 必須是 1 到 20000 的整數（r/min）", "zh-CN": "Velocity 必须是 1 到 20000 的整数（r/min）", en: "Velocity must be an integer from 1 to 20000 (r/min)", ja: "Velocity は 1 〜 20000 の整数にしてください（r/min）" },
    "Acceleration 必須是 1 到 10000 的整數": { "zh-TW": "Acceleration 必須是 1 到 10000 的整數", "zh-CN": "Acceleration 必须是 1 到 10000 的整数", en: "Acceleration must be an integer from 1 to 10000", ja: "Acceleration は 1 〜 10000 の整数にしてください" },
    "Deceleration 必須是 1 到 10000 的整數": { "zh-TW": "Deceleration 必須是 1 到 10000 的整數", "zh-CN": "Deceleration 必须是 1 到 10000 的整数", en: "Deceleration must be an integer from 1 to 10000", ja: "Deceleration は 1 〜 10000 の整数にしてください" },
    "重新讀取 Block 參數失敗：{0}": { "zh-TW": "重新讀取 Block 參數失敗：{0}", "zh-CN": "重新读取 Block 参数失败：{0}", en: "Failed to re-read the Block parameters: {0}", ja: "Block パラメータの再読み出しに失敗しました：{0}" },
    "啟用試運轉": { "zh-TW": "啟用試運轉", "zh-CN": "激活试运转", en: "Enable trial operation", ja: "試運転の有効化" },
    "試運轉參數有錯誤：": { "zh-TW": "試運轉參數有錯誤：", "zh-CN": "试运转参数有错误：", en: "The trial operation parameters contain errors:", ja: "試運転のパラメータにエラーがあります：" },
    "試運轉已啟用：Block 254 為正向 JOG、Block 255 為負向 JOG，使用第 15 組速度與加減速。": { "zh-TW": "試運轉已啟用：Block 254 為正向 JOG、Block 255 為負向 JOG，使用第 15 組速度與加減速。", "zh-CN": "试运转已激活：Block 254 为正向 JOG、Block 255 为负向 JOG，使用第 15 组速度与加减速。", en: "Trial operation enabled: Block 254 is forward JOG and Block 255 is reverse JOG, using velocity and acceleration/deceleration set 15.", ja: "試運転を有効にしました：Block 254 が正方向 JOG、Block 255 が負方向 JOG で、第 15 組の速度と加減速を使用します。" },
    "結束試運轉": { "zh-TW": "結束試運轉", "zh-CN": "结束试运转", en: "End trial operation", ja: "試運転の終了" },
    "試運轉已結束，Block 254、255 與第 15 組參數已還原。": { "zh-TW": "試運轉已結束，Block 254、255 與第 15 組參數已還原。", "zh-CN": "试运转已结束，Block 254、255 与第 15 组参数已还原。", en: "Trial operation ended. Blocks 254 and 255 and parameter set 15 have been restored.", ja: "試運転を終了しました。Block 254、255 と第 15 組のパラメータを復元しました。" },
    "Servo 已切換為 {0}（若 SRV-ON 也指定給 I/F 連接器輸入，兩者為 AND 關係）。": { "zh-TW": "Servo 已切換為 {0}（若 SRV-ON 也指定給 I/F 連接器輸入，兩者為 AND 關係）。", "zh-CN": "Servo 已切换为 {0}（若 SRV-ON 也指定给 I/F 连接器输入，两者为 AND 关系）。", en: "The servo was switched {0} (if SRV-ON is also assigned to an I/F connector input, the two are ANDed).", ja: "サーボを {0} に切り替えました（SRV-ON が I/F コネクタ入力にも割り当てられている場合、両者は AND 条件になります）。" },
    "Block 編號必須是 0 到 255 的整數。": { "zh-TW": "Block 編號必須是 0 到 255 的整數。", "zh-CN": "Block 编号必须是 0 到 255 的整数。", en: "The Block number must be an integer from 0 to 255.", ja: "Block 番号は 0 〜 255 の整数にしてください。" },
    "Servo 尚未 ON，請先按 Servo ON。": { "zh-TW": "Servo 尚未 ON，請先按 Servo ON。", "zh-CN": "Servo 尚未 ON，请先按 Servo ON。", en: "The servo is not ON. Press Servo ON first.", ja: "サーボが ON ではありません。先に Servo ON を押してください。" },
    "驅動器目前有警報，請先排除並清除。": { "zh-TW": "驅動器目前有警報，請先排除並清除。", "zh-CN": "驱动器目前有警报，请先排除并清除。", en: "The drive has an active alarm. Remove the cause and clear it first.", ja: "ドライバにアラームが発生しています。原因を取り除いてクリアしてください。" },
    "Block {0} 已啟動。若驅動器未動作，請確認 Pr6.28 與 Block 規劃內容。": { "zh-TW": "Block {0} 已啟動。若驅動器未動作，請確認 Pr6.28 與 Block 規劃內容。", "zh-CN": "Block {0} 已启动。若驱动器未动作，请确认 Pr6.28 与 Block 规划内容。", en: "Block {0} started. If the drive does not move, check Pr6.28 and the Block plan.", ja: "Block {0} を起動しました。ドライバが動作しない場合は、Pr6.28 と Block プランの内容を確認してください。" },
    "{0}完成，馬達已低於 30 r/min。": { "zh-TW": "{0}完成，馬達已低於 30 r/min。", "zh-CN": "{0}完成，电机已低于 30 r/min。", en: "{0} completed. The motor is below 30 r/min.", ja: "{0}が完了し、モータが 30 r/min 未満になりました。" },
    "停止後馬達仍未低於 30 r/min。": { "zh-TW": "停止後馬達仍未低於 30 r/min。", "zh-CN": "停止后电机仍未低于 30 r/min。", en: "The motor is still not below 30 r/min after stopping.", ja: "停止後もモータが 30 r/min 未満になりません。" },
    "停止命令已送出，但馬達在時限內仍未停止。": { "zh-TW": "停止命令已送出，但馬達在時限內仍未停止。", "zh-CN": "停止命令已送出，但电机在时限内仍未停止。", en: "The stop command was sent, but the motor did not stop within the time limit.", ja: "停止コマンドを送信しましたが、モータが制限時間内に停止しませんでした。" },
    "請立刻使用外部緊急停止！": { "zh-TW": "請立刻使用外部緊急停止！", "zh-CN": "请立刻使用外部紧急停止！", en: "Use the external emergency stop immediately!", ja: "直ちに外部の非常停止を使用してください！" },
    "停止命令": { "zh-TW": "停止命令", "zh-CN": "停止命令", en: "Stop command", ja: "停止コマンド" },
    "JOG 參數有錯誤：": { "zh-TW": "JOG 參數有錯誤：", "zh-CN": "JOG 参数有错误：", en: "The JOG parameters contain errors:", ja: "JOG のパラメータにエラーがあります：" },
    "JOG 按鈕放開": { "zh-TW": "JOG 按鈕放開", "zh-CN": "JOG 按钮放开", en: "the JOG button was released", ja: "JOG ボタンが離されました" },
    "JOG 按鍵放開": { "zh-TW": "JOG 按鍵放開", "zh-CN": "JOG 按键放开", en: "the JOG key was released", ja: "JOG キーが離されました" },
    "JOG 按鈕失去焦點": { "zh-TW": "JOG 按鈕失去焦點", "zh-CN": "JOG 按钮失去焦点", en: "the JOG button lost focus", ja: "JOG ボタンがフォーカスを失いました" },
    "視窗失去焦點": { "zh-TW": "視窗失去焦點", "zh-CN": "窗口失去焦点", en: "the window lost focus", ja: "ウィンドウがフォーカスを失いました" },
    "分頁被隱藏": { "zh-TW": "分頁被隱藏", "zh-CN": "标签页被隐藏", en: "the tab was hidden", ja: "タブが非表示になりました" },
    "頁面關閉": { "zh-TW": "頁面關閉", "zh-CN": "页面关闭", en: "the page was closed", ja: "ページが閉じられました" },
    "啟用通訊權保護": { "zh-TW": "啟用通訊權保護", "zh-CN": "激活通信权保护", en: "Enable communication right protection", ja: "通信権保護の有効化" },
    "逾時時間必須是 100 到 10000 毫秒（對應 Pr5.40，上限 10000）。": { "zh-TW": "逾時時間必須是 100 到 10000 毫秒（對應 Pr5.40，上限 10000）。", "zh-CN": "超时时间必须是 100 到 10000 毫秒（对应 Pr5.40，上限 10000）。", en: "The timeout must be 100 to 10000 ms (corresponds to Pr5.40; the maximum is 10000).", ja: "タイムアウト時間は 100 〜 10000 ミリ秒にしてください（Pr5.40 に対応。上限は 10000）。" },
    "Pr5.40（通訊逾時時間）目前為 0，代表逾時保護不會生效。": { "zh-TW": "Pr5.40（通訊逾時時間）目前為 0，代表逾時保護不會生效。", "zh-CN": "Pr5.40（通信超时时间）目前为 0，代表超时保护不会生效。", en: "Pr5.40 (communication timeout) is currently 0, so timeout protection will not work.", ja: "Pr5.40（通信タイムアウト時間）が現在 0 のため、タイムアウト保護は機能しません。" },
    "要把 Pr5.40 寫成 {0} 毫秒嗎？": { "zh-TW": "要把 Pr5.40 寫成 {0} 毫秒嗎？", "zh-CN": "要把 Pr5.40 写成 {0} 毫秒吗？", en: "Write {0} ms to Pr5.40?", ja: "Pr5.40 に {0} ミリ秒を書き込みますか？" },
    "（寫入後只存在驅動器記憶體，要永久保存需按 EEP。）": { "zh-TW": "（寫入後只存在驅動器記憶體，要永久保存需按 EEP。）", "zh-CN": "（写入后只存在驱动器内存，要永久保存需按 EEP。）", en: "(After writing, the value exists only in the drive's memory. Press EEP to save it permanently.)", ja: "（書き込み後はドライバのメモリ上にのみ存在します。永続的に保存するには EEP を押してください。）" },
    "寫入並啟用": { "zh-TW": "寫入並啟用", "zh-CN": "写入并激活", en: "Write and enable", ja: "書き込んで有効化" },
    "不寫入，只取得通訊權": { "zh-TW": "不寫入，只取得通訊權", "zh-CN": "不写入，只取得通信权", en: "Don't write; only acquire the communication right", ja: "書き込まず、通信権のみ取得" },
    "取消": { "zh-TW": "取消", "zh-CN": "取消", en: "Cancel", ja: "キャンセル" },
    "Pr5.40 已寫入 {0} ms。": { "zh-TW": "Pr5.40 已寫入 {0} ms。", "zh-CN": "Pr5.40 已写入 {0} ms。", en: "{0} ms was written to Pr5.40.", ja: "Pr5.40 に {0} ms を書き込みました。" },

    "錯誤的操作可能造成機械損壞或人員受傷，尤其是試運轉與 JOG。": { "zh-TW": "錯誤的操作可能造成機械損壞或人員受傷，尤其是試運轉與 JOG。", "zh-CN": "错误的操作可能造成机械损坏或人员受伤，尤其是试运转与 JOG。", en: "Incorrect operation may damage machinery or injure people, especially trial operation and JOG.", ja: "誤った操作は機械の損傷や人身事故につながるおそれがあります。特に試運転と JOG にご注意ください。" },
    "使用前請確認周圍安全並備妥外部緊急停止，使用風險由使用者自行承擔。": { "zh-TW": "使用前請確認周圍安全並備妥外部緊急停止，使用風險由使用者自行承擔。", "zh-CN": "使用前请确认周围安全并备妥外部紧急停止，使用风险由用户自行承担。", en: "Before use, make sure the surroundings are safe and an external emergency stop is ready. You use this tool at your own risk.", ja: "使用前に周囲の安全を確認し、外部の非常停止を用意してください。使用によるリスクは使用者の自己責任となります。" },
    "驅動器需先設定：Pr5.31 站號（不可為 0）、Pr5.37 為 1 或 2、Pr6.28 為 1（Block 運轉）。": { "zh-TW": "驅動器需先設定：Pr5.31 站號（不可為 0）、Pr5.37 為 1 或 2、Pr6.28 為 1（Block 運轉）。", "zh-CN": "驱动器需先设置：Pr5.31 站号（不可为 0）、Pr5.37 为 1 或 2、Pr6.28 为 1（Block 运转）。", en: "The drive must be set up first: Pr5.31 slave address (not 0), Pr5.37 = 1 or 2, Pr6.28 = 1 (Block operation).", ja: "ドライバを先に設定してください：Pr5.31 スレーブアドレス（0 は不可）、Pr5.37 = 1 または 2、Pr6.28 = 1（Block 運転）。" },

    "這個瀏覽器不支援 Web Serial，無法連接序列埠。請使用桌面版 Chrome、Edge 或較新版本的 Firefox，並以 HTTPS 或 localhost 開啟本頁。": { "zh-TW": "這個瀏覽器不支援 Web Serial，無法連接序列埠。請使用桌面版 Chrome、Edge 或較新版本的 Firefox，並以 HTTPS 或 localhost 開啟本頁。", "zh-CN": "这个浏览器不支持 Web Serial，无法连接串口。请使用桌面版 Chrome、Edge 或较新版本的 Firefox，并以 HTTPS 或 localhost 打开本页。", en: "This browser does not support Web Serial, so it cannot connect to a serial port. Use desktop Chrome, Edge or a recent version of Firefox, and open this page over HTTPS or localhost.", ja: "このブラウザは Web Serial に対応していないため、シリアルポートに接続できません。デスクトップ版の Chrome、Edge、または新しいバージョンの Firefox を使用し、HTTPS または localhost でこのページを開いてください。" },

    "{0} {1} 已就緒。請按 Select Port 授權序列埠，再按 Open Port。": { "zh-TW": "{0} {1} 已就緒。請按 Select Port 授權序列埠，再按 Open Port。", "zh-CN": "{0} {1} 已就绪。请按 Select Port 授权串口，再按 Open Port。", en: "{0} {1} is ready. Press Select Port to authorize a serial port, then press Open Port.", ja: "{0} {1} の準備ができました。Select Port でシリアルポートを許可し、Open Port を押してください。" },
