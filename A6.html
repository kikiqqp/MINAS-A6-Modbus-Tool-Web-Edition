   第一部分：核心層
   內容：常數、工具函式、CRC16、Modbus 例外類別、Modbus 命令類別、位元組緩衝區。
   這一層完全不碰畫面，之後的通訊層與操作層都建立在它上面。
   對照文件：Panasonic SX-DSV03042 R6.0（Modbus communication and Block operation）。
   ========================================================================== */

// ---------- 版本與預設值 ----------
const APP_TITLE = 'Yauyih A6 Modbus Tool Web Edition';
const APP_VERSION = '2026/10/12';

// 站號預設值。文件 Pr5.31 設定範圍為 1 到 127（0 代表停用 Modbus），RS485 最多連 31 軸。
const DEFAULT_SLAVE_ADDRESS = 1;

// 文件 2-1-2：支援的傳輸速率（Pr5.29 與 Pr5.30），資料位元固定 8，同位檢查與停止位元由 Pr5.38 決定。
const BAUD_RATES = [2400, 4800, 9600, 19200, 38400, 57600, 115200, 230400];
const DEFAULT_BAUD_RATE = 115200;

// 通訊逾時與重試的預設值（單位：毫秒）。
// 一般操作回應很快（幾毫秒）。寫入 EEPROM 約 300 毫秒（文件 2-1-3-1），所以另外放寬。
const TIMEOUT_POLL_MS = 300;        // 輪詢用：較短，避免斷線時整個輪詢被拖慢
const TIMEOUT_USER_MS = 1000;       // 使用者操作用
const TIMEOUT_EEPROM_MS = 3000;     // 寫入 EEPROM 用
const RETRY_POLL = 1;               // 輪詢失敗後再試 1 次
const RETRY_USER = 2;               // 使用者操作失敗後再試 2 次
const LINK_LOST_FAILURES = 5;       // 連續失敗幾次就判定為通訊中斷

// ---------- 暫存器位址與魔術值（文件 2-1-4-4）----------
const REG_SAVE_ALL_PARAMETERS = 0x1020;   // 寫入 6173h 即寫入 EEPROM
const REG_ABSOLUTE_CLEAR = 0x4100;        // 寫入 6165h 清除多圈資料
const REG_TRIP_RESET = 0x4102;            // 寫入 7274h 清除警報與警告
const REG_COMM_RIGHT = 0x4300;            // 55h 取得通訊權，AAh 釋放通訊權
const REG_BLOCK_NUMBER = 0x4414;          // 指定要啟動的 Block 編號
const REG_BLOCK_PARAM_START = 0x4600;     // Block 動作參數起始位址（Pr60.00）
const REG_BLOCK_PLAN_START = 0x4800;      // Block 規劃起始位址（Pr56.000）
const MAGIC_SAVE_EEPROM = 0x6173;
const MAGIC_ABSOLUTE_CLEAR = 0x6165;
const MAGIC_TRIP_RESET = 0x7274;
const MAGIC_COMM_RIGHT_ACQUIRE = 0x55;
const MAGIC_COMM_RIGHT_RELEASE = 0xAA;

// ---------- 線圈位址（文件 2-1-4-3）----------
const COIL_SERVO_ON = 0x0060;     // Servo ON 輸入操作
const COIL_STROBE = 0x0120;       // STB 啟動輸入
const COIL_H_STOP = 0x0123;       // 立即停止輸入
const COIL_S_STOP = 0x0124;       // 減速停止輸入

// ---------- 伺服參數位址換算（文件 2-1-4-4，3000h 開頭）----------
// 位址 = 3000h + (Class × 100h) + (No × 2)，每個參數佔 2 個暫存器。
function servoParameterAddress(parameterClass, parameterNo) {
    return 0x3000 + (parameterClass * 0x100) + (parameterNo * 2);
}

// ==========================================================================
// 工具函式
// ==========================================================================

function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

function nowMs() {
    return performance.now();
}

function pad(value, width) {
    let text = String(value);
    while (text.length < width) { text = '0' + text; }
    return text;
}

// 轉成大寫十六進位字串並補零，例如 toHex(0x4D, 4) 得到 "004D"。
function toHex(value, width) {
    return pad((value >>> 0).toString(16).toUpperCase(), width);
}

// 位元組陣列轉成 "01 03 40 00" 這種字串，用於通訊記錄。
function toHexBytes(bytes, length) {
    const count = (length === undefined) ? bytes.length : length;
    const parts = [];
    for (let i = 0; i < count; i++) { parts.push(toHex(bytes[i], 2)); }
    return parts.join(' ');
}

// 轉成固定位元數的二進位字串，用於輸入輸出狀態的文字框（最多 32 位元）。
function toBinaryString(value, bits) {
    const text = pad((value >>> 0).toString(2), 32);
    return text.slice(32 - bits);
}

// 16 位元轉有號數。
function toInt16(word) {
    return (word & 0x8000) ? (word - 0x10000) : word;
}

// 兩個 16 位元暫存器合成 32 位元。文件規定低字組在前、高字組在後
// （文件 FC10 範例：Pr4.48 = 100000 寫成 86A0 0001）。
function toInt32(lowWord, highWord) {
    return ((highWord << 16) | lowWord) | 0;
}

function toUInt32(lowWord, highWord) {
    return ((highWord << 16) | lowWord) >>> 0;
}

// 32 位元轉成兩個暫存器（低字組在前），接受有號或無號數。
function int32ToWords(value) {
    return [value & 0xFFFF, (value >>> 16) & 0xFFFF];
}

function formatClock(date) {
    return pad(date.getHours(), 2) + ':' + pad(date.getMinutes(), 2) + ':' +
        pad(date.getSeconds(), 2) + '.' + pad(date.getMilliseconds(), 3);
}

// ==========================================================================
// CRC16（文件 2-1-4-1）
// 生成多項式 X16 + X15 + X2 + 1，也就是反射型的 0xA001。
// 重點：舊版 A6.html 的 CRC 表只有 48 項，造成 CRC 算錯、驅動器全部丟棄。
// 這裡改成程式啟動時自己算出 256 項，不會再有手打漏項的問題。
// ==========================================================================

const CRC16_TABLE = (function buildCrc16Table() {
    const table = new Uint16Array(256);
    for (let i = 0; i < 256; i++) {
        let crc = i;
        for (let bit = 0; bit < 8; bit++) {
            crc = (crc & 1) ? ((crc >>> 1) ^ 0xA001) : (crc >>> 1);
        }
        table[i] = crc;
    }
    return table;
})();

function calcCrc16(bytes, length) {
    let crc = 0xFFFF;
    for (let i = 0; i < length; i++) {
        crc = (crc >>> 8) ^ CRC16_TABLE[(crc ^ bytes[i]) & 0xFF];
    }
    return crc & 0xFFFF;
}

// 在封包尾端加上 CRC。文件規定低位元組先傳送（little endian）。
function appendCrc16(frameWithoutCrc) {
    const length = frameWithoutCrc.length;
    const frame = new Uint8Array(length + 2);
    frame.set(frameWithoutCrc, 0);
    const crc = calcCrc16(frameWithoutCrc, length);
    frame[length] = crc & 0xFF;
    frame[length + 1] = (crc >>> 8) & 0xFF;
    return frame;
}

function verifyCrc16(frame) {
    if (frame.length < 4) { return false; }
    const crc = calcCrc16(frame, frame.length - 2);
    return frame[frame.length - 2] === (crc & 0xFF) && frame[frame.length - 1] === ((crc >>> 8) & 0xFF);
}

// ==========================================================================
// Modbus 例外類別
// kind 的種類：
//   timeout   逾時（含只收到一半的封包）
//   crc       CRC 錯誤
//   frame     站號、功能碼、長度或內容不符
//   exception 裝置回覆例外碼（功能碼最高位元為 1），代表裝置明確拒絕
//   closed    連線已關閉或被中止
//   io        序列埠讀寫失敗
// ==========================================================================

// 文件 2-1-4-2 的例外碼：01 功能碼異常、02 資料位址異常、03 資料異常、04 回應處理異常。
const MODBUS_EXCEPTION_TEXT = {
    1: '異常功能碼 (01h)',
    2: '異常資料位址 (02h)',
    3: '異常資料 (03h)',
    4: '異常回應處理 (04h)'
};   // 值同時是多語系字典的 key，使用時以 lx(...) 或 t(...) 翻譯

// text 可以是字串或 LText（延遲翻譯物件），這樣顯示在記錄或對話框時能隨語言切換重翻。
class ModbusException extends LocalizedError {
    constructor(kind, text, exceptionCode) {
        super(text);
        this.name = 'ModbusException';
        this.kind = kind;
        this.exceptionCode = (exceptionCode === undefined) ? 0 : exceptionCode;
    }
}

// ==========================================================================
// Modbus 命令類別
// 每個命令物件負責三件事：產生要送出的位元組、告訴通訊層預期的回應長度、驗證回應。
// 類別名稱沿用 C# 版（ReadHoldingRegistersCommand 等），方便對照。
// ==========================================================================

class ModbusCommand {
    constructor(slaveAddress, functionCode, payload, expectedResponseLength, description) {
        this.slaveAddress = slaveAddress;
        this.functionCode = functionCode;
        this.payload = payload;                         // 功能碼之後、CRC 之前的位元組
        this.expectedResponseLength = expectedResponseLength;
        this.description = description;
        this.bytes = null;
    }

    getBytes() {
        if (this.bytes === null) {
            const body = new Uint8Array(2 + this.payload.length);
            body[0] = this.slaveAddress;
            body[1] = this.functionCode;
            body.set(this.payload, 2);
            this.bytes = appendCrc16(body);
        }
        return this.bytes;
    }

    // 驗證回應。CRC 已在通訊層檢查過，這裡檢查站號、功能碼與內容。
    // 遇到例外回應會丟出 kind 為 exception 的錯誤。
    validateResponse(response) {
        if (response.length < 5) {
            throw new ModbusException('frame', lx('回應長度不足：{0} 個位元組', response.length));
        }
        if (response[0] !== this.slaveAddress) {
            throw new ModbusException('frame', lx('站號不符：預期 {0}，收到 {1}', this.slaveAddress, response[0]));
        }
        if ((response[1] & 0x80) !== 0) {
            const code = response[2];
            const text = MODBUS_EXCEPTION_TEXT[code] ? lx(MODBUS_EXCEPTION_TEXT[code]) : lx('未知例外碼 {0}h', toHex(code, 2));
            throw new ModbusException('exception', lx('裝置回覆例外：{0}，命令：{1}', text, this.description), code);
        }
        if (response[1] !== this.functionCode) {
            throw new ModbusException('frame', lx('功能碼不符：預期 {0}h，收到 {1}h', toHex(this.functionCode, 2), toHex(response[1], 2)));
        }
        if (response.length !== this.expectedResponseLength) {
            throw new ModbusException('frame', lx('回應長度不符：預期 {0}，收到 {1}', this.expectedResponseLength, response.length));
        }
        this.validateBody(response);
    }

    validateBody(response) { /* 由子類別覆寫 */ }
}

// 讀取暫存器（功能碼 03h）。一次最多 125 個暫存器。
class ReadHoldingRegistersCommand extends ModbusCommand {
    constructor(slaveAddress, startAddress, registerCount) {
        if (registerCount < 1 || registerCount > 125) {
            throw new RangeError(t('讀取暫存器數量必須在 1 到 125 之間：{0}', registerCount));
        }
        super(slaveAddress, 0x03,
            Uint8Array.of(startAddress >> 8, startAddress & 0xFF, registerCount >> 8, registerCount & 0xFF),
            5 + registerCount * 2,
            lx('讀取暫存器 {0}h 共 {1} 個', toHex(startAddress, 4), registerCount));
        this.startAddress = startAddress;
        this.registerCount = registerCount;
    }

    validateBody(response) {
        if (response[2] !== this.registerCount * 2) {
            throw new ModbusException('frame', lx('資料位元組數不符：預期 {0}，收到 {1}', this.registerCount * 2, response[2]));
        }
    }

    // 取出回應中的暫存器值（每個 16 位元，高位元組在前）。
    static parseWords(response) {
        const count = response[2] >> 1;
        const words = new Array(count);
        for (let i = 0; i < count; i++) {
            words[i] = (response[3 + i * 2] << 8) | response[4 + i * 2];
        }
        return words;
    }
}

// 寫入單一暫存器（功能碼 06h）。注意：寫入伺服參數（3000h 開頭）必須改用 10h。
class WriteSingleRegisterCommand extends ModbusCommand {
    constructor(slaveAddress, address, value) {
        super(slaveAddress, 0x06,
            Uint8Array.of(address >> 8, address & 0xFF, (value >> 8) & 0xFF, value & 0xFF),
            8,
            lx('寫入暫存器 {0}h = {1}h', toHex(address, 4), toHex(value, 4)));
    }

    // 06h 的正常回應會原樣回傳位址與資料。
    validateBody(response) {
        for (let i = 0; i < 4; i++) {
            if (response[2 + i] !== this.payload[i]) {
                throw new ModbusException('frame', lx('寫入回應內容與命令不一致：{0}', this.description));
            }
        }
    }
}

// 寫入多個暫存器（功能碼 10h）。一次最多 123 個暫存器。
class WriteMultipleRegistersCommand extends ModbusCommand {
    constructor(slaveAddress, startAddress, words) {
        if (words.length < 1 || words.length > 123) {
            throw new RangeError(t('寫入暫存器數量必須在 1 到 123 之間：{0}', words.length));
        }
        const payload = new Uint8Array(5 + words.length * 2);
        payload[0] = startAddress >> 8;
        payload[1] = startAddress & 0xFF;
        payload[2] = words.length >> 8;
        payload[3] = words.length & 0xFF;
        payload[4] = words.length * 2;
        for (let i = 0; i < words.length; i++) {
            payload[5 + i * 2] = (words[i] >> 8) & 0xFF;
            payload[6 + i * 2] = words[i] & 0xFF;
        }
        super(slaveAddress, 0x10, payload, 8,
            lx('寫入多個暫存器 {0}h 共 {1} 個', toHex(startAddress, 4), words.length));
    }

    // 10h 的正常回應只回傳起始位址與暫存器數量。
    validateBody(response) {
        for (let i = 0; i < 4; i++) {
            if (response[2 + i] !== this.payload[i]) {
                throw new ModbusException('frame', lx('寫入回應內容與命令不一致：{0}', this.description));
            }
        }
    }
}

// 寫入單一線圈（功能碼 05h）。ON 為 FF00h，OFF 為 0000h（文件 2-1-4-2）。
class WriteSingleCoilCommand extends ModbusCommand {
    constructor(slaveAddress, address, isOn) {
        super(slaveAddress, 0x05,
            Uint8Array.of(address >> 8, address & 0xFF, isOn ? 0xFF : 0x00, 0x00),
            8,
            lx('寫入線圈 {0}h = {1}', toHex(address, 4), isOn ? 'ON' : 'OFF'));
    }

    validateBody(response) {
        for (let i = 0; i < 4; i++) {
            if (response[2 + i] !== this.payload[i]) {
                throw new ModbusException('frame', lx('寫入回應內容與命令不一致：{0}', this.description));
            }
        }
    }
}

// ==========================================================================
// 位元組緩衝區
// 序列埠的讀取迴圈把收到的資料放進來，通訊層用 waitFor 等待「至少收到 N 個位元組」。
// 這取代了 C# 版以 Sleep(1) 計次的等待方式，逾時改用真正的時間判斷。
// ==========================================================================

class ByteBuffer {
    constructor() {
        this.bytes = new Uint8Array(8192);
        this.length = 0;
        this.waiters = [];
    }

    append(chunk) {
        if (this.length + chunk.length > this.bytes.length) {
            const bigger = new Uint8Array(Math.max(this.bytes.length * 2, this.length + chunk.length));
            bigger.set(this.bytes.subarray(0, this.length), 0);
            this.bytes = bigger;
        }
        this.bytes.set(chunk, this.length);
        this.length += chunk.length;
        this._notify();
    }

    clear() {
        this.length = 0;
    }

    peek(index) {
        return this.bytes[index];
    }

    // 取出前 count 個位元組，剩下的往前移。
    take(count) {
        const taken = this.bytes.slice(0, count);
        this.bytes.copyWithin(0, count, this.length);
        this.length -= count;
        return taken;
    }

    // 等到緩衝區至少有 minLength 個位元組（回傳 true），或超過 timeoutMs 毫秒（回傳 false）。
    waitFor(minLength, timeoutMs) {
        if (this.length >= minLength) { return Promise.resolve(true); }
        if (timeoutMs <= 0) { return Promise.resolve(false); }
        const self = this;
        return new Promise(function (resolve) {
            const waiter = { minLength: minLength, resolve: resolve, timer: null };
            waiter.timer = setTimeout(function () {
                const index = self.waiters.indexOf(waiter);
                if (index >= 0) { self.waiters.splice(index, 1); }
                resolve(false);
            }, timeoutMs);
            self.waiters.push(waiter);
        });
    }

    // 連線關閉時，讓所有等待中的交易立刻結束。
    cancelAll() {
        const pending = this.waiters.splice(0, this.waiters.length);
        for (const waiter of pending) {
            clearTimeout(waiter.timer);
            waiter.resolve(false);
        }
    }

    _notify() {
        for (let i = this.waiters.length - 1; i >= 0; i--) {
            const waiter = this.waiters[i];
            if (this.length >= waiter.minLength) {
                clearTimeout(waiter.timer);
                this.waiters.splice(i, 1);
                waiter.resolve(true);
            }
        }
    }
}


/* ==========================================================================
   第二部分：通訊層
   內容：SerialLink（Web Serial 序列埠）、ModbusBus（交易引擎）、PollScheduler（輪詢排程）。

   設計重點（對應 C# 版分析出的問題）：
   1. 只有一條「通訊迴圈」會碰序列埠，所有請求（輪詢、讀寫、JOG）都排進佇列，
      依優先權依序執行，因此不需要 Pause、Resume 與巢狀鎖，也不會互相打斷。
   2. 使用者操作的優先權高於輪詢；停止命令用最高優先權，會插隊到最前面。
   3. 逾時用 performance.now() 計算真正的毫秒，不再用 Sleep(1) 計次。
   4. 先收 2 個位元組判斷功能碼：若最高位元為 1 就是例外回應（5 個位元組），
      不必空等到逾時。
   5. 每次送出前清掉緩衝區殘留位元組，避免舊回應污染新交易。
   6. 驗證 CRC、站號、功能碼與內容，失敗會重試。
   ========================================================================== */

// ==========================================================================
// SerialLink：包裝 Web Serial 的連接埠
// ==========================================================================

class SerialLink {
    constructor(buffer, events) {
        this.buffer = buffer;           // 收到的資料放進這個緩衝區
        this.events = events || {};     // onReadError、onFatalError
        this.port = null;
        this.writer = null;
        this.reader = null;
        this.keepReading = false;
        this.readLoopPromise = null;
        this.isOpen = false;
    }

    // 開啟連接埠。options 為 { baudRate, dataBits, stopBits, parity }。
    async open(port, options) {
        await port.open({
            baudRate: options.baudRate,
            dataBits: options.dataBits,
            stopBits: options.stopBits,
            parity: options.parity,
            flowControl: 'none',
            bufferSize: 4096        // 預設只有 255 個位元組，加大以容納最長 133 位元組的回應
        });
        this.port = port;
        this.writer = port.writable.getWriter();   // 整個連線期間只取一次，不重複鎖定與釋放
        this.keepReading = true;
        this.isOpen = true;
        this.readLoopPromise = this._readLoop();
    }

    // 常駐讀取迴圈：不斷把收到的位元組放進緩衝區，不受交易逾時影響。
    // 同位檢查或框架錯誤這類非致命錯誤會讓串流中斷，此時重新取得 reader 繼續讀。
    async _readLoop() {
        let fatalError = null;
        while (this.keepReading && this.port && this.port.readable) {
            this.reader = this.port.readable.getReader();
            try {
                while (this.keepReading) {
                    const result = await this.reader.read();
                    if (result.done) { break; }
                    if (result.value && result.value.length > 0) {
                        this.buffer.append(result.value);
                    }
                }
            } catch (error) {
                if (this.keepReading && this.events.onReadError) {
                    this.events.onReadError(error);
                }
                fatalError = error;
            } finally {
                try { this.reader.releaseLock(); } catch (ignore) { /* 已釋放 */ }
                this.reader = null;
            }
        }
        // 迴圈結束時若不是使用者主動關閉，代表連接埠被拔除或發生致命錯誤。
        if (this.keepReading) {
            this.keepReading = false;
            this.isOpen = false;
            if (this.events.onFatalError) {
                this.events.onFatalError(fatalError || new LocalizedError(lx('序列埠已中斷')));
            }
        }
    }

    async write(bytes) {
        if (!this.isOpen || !this.writer) {
            throw new ModbusException('closed', lx('序列埠尚未開啟'));
        }
        try {
            await this.writer.write(bytes);
        } catch (error) {
            throw new ModbusException('io', lx('序列埠寫入失敗：{0}', errorText(error)));
        }
    }

    async close() {
        this.keepReading = false;
        this.isOpen = false;
        this.buffer.cancelAll();
        try { if (this.reader) { await this.reader.cancel(); } } catch (ignore) { /* 忽略 */ }
        if (this.readLoopPromise) {
            try { await this.readLoopPromise; } catch (ignore) { /* 忽略 */ }
        }
        try { if (this.writer) { this.writer.releaseLock(); } } catch (ignore) { /* 忽略 */ }
        this.writer = null;
        try { if (this.port) { await this.port.close(); } } catch (ignore) { /* 忽略 */ }
        this.port = null;
    }
}

// ==========================================================================
// PollScheduler：決定下一個要輪詢哪個群組
// 每個群組有自己的更新週期（快速、中速、慢速），挑「到期最久」的先執行。
// 這樣畫面上變動快的資料（輸入輸出、Block 狀態、速度）更新得快，
// 壽命、計數這類變動慢的資料不會占用太多通訊時間。
// ==========================================================================

class PollScheduler {
    constructor(groupDefinitions, tierIntervalsMs) {
        this.groups = groupDefinitions.map(function (definition) {
            return {
                definition: definition,
                name: definition.name,
                start: definition.start,
                count: definition.count,
                tier: definition.tier,
                intervalMs: tierIntervalsMs[definition.tier],
                due: 0,
                enabled: true,
                exceptionStreak: 0      // 連續被裝置以例外拒絕的次數
            };
        });
    }

    next(now) {
        let best = null;
        for (const group of this.groups) {
            if (group.enabled && group.due <= now && (best === null || group.due < best.due)) {
                best = group;
            }
        }
        return best;
    }

    complete(group, now, linkAlive) {
        // 通訊中斷時放慢輪詢，避免一直重試塞住通訊迴圈。
        group.due = now + (linkAlive ? group.intervalMs : Math.max(group.intervalMs, 1000));
    }

    resetDue() {
        for (const group of this.groups) { group.due = 0; }
    }
}

// ==========================================================================
// ModbusBus：交易引擎
// ==========================================================================

class ModbusBus {
    constructor() {
        this.buffer = new ByteBuffer();
        this.link = null;
        this.running = false;
        this.slaveAddress = DEFAULT_SLAVE_ADDRESS;
        this.queues = { urgent: [], user: [] };
        this.scheduler = null;
        this.pollingEnabled = true;
        this.logPolling = false;            // 是否把輪詢封包也寫進通訊記錄
        this.interFrameGapMs = 2;
        this.lastFrameEnd = 0;
        this.consecutiveFailures = 0;
        this.linkAlive = false;
        this.stats = this._newStats();
        // 事件處理函式，由畫面層指定：
        //   onLog(kind, text)            寫入通訊記錄
        //   onLinkState(isAlive)         通訊狀態改變
        //   onPollResult(group, words)   輪詢取得資料
        //   onPollError(group, error)    輪詢失敗
        //   onFatalError(error)          序列埠寫入失敗，需要關閉連線
        this.handlers = {};
        this._wakeResolve = null;
        this._loopPromise = null;
    }

    _newStats() {
        return { successCount: 0, errorCount: 0, timeoutCount: 0, retryCount: 0, crcErrorCount: 0, exceptionCount: 0 };
    }

    start(link, baudRate, scheduler) {
        this.link = link;
        this.scheduler = scheduler;
        this.stats = this._newStats();
        this.consecutiveFailures = 0;
        this.linkAlive = false;
        this.lastFrameEnd = 0;
        this.buffer.clear();
        // 文件 2-1-3-1：靜默間隔 T0 為 3.5 個字元長度或 0.75 毫秒，取較長者。
        // 一個字元約 11 位元（起始位元、8 位元資料、同位檢查、停止位元）。
        const charTimeMs = 11000 / baudRate;
        this.interFrameGapMs = Math.max(2, Math.ceil(3.5 * charTimeMs));
        this.running = true;
        this._loopPromise = this._runLoop();
    }

    async stop() {
        this.running = false;
        this._wake();
        this.buffer.cancelAll();
        if (this._loopPromise) {
            await this._loopPromise;
            this._loopPromise = null;
        }
    }

    // 排入一個請求，回傳 Promise（成功時為完整的回應位元組）。
    // options.priority：'urgent'（插隊，用於停止命令）或 'user'（預設）。
    request(command, options) {
        const opts = Object.assign({
            priority: 'user',
            timeoutMs: TIMEOUT_USER_MS,
            retries: RETRY_USER,
            quiet: false,
            probe: false        // 探測用請求：被裝置以例外拒絕是預期中的結果，不記錄錯誤也不計入錯誤次數
        }, options || {});
        if (!this.running) {
            return Promise.reject(new ModbusException('closed', lx('尚未連線')));
        }
        const self = this;
        return new Promise(function (resolve, reject) {
            const item = { command: command, opts: opts, resolve: resolve, reject: reject };
            if (opts.priority === 'urgent') {
                self.queues.urgent.push(item);
            } else {
                self.queues.user.push(item);
            }
            self._wake();
        });
    }

    // 目前是否還有使用者請求在排隊或執行，供畫面判斷忙碌狀態。
    get pendingCount() {
        return this.queues.urgent.length + this.queues.user.length;
    }

    // ---------- 通訊迴圈 ----------

    async _runLoop() {
        while (this.running) {
            let item = this.queues.urgent.shift() || this.queues.user.shift();
            let pollGroup = null;
            if (!item && this.pollingEnabled && this.scheduler) {
                pollGroup = this.scheduler.next(nowMs());
                if (pollGroup) { item = this._makePollItem(pollGroup); }
            }
            if (!item) {
                await this._idle(4);
                continue;
            }
            await this._execute(item);
            if (pollGroup) {
                this.scheduler.complete(pollGroup, nowMs(), this.linkAlive);
            }
        }
        this._rejectAll(new ModbusException('closed', lx('連線已關閉')));
    }

    _makePollItem(group) {
        const self = this;
        return {
            command: new ReadHoldingRegistersCommand(this.slaveAddress, group.start, group.count),
            opts: { priority: 'poll', timeoutMs: TIMEOUT_POLL_MS, retries: RETRY_POLL, quiet: !this.logPolling },
            resolve: function (response) {
                group.exceptionStreak = 0;
                if (self.handlers.onPollResult) {
                    self.handlers.onPollResult(group, ReadHoldingRegistersCommand.parseWords(response));
                }
            },
            reject: function (error) {
                if (self.handlers.onPollError) { self.handlers.onPollError(group, error); }
            }
        };
    }

    _idle(ms) {
        const self = this;
        return new Promise(function (resolve) {
            self._wakeResolve = resolve;
            setTimeout(function () {
                if (self._wakeResolve === resolve) {
                    self._wakeResolve = null;
                    resolve();
                }
            }, ms);
        });
    }

    _wake() {
        if (this._wakeResolve) {
            const resolve = this._wakeResolve;
            this._wakeResolve = null;
            resolve();
        }
    }

    _rejectAll(error) {
        const pending = this.queues.urgent.splice(0).concat(this.queues.user.splice(0));
        for (const item of pending) { item.reject(error); }
    }

    // 執行一個請求（含重試），結果交給 resolve 或 reject，這個函式本身不會丟出錯誤。
    async _execute(item) {
        const command = item.command;
        const opts = item.opts;
        const attempts = 1 + opts.retries;
        let lastError = null;
        for (let attempt = 1; attempt <= attempts && this.running; attempt++) {
            try {
                const response = await this._transactOnce(command, opts);
                this.stats.successCount++;
                this.consecutiveFailures = 0;
                this._setLinkAlive(true);
                item.resolve(response);
                return;
            } catch (error) {
                lastError = error;
                if (!(error instanceof ModbusException)) {
                    lastError = new ModbusException('io', lx('未預期的錯誤：{0}', errorText(error)));
                }
                // 例外回應代表裝置有回應（只是拒絕這個命令），通訊本身是正常的，且重試沒有意義。
                if (lastError.kind === 'exception') {
                    this.stats.exceptionCount++;
                    this.consecutiveFailures = 0;
                    this._setLinkAlive(true);
                    break;
                }
                if (lastError.kind === 'closed') { break; }
                if (lastError.kind === 'io') {
                    if (this.handlers.onFatalError) { this.handlers.onFatalError(lastError); }
                    break;
                }
                if (lastError.kind === 'timeout') { this.stats.timeoutCount++; }
                if (lastError.kind === 'crc') { this.stats.crcErrorCount++; }
                if (attempt < attempts) {
                    this.stats.retryCount++;
                    this._log('warn', lx('重試 {0}/{1}：{2}', attempt, attempts - 1, lastError.text));
                }
            }
        }
        if (lastError === null) {
            lastError = new ModbusException('closed', lx('連線已關閉'));
        }
        if (lastError.kind !== 'exception' && lastError.kind !== 'closed') {
            this.stats.errorCount++;
            this.consecutiveFailures++;
            if (this.consecutiveFailures >= LINK_LOST_FAILURES) { this._setLinkAlive(false); }
        } else if (lastError.kind === 'exception' && !opts.probe) {
            this.stats.errorCount++;
        }
        // 連線被關閉造成的中止、以及探測請求被拒絕，都不需要當成錯誤記錄
        const isExpectedRejection = opts.probe && lastError.kind === 'exception';
        if (lastError.kind !== 'closed' && !isExpectedRejection) { this._log('error', lastError.text); }
        item.reject(lastError);
    }

    // 單次交易：送出命令，等待並驗證回應。
    async _transactOnce(command, opts) {
        // 1. 與上一個封包之間保持靜默間隔 T0
        const sinceLast = nowMs() - this.lastFrameEnd;
        if (sinceLast < this.interFrameGapMs) {
            await sleep(this.interFrameGapMs - sinceLast);
        }
        if (!this.running) { throw new ModbusException('closed', lx('連線已關閉')); }

        // 2. 清掉緩衝區殘留位元組（逾時後才到的舊回應、雜訊）
        if (this.buffer.length > 0) {
            this._log('warn', lx('丟棄緩衝區殘留的 {0} 個位元組：{1}', this.buffer.length, toHexBytes(this.buffer.bytes, Math.min(this.buffer.length, 16))));
            this.buffer.clear();
        }

        // 3. 送出
        const txBytes = command.getBytes();
        if (!opts.quiet) { this._log('send', lx('Send  {0}   ({1})', toHexBytes(txBytes), command.description)); }
        const startedAt = nowMs();
        await this.link.write(txBytes);
        const deadline = startedAt + opts.timeoutMs;

        // 4. 先收 2 個位元組，看功能碼最高位元是否為 1（例外回應）
        let received = await this.buffer.waitFor(2, deadline - nowMs());
        if (!this.running) { throw new ModbusException('closed', lx('連線已關閉')); }
        if (!received) {
            throw this._timeoutError(opts.timeoutMs);
        }
        const isExceptionFrame = (this.buffer.peek(1) & 0x80) !== 0;
        const totalLength = isExceptionFrame ? 5 : command.expectedResponseLength;

        // 5. 收完整個封包
        received = await this.buffer.waitFor(totalLength, deadline - nowMs());
        if (!this.running) { throw new ModbusException('closed', lx('連線已關閉')); }
        if (!received) {
            throw this._timeoutError(opts.timeoutMs);
        }
        const response = this.buffer.take(totalLength);
        this.lastFrameEnd = nowMs();

        if (!opts.quiet) {
            const shown = response.length > 40
                ? lx('{0} ... 共 {1} 個位元組', toHexBytes(response, 24), response.length)
                : toHexBytes(response);
            this._log('read', lx('Read  {0}   ({1} ms)', shown, Math.round(nowMs() - startedAt)));
        }

        // 6. 驗證 CRC，再驗證站號、功能碼與內容
        if (!verifyCrc16(response)) {
            throw new ModbusException('crc', lx('CRC 錯誤：{0}', toHexBytes(response, Math.min(response.length, 16))));
        }
        command.validateResponse(response);
        return response;
    }

    _timeoutError(timeoutMs) {
        const partial = this.buffer.length;
        let message;
        if (partial > 0) {
            // 只收到一部分：多半是同位檢查或停止位元設定不一致
            message = lx('通訊逾時（{0} ms），只收到 {1} 個位元組：{2}。請確認同位檢查、停止位元與驅動器 Pr5.38 一致。',
                timeoutMs, partial, toHexBytes(this.buffer.bytes, Math.min(partial, 16)));
        } else {
            // 完全沒收到：多半是站號、傳輸速率或接線問題
            message = lx('通訊逾時（{0} ms），完全沒有收到資料。請確認站號、傳輸速率、接線，以及驅動器 Pr5.31、Pr5.37 設定。', timeoutMs);
        }
        this.buffer.clear();
        return new ModbusException('timeout', message);
    }

    _setLinkAlive(isAlive) {
        if (this.linkAlive !== isAlive) {
            this.linkAlive = isAlive;
            if (this.handlers.onLinkState) { this.handlers.onLinkState(isAlive); }
        }
    }

    _log(kind, text) {
        if (this.handlers.onLog) { this.handlers.onLog(kind, text); }
    }
}


/* ==========================================================================
   第三部分：A6 資料層
   內容：
   1. 狀態模型 A6Status（欄位名稱沿用 C# 版 A6Status，並統一成 PascalCase、修正拼字）

   4. Block 指令的解碼與檢查（文件第 4 章）
   ========================================================================== */

// ==========================================================================
// 1. 狀態模型

// ==========================================================================
// 2. 輪詢群組的解碼函式
// 每個函式接收該群組讀回的暫存器陣列 w（w[0] 對應群組起始位址），
// 並把結果寫進 status。註解中的位址都對照文件 2-1-4-4。
// ==========================================================================

function decodeBasicStatus(w, st) {
    st.Statusword1 = w[0];                                  // 4000h 固定為 0
    st.ErrorCode = w[1];                                    // 4001h 高位元組為主碼、低位元組為副碼
    st.MotorName = decodeAsciiRegisters(w, 2, 8);           // 4002h 起 8 個暫存器，馬達型號
    st.MotorSerialNumber = decodeMotorSerial(w[10], w[11]); // 400Ah 起 2 個暫存器，馬達序號
    st.WarningFlag = toUInt32(w[12], w[13]);                // 400Ch
    st.OverloadRatio = toInt16(w[14]);                      // 400Eh 單位 %
    st.RegenerativeLoadFactor = toInt16(w[15]);             // 400Fh 單位 %
    st.PowerOnIntegratedTime = toInt32(w[16], w[17]);       // 4010h 單位 0.5 小時
    st.DriverTemperature = toInt16(w[18]);                  // 4012h 單位 攝氏度
    st.IrruptiveResistanceRelayChangingCount = toInt32(w[19], w[20]);  // 4013h 突入電阻繼電器切換次數
    st.DynamicBrakeRelayChangingCount = toInt32(w[21], w[22]);         // 4015h 動態煞車繼電器切換次數
    st.FanOperationTime = toUInt32(w[23], w[24]);           // 4017h 單位 0.5 小時
    st.FanLifeTimeIntegratedValue = w[25];                  // 4019h 單位 0.1 %
    st.CapacitorLifeTimeIntegratedValue = w[26];            // 401Ah 單位 0.1 %
    st.EncoderTemperature = toInt16(w[27]);                 // 401Bh 單位 攝氏度
    st.PreFilterCommandSpeed = toInt32(w[28], w[29]);       // 401Ch 濾波前指令速度，單位 指令單位每秒
    st.PositionCommandSpeed = toInt16(w[30]);               // 401Eh 位置指令速度，單位 r/min
    st.InternalPositionCommandSpeed = toInt16(w[31]);       // 401Fh 內部位置指令速度，單位 r/min
    st.PostFilterCommandPosition = toInt32(w[32], w[33]);   // 4020h 濾波後指令位置
    st.EncoderPositionDeviation = toInt32(w[34], w[35]);    // 4022h 編碼器位置偏差，單位 pulse
    st.SpeedControlCommand = toInt16(w[36]);                // 4024h 速度控制指令，單位 r/min
    st.MotorSpeed = toInt16(w[37]);                         // 4025h 馬達速度，單位 r/min
    st.SpeedLimit = toInt16(w[38]);                         // 4026h 速度限制，單位 r/min
    st.FullClosePositionFollowingError = toInt32(w[39], w[40]);  // 4027h 全閉迴路偏差
    st.HybridFollowingError = toInt32(w[41], w[42]);        // 4029h 混合偏差
    st.VelocityCommandValue = toInt32(w[43], w[44]);        // 402Bh 濾波後指令速度
}

// 文件：每個暫存器內的兩個字元順序相反（低位元組是前一個字元）。
// 例：4002h = 534Dh 代表 "MS"（低位元組 4Dh 是 'M'，高位元組 53h 是 'S'）。
function decodeAsciiRegisters(words, offset, count) {
    let text = '';
    for (let i = 0; i < count; i++) {
        const word = words[offset + i];
        const low = word & 0xFF;
        const high = (word >> 8) & 0xFF;
        if (low > 0x20 && low < 0x7F) { text += String.fromCharCode(low); }
        else if (low === 0x20) { text += ' '; }
        if (high > 0x20 && high < 0x7F) { text += String.fromCharCode(high); }
        else if (high === 0x20) { text += ' '; }
    }
    return text.trim();
}

// 馬達序號（文件 2-1-4-4 表格與註解 *1）：
// 第一個暫存器：高位元組為生產月份、低位元組為生產年份（西元後兩位）。
// 第二個暫存器：生產流水號。銘板上的流水號若含英文字母，讀出值依表轉換：
//   10000 起每 1000 對應一個字母（A 為 10000 到 10999，B 為 11000 到 11999 ...），
//   字母不使用 I 與 O，所以 H 之後是 J、N 之後是 P。
const SERIAL_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';

function decodeMotorSerial(yearMonthWord, orderWord) {
    const year = 2000 + (yearMonthWord & 0xFF);
    const month = (yearMonthWord >> 8) & 0xFF;
    let orderText;
    if (orderWord >= 10000) {
        const letterIndex = Math.floor((orderWord - 10000) / 1000);
        const letter = SERIAL_LETTERS.charAt(letterIndex) || '?';
        orderText = letter + pad(orderWord % 1000, 3);
    } else {
        orderText = pad(orderWord, 4);
    }
    return year + '/' + pad(month, 2) + '/' + orderText;
}

function decodeControlFunction(w, st) {
    st.AbsoluteMultiturnDataClearFunction = w[0];   // 4100h（4101h 未定義）
    st.TripResetFunction = w[2];                    // 4102h（4103h 未定義）
}

function decodeEncoder(w, st) {
    st.EncoderID = w[0];                            // 4200h 低位元組 ID-L，高位元組 ID-H
    st.EncoderStatus = w[1];                        // 4201h
    // 4202h 起 2 個暫存器放 24 位元單圈資料：L、M 在第一個暫存器，H 在第二個暫存器低位元組
    st.EncoderSingleTurnData = w[2] | ((w[3] & 0xFF) << 16);
    st.EncoderMultiTurnData = w[4];                 // 4204h 多圈資料（增量模式下為未定義值）
}

function decodeExternalScale(w, st) {
    st.ExternalScaleID = w[0];                      // 4208h
    st.ExternalScaleStatus = w[1];                  // 4209h
    // 420Ah 與 420Ch 各放 24 位元，合成 48 位元的有號數（以一般數字計算，不超過 2 的 53 次方）
    const lower24 = w[2] | ((w[3] & 0xFF) << 16);
    const upper24 = w[4] | ((w[5] & 0xFF) << 16);
    let value = upper24 * 16777216 + lower24;
    if (value >= 140737488355328) { value -= 281474976710656; }   // 超過 2 的 47 次方則減 2 的 48 次方
    st.ExternalScaleData = value;
}

function decodeParameterAreaSwitch(w, st) {
    st.ServoParameterAreaOutputSwitching = w[0];    // 4210h
}

function decodeModbusRight(w, st) {
    st.ModbusCommunicationMode = w[0] & 0xFF;       // 4300h：55h 已取得通訊權，AAh 已釋放
}

function decodePhysicalAndLogicalInput(w, st) {
    st.PhysicalInput = toUInt32(w[0], w[1]);        // 4400h 實體輸入（SI1 到 SI10 為 bit0 到 bit9）
    st.LogicalInput = toUInt32(w[2], w[3]);         // 4402h 邏輯輸入（位元對應見 LOGICAL_INPUT_LAMPS）
}

function decodeVirtualAndOutput(w, st) {
    st.VirtualInput = toUInt32(w[0], w[1]);         // 4406h 邏輯輸入操作
    st.PhysicalOutput = toUInt32(w[2], w[3]);       // 4408h 實體輸出（SO1 到 SO6 為 bit0 到 bit5）
    st.LogicalOutput = toUInt32(w[4], w[5]);        // 440Ah 邏輯輸出（位元對應見 LOGICAL_OUTPUT_LAMPS）
}

function decodeBlockStatus(w, st) {
    st.MotorActivationState = w[0] & 0xFF;          // 4410h：bit0 扭矩限制中、bit1 低於 30 r/min、bit2 負向旋轉、bit3 正向旋轉
    st.BlockControlWord = w[1];                     // 4411h Block 運轉控制操作
    st.ActualBlockControlWord = w[2];               // 4412h Block 運轉控制監視
    st.BlockStatusFlag = w[3];                      // 4413h Block 運轉狀態監視
    st.BlockNumber = w[4];                          // 4414h 指定的 Block 編號
    st.ActualBlockNumber = w[5];                    // 4415h
    st.BlockNumberMonitor = w[6];                   // 4416h 目前有效的 Block 編號
}

function decodeStatusMonitor1(w, st) {
    st.PositionDeviationAfterFilter = toInt32(w[0], w[1]);  // 4D00h
    st.EncoderResolution = toInt32(w[2], w[3]);             // 4D02h 單位 pulse/r
}

// 4D06h 起 54 個暫存器，每個項目占 2 個暫存器（文件 2-1-4-4 的 4D00h 區）。
function decodeStatusMonitor2(w, st) {
    st.ActualSpeed = toInt32(w[0], w[1]);                           // 4D06h 單位 r/min
    st.TorqueCommand = toInt32(w[2], w[3]);                         // 4D08h 單位 0.05 %
    st.CommandSpeedBeforeFilter = toInt32(w[4], w[5]);              // 4D0Ah
    st.CommandSpeedAfterFilter = toInt32(w[6], w[7]);               // 4D0Ch
    st.ExternalDisplacementSensorPosition = toInt32(w[8], w[9]);    // 4D0Eh
    st.RegenerativeLoadRate = toInt32(w[10], w[11]);                // 4D10h 單位 0.1 %
    st.OverloadLoadRate = toInt32(w[12], w[13]);                    // 4D12h 單位 0.2 %
    st.ExtendedLogicInput = toUInt32(w[14], w[15]);                 // 4D14h
    st.ExtendedLogicOutput = toUInt32(w[16], w[17]);                // 4D16h
    st.PhysicalInput2 = toUInt32(w[18], w[19]);                     // 4D18h
    st.PhysicalOutput2 = toUInt32(w[20], w[21]);                    // 4D1Ah
    st.InertiaRatio = toInt32(w[22], w[23]);                        // 4D1Ch 單位 %
    st.MotorAutoIdentificationValidState = toUInt32(w[24], w[25]);  // 4D1Eh
    st.WarningFlag2 = toUInt32(w[26], w[27]);                       // 4D20h
    st.ControlMode = toInt32(w[28], w[29]);                         // 4D22h 0 位置、1 速度、2 扭矩、3 全閉迴路
    st.MechanicalAngleSingleTurnData = toInt32(w[30], w[31]);       // 4D24h 單位 pulse
    st.ElectricalAngle = toInt32(w[32], w[33]);                     // 4D26h 單位 0.0879 度
    st.MultiTurnRotationDataOfAbsoluteEncoder = toInt32(w[34], w[35]);  // 4D28h
    st.CounterReferenceTime = toInt32(w[36], w[37]);                // 4D2Ah 單位 30 分鐘
    st.PowerOnAccumulatedTime = toInt32(w[38], w[39]);              // 4D2Ch 單位 30 分鐘
    st.AlarmOccurrenceTime = toInt32(w[40], w[41]);                 // 4D2Eh 單位 30 分鐘
    st.DriverTemperature2 = toInt32(w[42], w[43]);                  // 4D30h 單位 攝氏度
    st.EncoderTemperature2 = toInt32(w[44], w[45]);                 // 4D32h 單位 攝氏度
    st.FanRuntime = toInt32(w[46], w[47]);                          // 4D34h 單位 30 分鐘
    st.FanLifetimeCumulativeValue = toInt32(w[48], w[49]);          // 4D36h 單位 0.1 %
    st.CapacitorLifespanCumulativeValue = toInt32(w[50], w[51]);    // 4D38h 單位 0.1 %
    st.MainPowerSupplyPnVoltage = toInt32(w[52], w[53]);            // 4D3Ah 單位 V
}

function decodeEncoderErrorCount(w, st) {
    st.EncoderCommunicationErrorCount = toInt32(w[0], w[1]);        // 4D42h
}

function decodeExternalScaleErrorCount(w, st) {
    st.ExternalDisplacementSensorErrorCount = toInt32(w[0], w[1]);  // 4D46h
}

function decodeRelayCounts(w, st) {
    st.SurgeSuppressorRelaySwitchCount = toInt32(w[0], w[1]);       // 4D54h
    st.DynamicBrakeRelaySwitchCount = toInt32(w[2], w[3]);          // 4D56h
}

function decodeLogicAndScale(w, st) {
    st.LogicalInputs = toUInt32(w[0], w[1]);                        // 4D5Ch
    st.LogicalOutputs = toUInt32(w[2], w[3]);                       // 4D5Eh
    st.ExternalDisplacementSensorPositionBeforeReversal = toInt32(w[4], w[5]);  // 4D60h
}

function decodeDegradationDiagnosis(w, st) {
    st.DegradationDiagnosisStatus = toUInt32(w[0], w[1]);                   // 4DC0h
    st.DegradationDiagnosisTorqueCommandAverage = toInt32(w[2], w[3]);      // 4DC2h 單位 0.1 %
    st.DegradationDiagnosisTorqueCommandStdDev = toInt32(w[4], w[5]);       // 4DC4h 單位 0.1 %
    st.DegradationDiagnosisEstimatedInertiaRatio = toInt32(w[6], w[7]);     // 4DC6h 單位 %
    st.DegradationDiagnosisEstimatedOffsetLoadWeight = toInt32(w[8], w[9]); // 4DC8h 單位 0.1 %
    st.DegradationDiagnosisEstimatedDynamicFriction = toInt32(w[10], w[11]);// 4DCAh 單位 0.1 %
    st.DegradationDiagnosisEstimatedViscousFriction = toInt32(w[12], w[13]);// 4DCCh 單位 0.1 % 每 1000 r/min
}

// 輪詢群組表。tier 決定更新頻率：fast 快速、medium 中速、slow 慢速。
// 起始位址與暫存器數量與 C# 版的 STATUS_GROUPS 相同，並已逐項對照文件確認。
// 4DD8h（不含背隙補償的位置）C# 版就是停用狀態，這裡維持不輪詢。
const POLL_GROUPS = [
    { name: '基本狀態', start: 0x4000, count: 0x2D, tier: 'fast', decode: decodeBasicStatus },
    { name: '實體與邏輯輸入', start: 0x4400, count: 4, tier: 'fast', decode: decodePhysicalAndLogicalInput },
    { name: '虛擬輸入與輸出', start: 0x4406, count: 6, tier: 'fast', decode: decodeVirtualAndOutput },
    { name: 'Block 狀態', start: 0x4410, count: 7, tier: 'fast', decode: decodeBlockStatus },
    { name: '狀態監視一', start: 0x4D00, count: 4, tier: 'medium', decode: decodeStatusMonitor1 },
    { name: '狀態監視二', start: 0x4D06, count: 0x36, tier: 'medium', decode: decodeStatusMonitor2 },
    { name: '控制功能', start: 0x4100, count: 4, tier: 'slow', decode: decodeControlFunction },
    { name: '編碼器', start: 0x4200, count: 5, tier: 'slow', decode: decodeEncoder },
    { name: '外部尺', start: 0x4208, count: 6, tier: 'slow', decode: decodeExternalScale },
    { name: '參數區輸出切換', start: 0x4210, count: 1, tier: 'slow', decode: decodeParameterAreaSwitch },
    { name: 'Modbus 通訊權', start: 0x4300, count: 1, tier: 'slow', decode: decodeModbusRight },
    { name: '編碼器通訊錯誤次數', start: 0x4D42, count: 2, tier: 'slow', decode: decodeEncoderErrorCount },
    { name: '外部尺通訊錯誤次數', start: 0x4D46, count: 2, tier: 'slow', decode: decodeExternalScaleErrorCount },
    { name: '繼電器切換次數', start: 0x4D54, count: 4, tier: 'slow', decode: decodeRelayCounts },
    { name: '邏輯輸出入與外部尺', start: 0x4D5C, count: 6, tier: 'slow', decode: decodeLogicAndScale },
    { name: '劣化診斷', start: 0x4DC0, count: 0x0E, tier: 'slow', decode: decodeDegradationDiagnosis }
];

// 三種輪詢頻率（單位：毫秒）。
const POLL_TIER_INTERVALS_MS = { fast: 100, medium: 500, slow: 2000 };

// ==========================================================================
// 輸入輸出燈號的位元對應
// 文件 2-1-4-3：邏輯輸入監視的線圈位址 0020h 起，位元編號 = 線圈位址 減 0020h，
// 邏輯輸出監視的線圈位址 00A0h 起，位元編號 = 線圈位址 減 00A0h。
// 「製造商使用」的位元不顯示，所以編號會跳號。
// 舊版 A6.html 用連續位元，標籤與位元都對不上，這裡改回與 C# 版一致的正確對應。
// ==========================================================================

// 欄位順序即畫面上由上往下、由左往右的顯示順序（C# 版三欄，每欄最多 8 個）。
const LOGICAL_INPUT_LAMPS = [
    ['SRV-ON', 0], ['A-CLR', 1], ['NOT', 2], ['POT', 3], ['C-MODE', 4], ['ZEROSPD', 5], ['DIV1', 6], ['E-STOP', 7],
    ['INH', 8], ['GAIN', 9], ['CL', 10], ['INTSPD1', 12], ['INTSPD2', 13], ['J-SEL', 18], ['VS-SEL1', 19], ['INTSPD3', 20],
    ['TL-SEL', 21], ['VS-SEL2', 22], ['DIV2', 23], ['VC-SIGN', 24], ['TC-SIGN', 25], ['SF1', 27], ['SF2', 28]
];

const LOGICAL_OUTPUT_LAMPS = [
    ['S-RDY', 0], ['ALM', 1], ['INP', 2], ['BRK-OFF', 3], ['ZSP', 4], ['TLC', 5],
    ['V-COIN', 6], ['AT-SPEED', 9], ['DBRK', 13], ['FREE', 15], ['WARN1', 16], ['WARN2', 17],
    ['P-CMD', 18], ['INP2', 19], ['V-LIMIT', 20], ['ALM-ATB', 21], ['V-CMD', 22], ['O-EDM', 23]
];

// 動作狀態（4410h，文件 2-1-4-3 的馬達運轉狀態監視 0100h 到 0103h）
const MOTOR_STATE_LAMPS = [
    ['Torque Limited', 0], ['Under 30 r/min', 1], ['Rotating Negative', 2], ['Rotating Positive', 3]
];

const BLOCK_STATUS_LAMPS = [
    ['BUSY', 0], ['HOME-CMP', 1], ['B-CTRL1', 2], ['B-CTRL2', 3], ['B-CTRL3', 4], ['B-CTRL4', 5], ['B-CTRL5', 6], ['B-CTRL6', 7]
];

// ==========================================================================
// 3. 錯誤碼表
// 依 C# 版的對照表與文件第 7 章整理。補上 C# 版缺少或顯示錯誤的項目：
// 80.0、83.2（通訊逾時與連續錯誤）、94.3（原點復歸異常保護二，v1.16 新增）、97.0。
// 沒有收錄的錯誤碼一律顯示「其他錯誤」，不會顯示空白。
// 多語系：表中的值是文件上的英文名稱，同時也是多語系字典的 key，

// 把 4001h 的錯誤碼轉成顯示文字。回傳 { text, hasError }。
function describeErrorCode(errorCode) {
    if (errorCode === 0) {
        return { text: t('No Error'), hasError: false };
    }
    const main = (errorCode >> 8) & 0xFF;
    const sub = errorCode & 0xFF;
    const key = main + '.' + sub;
    const entry = ALARM_TABLE[key];
    if (entry) {
        // 非英文介面時第二行補上文件原文的英文名稱，方便對照手冊與回報問題
        const translated = t(entry);
        return { text: 'Err' + key + '  ' + translated + (i18nState.language === 'en' ? '' : '\n' + entry), hasError: true };
    }
    return { text: 'Err' + key + '  ' + t('Other error'), hasError: true };
}

// ==========================================================================
// 4. Block 指令的解碼與檢查（文件第 4 章）
//
// 一個 Block 由 64 位元組成：32 位元「指令」加 32 位元「資料」。
// 指令的位元排列（文件 3-2-1）：
//   位元 31 到 24  指令碼
//   位元 23 到 20  引數 1（4 位元）
//   位元 19 到 16  引數 2（4 位元）
//   位元 15 到 12  引數 3（4 位元）
//   位元 11 到 10  引數 4（2 位元）
//   位元 9 到 8    引數 5（2 位元，Block 轉移條件）
//   位元 7 到 0    保留
// 引數 5 的高位元（MSB）：1 表示繼續執行下一個 Block，0 表示在這個 Block 結束。
// 引數 5 的低位元（LSB）：0 表示本 Block 開始後就轉移，1 表示本 Block 完成後才轉移。
// 資料欄位（引數 7）是 32 位元有號整數，用法依指令而定。
//
// 解碼結果只用於畫面顯示與寫入前的檢查，實際寫入的數值永遠是使用者輸入的原始整數。
// ==========================================================================

function splitBlockCommand(commandValue) {
    const value = commandValue >>> 0;
    return {
        code: (value >>> 24) & 0xFF,
        arg1: (value >>> 20) & 0x0F,
        arg2: (value >>> 16) & 0x0F,
        arg3: (value >>> 12) & 0x0F,
        arg4: (value >>> 10) & 0x03,
        arg5: (value >>> 8) & 0x03,
        reserved: value & 0xFF
    };
}

const BLOCK_COMMAND_NAMES = {
    0x00: '空白',
    0x01: '相對定位',
    0x02: '絕對定位',
    0x03: 'JOG',
    0x04: '原點復歸',
    0x05: '減速停止',
    0x06: '更新速度',
    0x07: '啟動遞減計數器',
    0x08: '輸出訊號操作',
    0x09: '跳躍',
    0x0A: '條件分支 (=)',
    0x0B: '條件分支 (>)',
    0x0C: '條件分支 (<)'
};

const BLOCK_COMPARE_ITEMS = [
    '指令位置', '目前位置', '位置偏差', '指令速度', '馬達速度', '指令扭矩', '遞減計數器', '輸入訊號', '輸出訊號'
];

const BLOCK_HOMING_METHODS = {
    1: '原點感測器前緣加 Z 相', 2: '原點感測器前緣', 3: 'Z 相', 4: 'Z 相（近似）', 15: '實際位置設定'
};

function describeBlockTransition(arg5) {
    const continues = (arg5 & 0x02) !== 0;
    if (!continues) { return t('結束'); }
    return (arg5 & 0x01) ? t('接續（完成後）') : t('接續（啟動後）');
}

// 條件分支的目的 Block 編號。依文件 4-11 為引數 2 到 4，
// 位元組合方式與文件範例吻合（例：引數 3 為 2、引數 4 為 2 時目的為 Block 10）。
function conditionalBranchTarget(fields) {
    return (fields.arg2 << 6) | (fields.arg3 << 2) | fields.arg4;
}

// 跳躍指令的目的 Block 編號。依文件 4-10 的寫法為引數 2 到 3（各 4 位元）。
// 文件對條件分支寫成引數 2 到 4，兩處寫法不同，這裡只用於顯示，請以實機驗證。
function jumpTarget(fields) {
    return (fields.arg2 << 4) | fields.arg3;
}

function describeOutputOperation(value) {
    // 0 保持、1 製造商使用、2 OFF、3 ON
    return [t('保持'), t('(製造商用)'), 'OFF', 'ON'][value & 0x03];
}

// 回傳一行說明文字，例如「絕對定位 V1 A2 D3 目標 100000，接續（啟動後）」。
function describeBlock(commandValue, dataValue) {
    const f = splitBlockCommand(commandValue);
    if (f.code === 0 && (commandValue | 0) === 0 && (dataValue | 0) === 0) { return t('（空白）'); }
    const rawName = BLOCK_COMMAND_NAMES[f.code];
    if (rawName === undefined) { return t('未定義指令碼 {0}h', toHex(f.code, 2)); }
    const name = t(rawName);
    const transition = describeBlockTransition(f.arg5);
    // 正向／負向（引數 4 為 0 是正向）
    const direction = (f.arg4 === 0) ? t('正向') : t('負向');
    // 每個樣板的標點（逗號、句點）由各語言字典自己決定，所以整句交給 t() 組合
    switch (f.code) {
        case 0x01:
        case 0x02:
            return t('{0} V{1} A{2} D{3} {4} {5}，{6}', name, f.arg1, f.arg2, f.arg3,
                (f.code === 0x01 ? t('位移') : t('目標')), (dataValue | 0), transition);
        case 0x03:
            return t('{0} V{1} A{2} D{3} {4}，{5}', name, f.arg1, f.arg2, f.arg3, direction, transition);
        case 0x04: {
            const method = BLOCK_HOMING_METHODS[f.arg1] ? t(BLOCK_HOMING_METHODS[f.arg1]) : t('方式 {0}（不合法）', f.arg1);
            return t('{0} {1} {2}，{3}', name, method, direction, transition);
        }
        case 0x05: {
            const stopType = (f.arg1 === 0) ? t('減速停止') : (f.arg1 === 1 ? t('立即停止') : t('方式 {0}（不合法）', f.arg1));
            return t('{0} {1}，{2}', name, stopType, transition);
        }
        case 0x06:
            return t('{0} V{1} {2}，{3}', name, f.arg1, direction, transition);
        case 0x07:
            return t('{0} {1} ms，{2}', name, (dataValue | 0), transition);
        case 0x08:
            return t('{0} B-CTRL1 {1} B-CTRL2 {2} B-CTRL3 {3} B-CTRL4 {4} B-CTRL5 {5} B-CTRL6 {6}，{7}', name,
                describeOutputOperation(f.arg1 >> 2), describeOutputOperation(f.arg1),
                describeOutputOperation(f.arg2 >> 2), describeOutputOperation(f.arg2),
                describeOutputOperation(f.arg3 >> 2), describeOutputOperation(f.arg3), transition);
        case 0x09:
            return t('{0} 到 Block {1}，{2}', name, jumpTarget(f), transition);
        case 0x0A:
        case 0x0B:
        case 0x0C: {
            const symbol = (f.code === 0x0A) ? '=' : (f.code === 0x0B ? '>' : '<');
            const item = BLOCK_COMPARE_ITEMS[f.arg1] ? t(BLOCK_COMPARE_ITEMS[f.arg1]) : t('項目 {0}（不合法）', f.arg1);
            const judge = (f.arg5 & 0x01) ? t('等到成立') : t('立即判斷');
            const continues = (f.arg5 & 0x02) ? t('接續') : t('結束');
            const compared = (f.arg1 === 7 || f.arg1 === 8) ? ('0x' + toHex(dataValue, 8)) : String(dataValue | 0);
            return t('如果 {0} {1} {2} 則跳到 Block {3}，{4}，{5}', item, symbol, compared, conditionalBranchTarget(f), judge, continues);
        }
        default:
            return name;
    }
}

// 檢查整份 Block 規劃會不會引用到數值為 0 的速度或加減速時間。
// 文件 3-1 註解 *3：Block 運轉啟動時，如果速度、加速時間或減速時間為 0，會發生 Err93.1。
// params 為 { velocities[16], accelerations[16], decelerations[16] }。
// 回傳問題清單，每一項是一個延遲翻譯物件（LText），顯示時才依當下語言翻譯。
function findZeroParameterReferences(commands, params) {
    const problems = [];
    for (let i = 0; i < commands.length; i++) {
        const f = splitBlockCommand(commands[i]);
        if (f.code === 0x01 || f.code === 0x02 || f.code === 0x03) {
            if (params.velocities[f.arg1] === 0) { problems.push(lx('Block {0} 引用 Velocity {1}，數值為 0', i, f.arg1)); }
            if (params.accelerations[f.arg2] === 0) { problems.push(lx('Block {0} 引用 Acceleration {1}，數值為 0', i, f.arg2)); }
            if (params.decelerations[f.arg3] === 0) { problems.push(lx('Block {0} 引用 Deceleration {1}，數值為 0', i, f.arg3)); }
        } else if (f.code === 0x06) {
            if (params.velocities[f.arg1] === 0) { problems.push(lx('Block {0} 引用 Velocity {1}，數值為 0', i, f.arg1)); }
        }
    }
    return problems;
}


/* ==========================================================================
   第四部分：操作層
   內容：把常用的 A6 操作包成函式（讀寫 Block 參數、Block 規劃、EEPROM、清除多圈、
   清除警報、Servo ON、Block 啟動、試運轉、JOG 與停止、通訊權）。
   這一層也不碰畫面，畫面層只負責呼叫並顯示結果。

   與 C# 版相比的修正：
   1. Block 參數讀寫範圍改為 4600h 到 463Ch（共 61 個暫存器），寫入時保留 4630h（Pr60.48）
      的原值，並補上 Pr60.56 與 Pr60.57（加減速時間單位）。
   2. 寫入後立刻讀回驗證（文件要求寫入後要讀回確認）。
   3. 寫入回應不再誤觸發參數頁刷新，因此不會把使用者尚未寫入的編輯蓋掉。
   4. 讀取 Block 規劃時，只要有任何一段失敗就整批放棄，不會把殘缺資料（全為 0）顯示到畫面。
   5. 試運轉會先備份 Block 254、255 與 Velocity、Acceleration、Deceleration 的第 15 組，
      結束時還原，不再悄悄覆寫使用者原本的資料。
   6. JOG 只寫三個暫存器，不再每次按下都整批重寫 Block 參數。
   7. 停止流程會驗證回應、確認馬達真的停下來，失敗時改用立即停止。
   ========================================================================== */

// ---------- 全域物件 ----------
const bus = new ModbusBus();          // 通訊引擎（唯一會碰序列埠的物件）
const status = createA6Status();      // 最新狀態（輪詢結果寫在這裡，畫面定時讀取）
const runtime = {
    statusDirty: false,               // 有新資料需要更新畫面
    lastUpdate: null,                 // 最後一次成功輪詢的時間
    commRightEnabled: false           // 是否已啟用 4300h 通訊權保護
};

// 畫面層會把這組函式換成真正的實作，操作層只透過它與畫面溝通。
const uiHooks = {
    log: function (kind, text) { /* 由畫面層指定 */ }
};

// ==========================================================================
// 基本讀寫
// ==========================================================================

async function readRegisters(startAddress, count, options) {
    const command = new ReadHoldingRegistersCommand(bus.slaveAddress, startAddress, count);
    const response = await bus.request(command, options);
    return ReadHoldingRegistersCommand.parseWords(response);
}

async function writeRegister(address, value, options) {
    const command = new WriteSingleRegisterCommand(bus.slaveAddress, address, value);
    return bus.request(command, options);
}

async function writeRegisters(startAddress, words, options) {
    const command = new WriteMultipleRegistersCommand(bus.slaveAddress, startAddress, words);
    return bus.request(command, options);
}

async function writeCoil(address, isOn, options) {
    const command = new WriteSingleCoilCommand(bus.slaveAddress, address, isOn);
    return bus.request(command, options);
}

// 輪詢結果：把暫存器解碼進 status。
function handlePollResult(group, words) {
    group.definition.decode(words, status);
    runtime.statusDirty = true;
    runtime.lastUpdate = new Date();
}

// 輪詢失敗：若同一個群組連續 3 次被裝置以例外拒絕，就停用該群組，
// 避免對不支援的位址（例如舊版韌體或 A6L 機種）一直送出無意義的請求。
function handlePollError(group, error) {
    if (error && error.kind === 'exception') {
        group.exceptionStreak++;
        if (group.exceptionStreak >= 3 && group.enabled) {
            group.enabled = false;
            uiHooks.log('warn', lx('群組「{0}」（{1}h）連續被裝置拒絕，已停止輪詢。', lx(group.name), toHex(group.start, 4)));
        }
    }
}

// ==========================================================================
// Block 動作參數（Pr60.00 到 Pr60.57，位址 4600h 到 463Ch）
// 暫存器配置（文件 2-1-4-4）：
//   4600h 到 460Fh  Velocity 0 到 15（r/min）
//   4610h 到 461Fh  Acceleration 0 到 15
//   4620h 到 462Fh  Deceleration 0 到 15
//   4630h           Pr60.48 Block 運轉方式設定（文件標示製造商使用，但內容是位元旗標，必須保留）
//   4631h、4633h、4635h  原點偏移、正向軟體限位、負向軟體限位（各 2 個暫存器）
//   4637h、4638h、4639h  原點復歸高速、低速、加減速
//   463Ah           Homingless（Pr60.55）
//   463Bh、463Ch    加速時間單位、減速時間單位（Pr60.56、Pr60.57，功能增強版 8 以上）
// ==========================================================================

const BLOCK_PARAM_WORD_COUNT = 0x3D;       // 4600h 到 463Ch 共 61 個（含 Pr60.56 與 Pr60.57）
const BLOCK_PARAM_WORD_COUNT_BASE = 0x3B;  // 4600h 到 463Ah 共 59 個（所有版本都有）
const BLOCK_PARAM_METHOD_OFFSET = 0x30;    // 4630h 相對於 4600h 的位移

// 463Bh 與 463Ch（Pr60.56 與 Pr60.57，加減速時間單位）只有功能增強版 8 以上（CPU Ver 1.13 以上）的
// 韌體才有。較舊的韌體讀到這兩個位址會回覆「異常資料位址（02h）」。
// 第一次讀取時自動探測，結果記在這裡；null 表示尚未探測，連線時會重設。
const blockParamSupport = { unitRegisters: null };

// 加減速時間單位的合法值（文件 3-1，Pr60.56 與 Pr60.57）：數值乘以 0.1 ms。
// 0 與 10 都對應 1 ms（文件寫成「0：ms」與「10：ms」）。
const BLOCK_TIME_UNITS = [
    { value: 0, text: '0 : 1 ms' },
    { value: 1, text: '1 : 0.1 ms' },
    { value: 5, text: '5 : 0.5 ms' },
    { value: 10, text: '10 : 1 ms' },
    { value: 100, text: '100 : 10 ms' },
    { value: 1000, text: '1000 : 100 ms' }
];

function createBlockParameters() {
    return {
        velocities: new Array(16).fill(0),
        accelerations: new Array(16).fill(0),
        decelerations: new Array(16).fill(0),
        method: 0,           // Pr60.48，只讀取與保留，畫面不允許修改
        homeOffset: 0, maxLimit: 0, minLimit: 0,
        homingHigh: 0, homingLow: 0, homingAccel: 0, homingless: 0,
        accUnit: 0, decUnit: 0,
        unitSupported: true      // 驅動器是否支援 Pr60.56 與 Pr60.57
    };
}

function parseBlockParameterWords(words) {
    const model = createBlockParameters();
    for (let i = 0; i < 16; i++) {
        model.velocities[i] = words[i];
        model.accelerations[i] = words[16 + i];
        model.decelerations[i] = words[32 + i];
    }
    model.method = toInt16(words[0x30]);
    model.homeOffset = toInt32(words[0x31], words[0x32]);
    model.maxLimit = toInt32(words[0x33], words[0x34]);
    model.minLimit = toInt32(words[0x35], words[0x36]);
    model.homingHigh = words[0x37];
    model.homingLow = words[0x38];
    model.homingAccel = words[0x39];
    model.homingless = words[0x3A];
    model.unitSupported = (words.length >= BLOCK_PARAM_WORD_COUNT);
    model.accUnit = model.unitSupported ? words[0x3B] : 0;
    model.decUnit = model.unitSupported ? words[0x3C] : 0;
    return model;
}

// 依畫面上的數值組出 61 個暫存器。methodWord 必須是剛從驅動器讀回的 4630h 原值。
function buildBlockParameterWords(model, methodWord) {
    const words = new Array(BLOCK_PARAM_WORD_COUNT).fill(0);
    for (let i = 0; i < 16; i++) {
        words[i] = model.velocities[i];
        words[16 + i] = model.accelerations[i];
        words[32 + i] = model.decelerations[i];
    }
    words[0x30] = methodWord & 0xFFFF;                  // 保留 Pr60.48，C# 版這裡誤寫成 0
    const offset = int32ToWords(model.homeOffset);
    words[0x31] = offset[0]; words[0x32] = offset[1];
    const maxWords = int32ToWords(model.maxLimit);
    words[0x33] = maxWords[0]; words[0x34] = maxWords[1];
    const minWords = int32ToWords(model.minLimit);
    words[0x35] = minWords[0]; words[0x36] = minWords[1];
    words[0x37] = model.homingHigh;
    words[0x38] = model.homingLow;
    words[0x39] = model.homingAccel;
    words[0x3A] = model.homingless;
    words[0x3B] = model.accUnit;
    words[0x3C] = model.decUnit;
    // 不支援加減速時間單位的韌體只寫前 59 個，避免寫入不存在的位址
    return model.unitSupported ? words : words.slice(0, BLOCK_PARAM_WORD_COUNT_BASE);
}

// 讀取 Block 動作參數。先嘗試讀 61 個，若被驅動器以「異常資料位址」拒絕，
// 就判定韌體不支援 Pr60.56 與 Pr60.57，改讀 59 個，之後都直接讀 59 個。
async function readBlockParameters() {
    let words = null;
    if (blockParamSupport.unitRegisters !== false) {
        try {
            words = await readRegisters(REG_BLOCK_PARAM_START, BLOCK_PARAM_WORD_COUNT, { probe: true });
            blockParamSupport.unitRegisters = true;
        } catch (error) {
            if (!(error && error.kind === 'exception' && error.exceptionCode === 2)) { throw error; }
            blockParamSupport.unitRegisters = false;
            uiHooks.log('warn', lx('此驅動器韌體不支援 Pr60.56 與 Pr60.57（463Bh、463Ch，需功能增強版 8 以上），改為只讀寫 4600h 到 463Ah 共 59 個暫存器，加減速時間單位固定為 ms。'));
        }
    }
    if (blockParamSupport.unitRegisters === false) {
        words = await readRegisters(REG_BLOCK_PARAM_START, BLOCK_PARAM_WORD_COUNT_BASE);
    }
    return parseBlockParameterWords(words);
}

// 寫入 Block 參數並讀回驗證。回傳 { verified, mismatches[] }。
async function writeBlockParameters(model) {
    // 先重新讀一次 4630h，確保保留的是驅動器目前的值，而不是畫面上舊的快取。
    const methodNow = await readRegisters(REG_BLOCK_PARAM_START + BLOCK_PARAM_METHOD_OFFSET, 1);
    const words = buildBlockParameterWords(model, methodNow[0]);
    await writeRegisters(REG_BLOCK_PARAM_START, words);
    const back = await readRegisters(REG_BLOCK_PARAM_START, words.length);
    const mismatches = [];
    for (let i = 0; i < words.length; i++) {
        if (words[i] !== back[i]) { mismatches.push(toHex(REG_BLOCK_PARAM_START + i, 4) + 'h'); }
    }
    return { verified: mismatches.length === 0, mismatches: mismatches };
}

// 驗證畫面輸入。回傳 { errors[], warnings[] }：errors 不可寫入，warnings 需使用者確認。
// 兩個清單的每一項都是延遲翻譯物件（LText），顯示時才依當下語言翻譯。
function validateBlockParameters(model) {
    const errors = [];
    const warnings = [];
    const inRange = function (value, low, high) { return Number.isInteger(value) && value >= low && value <= high; };
    for (let i = 0; i < 16; i++) {
        // 文件 3-1：設定範圍 0 到 32767，但註解 *2 說明參數設定值最大為 20000。
        if (!inRange(model.velocities[i], 0, 20000)) { errors.push(lx('Velocity {0} 必須是 0 到 20000 的整數', i)); }
        if (!inRange(model.accelerations[i], 0, 10000)) { errors.push(lx('Acceleration {0} 必須是 0 到 10000 的整數', i)); }
        if (!inRange(model.decelerations[i], 0, 10000)) { errors.push(lx('Deceleration {0} 必須是 0 到 10000 的整數', i)); }
    }
    const int32Low = -2147483648;
    const int32High = 2147483647;
    if (!inRange(model.homeOffset, int32Low, int32High)) { errors.push(lx('Block home offset 超出 32 位元範圍')); }
    if (!inRange(model.maxLimit, int32Low, int32High)) { errors.push(lx('Block max position limit 超出 32 位元範圍')); }
    if (!inRange(model.minLimit, int32Low, int32High)) { errors.push(lx('Block min position limit 超出 32 位元範圍')); }
    if (!inRange(model.homingHigh, 0, 20000)) { errors.push(lx('Block homing speed (high) 必須是 0 到 20000 的整數')); }
    if (!inRange(model.homingLow, 0, 20000)) { errors.push(lx('Block homing speed (low) 必須是 0 到 20000 的整數')); }
    if (!inRange(model.homingAccel, 0, 10000)) { errors.push(lx('Block homing acceleration 必須是 0 到 10000 的整數')); }
    if (!inRange(model.homingless, 0, 1)) { errors.push(lx('Block homingless 必須是 0 或 1')); }
    if (model.unitSupported) {
        const unitValues = BLOCK_TIME_UNITS.map(function (u) { return u.value; });
        if (unitValues.indexOf(model.accUnit) < 0) { errors.push(lx('Acceleration unit 不是合法值')); }
        if (unitValues.indexOf(model.decUnit) < 0) { errors.push(lx('Deceleration unit 不是合法值')); }
    }
    if (errors.length === 0) {
        // 文件 3-1 註解 *5：正向軟體限位要大於負向軟體限位，原點偏移要落在兩者之間。
        if (model.maxLimit <= model.minLimit) {
            warnings.push(lx('正向軟體限位（{0}）沒有大於負向軟體限位（{1}），文件要求正向須大於負向。', model.maxLimit, model.minLimit));
        } else if (model.homeOffset < model.minLimit || model.homeOffset > model.maxLimit) {
            warnings.push(lx('原點偏移（{0}）不在負向與正向軟體限位之間，文件要求必須落在兩者之間。', model.homeOffset));
        }
    }
    return { errors: errors, warnings: warnings };
}

// ==========================================================================
// Block 規劃（Pr56.000 到 Pr59.127，位址 4800h 到 4BFFh）
// 256 個 Block，每個 4 個暫存器：指令 2 個、資料 2 個（低字組在前）。
// 一次讀寫 16 個 Block（64 個暫存器），共 16 次。
// ==========================================================================

const BLOCK_COUNT = 256;
const BLOCK_GROUP_SIZE = 16;
const BLOCK_GROUP_COUNT = BLOCK_COUNT / BLOCK_GROUP_SIZE;
const BLOCK_PLAN_WORD_COUNT = BLOCK_COUNT * 4;

function createBlockPlan() {
    return {
        commands: new Array(BLOCK_COUNT).fill(0),
        data: new Array(BLOCK_COUNT).fill(0)
    };
}

function parseBlockPlanWords(words) {
    const plan = createBlockPlan();
    for (let i = 0; i < BLOCK_COUNT; i++) {
        plan.commands[i] = toInt32(words[i * 4], words[i * 4 + 1]);
        plan.data[i] = toInt32(words[i * 4 + 2], words[i * 4 + 3]);
    }
    return plan;
}

function buildBlockPlanWords(plan) {
    const words = new Array(BLOCK_PLAN_WORD_COUNT);
    for (let i = 0; i < BLOCK_COUNT; i++) {
        const commandWords = int32ToWords(plan.commands[i]);
        const dataWords = int32ToWords(plan.data[i]);
        words[i * 4] = commandWords[0];
        words[i * 4 + 1] = commandWords[1];
        words[i * 4 + 2] = dataWords[0];
        words[i * 4 + 3] = dataWords[1];
    }
    return words;
}

// 讀取整份 Block 規劃。只要任何一段失敗就丟出錯誤，由呼叫端決定如何處理，
// 絕不回傳殘缺資料。onProgress(完成段數, 總段數) 用於顯示進度。
async function readBlockPlan(onProgress) {
    const words = new Array(BLOCK_PLAN_WORD_COUNT);
    for (let group = 0; group < BLOCK_GROUP_COUNT; group++) {
        const part = await readRegisters(REG_BLOCK_PLAN_START + group * 64, 64);
        for (let i = 0; i < 64; i++) { words[group * 64 + i] = part[i]; }
        if (onProgress) { onProgress(group + 1, BLOCK_GROUP_COUNT); }
    }
    return parseBlockPlanWords(words);
}

// 寫入整份 Block 規劃，之後讀回驗證。回傳 { verified, mismatchBlocks[] }。
async function writeBlockPlan(plan, onProgress) {
    const words = buildBlockPlanWords(plan);
    for (let group = 0; group < BLOCK_GROUP_COUNT; group++) {
        await writeRegisters(REG_BLOCK_PLAN_START + group * 64, words.slice(group * 64, group * 64 + 64));
        if (onProgress) { onProgress(group + 1, BLOCK_GROUP_COUNT * 2); }
    }
    const back = await readBlockPlan(function (done) {
        if (onProgress) { onProgress(BLOCK_GROUP_COUNT + done, BLOCK_GROUP_COUNT * 2); }
    });
    const mismatchBlocks = [];
    for (let i = 0; i < BLOCK_COUNT; i++) {
        if (back.commands[i] !== plan.commands[i] || back.data[i] !== plan.data[i]) { mismatchBlocks.push(i); }
    }
    return { verified: mismatchBlocks.length === 0, mismatchBlocks: mismatchBlocks };
}

// ==========================================================================
// EEPROM、清除、Servo ON、Block 啟動
// ==========================================================================

// 寫入 EEPROM：把「全部」伺服參數寫入非揮發記憶體，約需 300 毫秒（文件 2-1-3-1）。
async function saveAllParametersToEeprom() {
    return writeRegister(REG_SAVE_ALL_PARAMETERS, MAGIC_SAVE_EEPROM,
        { timeoutMs: TIMEOUT_EEPROM_MS, retries: 1 });
}

// 清除多圈資料。文件 2-7-2 要求清除前必須先關閉 Servo，清除後要重新送電。
async function clearMultiTurnData(magicValue) {
    return writeRegister(REG_ABSOLUTE_CLEAR, magicValue);
}

async function clearAlarm(magicValue) {
    return writeRegister(REG_TRIP_RESET, magicValue);
}

async function setServoOn(isOn) {
    return writeCoil(COIL_SERVO_ON, isOn);
}

// 啟動指定的 Block：先寫入 Block 編號，間隔後再送出 STB 脈衝。
// 文件 5 的時序圖要求 B-SELn 到 STB 之間至少間隔 10 毫秒，這裡用 30 毫秒。
async function startBlock(blockNumber) {
    await writeRegister(REG_BLOCK_NUMBER, blockNumber);
    await sleep(30);
    await writeCoil(COIL_STROBE, true);
    await sleep(30);
    await writeCoil(COIL_STROBE, false);
}

// ==========================================================================
// 驅動器識別
// 連線後讀取 1000h 的驅動器型號與 1010h 的軟體版本（各 8 個暫存器，每個暫存器內兩個字元順序相反），
// 寫入通訊記錄。韌體版本不同，支援的功能也不同（例如 Pr60.56 與 Pr60.57 需功能增強版 8 以上）。
// 讀取失敗不影響其他功能。
// ==========================================================================

async function identifyDrive() {
    try {
        const model = await readRegisters(0x1000, 8, { probe: true });
        const version = await readRegisters(0x1010, 8, { probe: true });
        uiHooks.log('info', lx('驅動器型號：{0}，軟體版本：{1}', decodeAsciiRegisters(model, 0, 8), decodeAsciiRegisters(version, 0, 8)));
    } catch (error) {
        uiHooks.log('warn', lx('無法讀取驅動器型號與軟體版本：{0}', errorText(error)));
    }
}

// ==========================================================================
// 伺服參數與通訊權
// ==========================================================================

async function readServoParameter(parameterClass, parameterNo) {
    const words = await readRegisters(servoParameterAddress(parameterClass, parameterNo), 2);
    return toInt32(words[0], words[1]);
}

// 寫入伺服參數必須用 10h 且暫存器數量為 2（文件 2-1-4-4），寫入後讀回確認。
async function writeServoParameter(parameterClass, parameterNo, value) {
    const address = servoParameterAddress(parameterClass, parameterNo);
    await writeRegisters(address, int32ToWords(value));
    const back = await readServoParameter(parameterClass, parameterNo);
    if (back !== value) {
        throw new LocalizedError(lx('Pr{0}.{1} 寫入後讀回為 {2}，與寫入值 {3} 不一致', parameterClass, parameterNo, back, value));
    }
}

// 取得通訊權後，前面板除監視模式外全部無法操作，且 Pr5.40 逾時保護（Err80.0）才會生效。
async function acquireCommRight() {
    await writeRegister(REG_COMM_RIGHT, MAGIC_COMM_RIGHT_ACQUIRE);
    runtime.commRightEnabled = true;
}

async function releaseCommRight() {
    await writeRegister(REG_COMM_RIGHT, MAGIC_COMM_RIGHT_RELEASE, { retries: 1 });
    runtime.commRightEnabled = false;
}

// ==========================================================================
// 試運轉與 JOG
// 做法與 C# 版相同：把 Block 254 設成正向 JOG、Block 255 設成負向 JOG，
// 都使用「第 15 組」的速度、加速時間、減速時間。JOG 一旦啟動會持續運轉，
// 直到收到減速停止（S-STOP）或立即停止（H-STOP）輸入。
// ==========================================================================

const TRIAL_BLOCK_POSITIVE = 254;
const TRIAL_BLOCK_NEGATIVE = 255;
const TRIAL_BLOCKS_ADDRESS = REG_BLOCK_PLAN_START + TRIAL_BLOCK_POSITIVE * 4;   // 4BF8h
const TRIAL_VELOCITY_ADDRESS = REG_BLOCK_PARAM_START + 15;                      // 460Fh
const TRIAL_ACCELERATION_ADDRESS = REG_BLOCK_PARAM_START + 16 + 15;             // 461Fh
const TRIAL_DECELERATION_ADDRESS = REG_BLOCK_PARAM_START + 32 + 15;             // 462Fh

// Block 254 指令 03FFF000h：JOG、速度 15、加速 15、減速 15、正向、結束。
// Block 255 指令 03FFF400h：同上，但方向為負向。資料欄位為 0。
// 暫存器為低字組在前，所以 03FFF000h 寫成 F000h、03FFh。
const TRIAL_BLOCK_WORDS = [0xF000, 0x03FF, 0x0000, 0x0000, 0xF400, 0x03FF, 0x0000, 0x0000];

const trial = {
    enabled: false,
    backup: null,           // 啟用前備份的原始資料，結束時還原
    lastJogParams: null     // 最近一次寫入驅動器的 JOG 參數，用來避免重複寫入
};

// 啟用試運轉：備份、寫入測試用的 Block 與參數。
async function enableTrialOperation(velocity, acceleration, deceleration) {
    const blocks = await readRegisters(TRIAL_BLOCKS_ADDRESS, 8);
    const velocityWord = await readRegisters(TRIAL_VELOCITY_ADDRESS, 1);
    const accelerationWord = await readRegisters(TRIAL_ACCELERATION_ADDRESS, 1);
    const decelerationWord = await readRegisters(TRIAL_DECELERATION_ADDRESS, 1);
    trial.backup = {
        blocks: blocks,
        velocity: velocityWord[0],
        acceleration: accelerationWord[0],
        deceleration: decelerationWord[0]
    };
    await writeRegisters(TRIAL_BLOCKS_ADDRESS, TRIAL_BLOCK_WORDS);
    await writeRegister(TRIAL_VELOCITY_ADDRESS, velocity);
    await writeRegister(TRIAL_ACCELERATION_ADDRESS, acceleration);
    await writeRegister(TRIAL_DECELERATION_ADDRESS, deceleration);
    trial.lastJogParams = { velocity: velocity, acceleration: acceleration, deceleration: deceleration };
    trial.enabled = true;
}

// 結束試運轉：把備份的資料還原。
async function disableTrialOperation() {
    const backup = trial.backup;
    trial.enabled = false;
    trial.backup = null;
    trial.lastJogParams = null;
    if (backup === null) { return; }
    await writeRegisters(TRIAL_BLOCKS_ADDRESS, backup.blocks);
    await writeRegister(TRIAL_VELOCITY_ADDRESS, backup.velocity);
    await writeRegister(TRIAL_ACCELERATION_ADDRESS, backup.acceleration);
    await writeRegister(TRIAL_DECELERATION_ADDRESS, backup.deceleration);
}

// 停止馬達。kind 為 'S'（減速停止，0124h）或 'H'（立即停止，0123h）。
// 流程：送出停止輸入，持續確認馬達低於 30 r/min（4410h 的 bit1），確認停下後才放開輸入。
// 減速停止如果送不出去，或超時馬達仍未停止，會升級為立即停止。
// 回傳 { stopped, usedFallback }。
async function stopMotion(kind) {
    const urgent = { priority: 'urgent', retries: 3 };
    const mainCoil = (kind === 'H') ? COIL_H_STOP : COIL_S_STOP;
    let usedFallback = false;
    let fallbackActive = false;
    try {
        await writeCoil(mainCoil, true, urgent);
    } catch (error) {
        if (kind !== 'S') { throw error; }
        // 減速停止送不出去：改用立即停止，這次再失敗就只能丟出錯誤。
        await writeCoil(COIL_H_STOP, true, urgent);
        usedFallback = true;
        fallbackActive = true;
    }
    const waitUntilStopped = async function (limitMs) {
        const startedAt = nowMs();
        while (nowMs() - startedAt < limitMs) {
            const words = await readRegisters(0x4410, 1, urgent);
            if ((words[0] & 0x02) !== 0) { return true; }       // 低於 30 r/min
            await sleep(50);
        }
        return false;
    };
    let stopped = await waitUntilStopped(kind === 'H' ? 2000 : 6000);
    if (!stopped && kind === 'S' && !fallbackActive) {
        await writeCoil(COIL_H_STOP, true, urgent);
        usedFallback = true;
        fallbackActive = true;
        stopped = await waitUntilStopped(2000);
    }
    // 放開停止輸入。即使前面出錯，也要盡量把已經送出的輸入關掉。
    await writeCoil(mainCoil, false, urgent);
    if (fallbackActive && mainCoil !== COIL_H_STOP) {
        await writeCoil(COIL_H_STOP, false, urgent);
    }
    return { stopped: stopped, usedFallback: usedFallback };
}

// JOG 控制器：用狀態機處理「按住才動、放開就停」。
// 狀態：idle（閒置）、starting（啟動中）、running（運轉中）、stopping（停止中）。
const jogController = {
    state: 'idle',
    pressed: false,
    watchdog: null,
    // 以下三個由畫面層指定
    isSafeToContinue: function () { return true; },     // 回傳 false 代表分頁被隱藏、視窗失焦等，必須停止
    onState: function (state) { },
    onMessage: function (level, text) { },       // text 為延遲翻譯物件（LText）或字串

    _setState: function (state) {
        this.state = state;
        this.onState(state);
    },

    // 按下 JOG 按鈕。direction：0 正向、1 負向。params：{ velocity, acceleration, deceleration }。
    press: async function (direction, params) {
        if (this.state !== 'idle') { return; }
        this._setState('starting');
        this.pressed = true;
        let strobeSent = false;
        try {
            if ((status.LogicalInput & 0x01) === 0) {
                throw new LocalizedError(lx('Servo 尚未 ON，無法 JOG。請先按 Servo ON。'));
            }
            if (status.ErrorCode !== 0) {
                throw new LocalizedError(lx('驅動器目前有警報，無法 JOG。請先排除警報並清除。'));
            }
            // 只有參數改變時才寫入，並且只寫這三個暫存器。
            const last = trial.lastJogParams;
            if (last === null || last.velocity !== params.velocity) {
                await writeRegister(TRIAL_VELOCITY_ADDRESS, params.velocity);
            }
            if (last === null || last.acceleration !== params.acceleration) {
                await writeRegister(TRIAL_ACCELERATION_ADDRESS, params.acceleration);
            }
            if (last === null || last.deceleration !== params.deceleration) {
                await writeRegister(TRIAL_DECELERATION_ADDRESS, params.deceleration);
            }
            trial.lastJogParams = { velocity: params.velocity, acceleration: params.acceleration, deceleration: params.deceleration };
            await writeRegister(REG_BLOCK_NUMBER, direction === 0 ? TRIAL_BLOCK_POSITIVE : TRIAL_BLOCK_NEGATIVE);
            await sleep(30);
            // 啟動前最後一次確認：使用者已經放開，或分頁已被隱藏，就不要啟動。
            if (!this.pressed || !this.isSafeToContinue()) {
                this.onMessage('warn', lx('JOG 在啟動前就被取消（按鈕已放開或視窗失去焦點），未啟動。'));
                this._setState('idle');
                return;
            }
            strobeSent = true;
            await writeCoil(COIL_STROBE, true);
            await sleep(30);
            await writeCoil(COIL_STROBE, false);
            this._setState('running');
            this._startWatchdog();
            if (!this.pressed) {
                await this._stopAndReport(lx('啟動途中按鈕已放開'));
            }
        } catch (error) {
            this.onMessage('error', lx('JOG 啟動失敗：{0}', errorText(error)));
            if (strobeSent) {
                await this._stopAndReport(lx('啟動失敗後的保險停止'));
            } else {
                this._setState('idle');
            }
        }
    },

    // 放開 JOG 按鈕（或其他需要停止的情況）。
    // reason 可以是字串或 LText（延遲翻譯物件）。
    release: function (reason) {
        this.pressed = false;
        if (this.state === 'running') {
            this._stopAndReport(reason);
        }
    },

    _startWatchdog: function () {
        const self = this;
        this._stopWatchdog();
        this.watchdog = setInterval(function () {
            if (self.state === 'running' && (!self.pressed || !self.isSafeToContinue())) {
                self.pressed = false;
                self._stopAndReport(lx('安全檢查：按鈕已放開或視窗失去焦點'));
            }
        }, 100);
    },

    _stopWatchdog: function () {
        if (this.watchdog !== null) {
            clearInterval(this.watchdog);
            this.watchdog = null;
        }
    },

    _stopAndReport: async function (reason) {
        if (this.state === 'stopping') { return; }
        this._setState('stopping');
        this._stopWatchdog();
        try {
            const result = await stopMotion('S');
            if (!result.stopped) {
                this.onMessage('error', lx('馬達在時限內沒有停止，請立刻使用外部緊急停止！（原因：{0}）', reason));
            } else if (result.usedFallback) {
                this.onMessage('warn', lx('減速停止未能完成，已改用立即停止（H-STOP）。（原因：{0}）', reason));
            }
        } catch (error) {
            this.onMessage('error', lx('停止命令失敗：{0}。請立刻使用外部緊急停止！', errorText(error)));
        } finally {
            this._setState('idle');
        }
    }
};


/* ==========================================================================
   第五部分：畫面層（上）
   內容：DOM 輔助函式、對話框（取代 alert 與 confirm）、通訊記錄、
         狀態欄位與燈號的建立、畫面更新。

   畫面更新策略（對應 C# 版「每個回應都重刷 200 多個控制項」的問題）：
   輪詢結果只寫進 status 物件並設定 statusDirty，畫面每 100 毫秒檢查一次，
   而且只更新「文字有變動」的欄位，大幅降低畫面負擔。
   ========================================================================== */

// ---------- DOM 輔助 ----------

function $(id) {
    return document.getElementById(id);
}

// 建立元素。props 會逐一指定到元素上，className 與 text 有特別處理；children 為子元素陣列。
function el(tagName, props, children) {
    const element = document.createElement(tagName);
    if (props) {
        for (const key of Object.keys(props)) {
            if (key === 'className') { element.className = props[key]; }
            else if (key === 'text') { element.textContent = props[key]; }
            else { element[key] = props[key]; }
        }
    }
    if (children) {
        for (const child of children) {
            if (child) { element.appendChild(child); }
        }
    }
    return element;
}

// 全域畫面狀態。
