// ==========================================================================
// 對話框：取代 alert 與 confirm
// 原生對話框會卡住整個頁面，JOG 與輪詢都會被迫暫停；這個版本是非阻塞的。
// 依序排隊顯示，每次回傳按下的按鈕 value。
// ==========================================================================

const MessageBox = {
    chain: Promise.resolve(),
    active: null,           // 目前顯示中的對話框記錄；切換語言時用來重新翻譯正在顯示的內容

    // buttons：[{ text, value, primary, cancel }]。cancel 為 true 的按鈕對應 Esc 鍵。
    // kind：'info'、'warning'、'error'，影響標題顏色。
    // text、title、按鈕的 text 都可以是字串或 LText（延遲翻譯物件），這樣對話框開著時切換語言也會即時重翻。
    // extraBuilder：可選，回傳要插在內文與按鈕之間的元件（例如開場警告裡的語言選單）。
    show: function (text, title, buttons, kind, extraBuilder) {
        const self = this;
        const run = function () { return self._display(text, title, buttons, kind || 'info', extraBuilder); };
        const result = this.chain.then(run, run);
        this.chain = result.catch(function () { /* 不讓錯誤中斷後續對話框 */ });
        return result;
    },

    ok: function (text, title, kind) {
        return this.show(text, title || APP_TITLE, [{ text: lx('OK'), value: 'OK', primary: true, cancel: true }], kind || 'info');
    },

    yesNo: function (text, title, kind) {
        return this.show(text, title || APP_TITLE, [
            { text: lx('Yes'), value: 'Yes', primary: true },
            { text: lx('No'), value: 'No', cancel: true }
        ], kind || 'warning');
    },

    // 依目前語言重新翻譯正在顯示的對話框（標題、內文、按鈕）。沒有對話框時什麼都不做。
    refreshActive: function () {
        const active = this.active;
        if (!active) { return; }
        active.heading.textContent = resolveText(active.title);
        active.body.textContent = resolveText(active.text);
        for (const item of active.buttons) {
            item.element.textContent = resolveText(item.definition.text);
        }
    },

    _display: function (text, title, buttons, kind, extraBuilder) {
        const self = this;
        return new Promise(function (resolve) {
            const previousFocus = document.activeElement;
            const overlay = el('div', { className: 'dialogOverlay' });
            const box = el('div', { className: 'dialogBox kind' + kind.charAt(0).toUpperCase() + kind.slice(1), role: 'dialog' });
            box.setAttribute('aria-modal', 'true');
            const heading = el('h2', { text: resolveText(title) });
            const body = el('div', { className: 'dialogBody', text: resolveText(text) });
            box.appendChild(heading);
            box.appendChild(body);
            if (extraBuilder) {
                const extra = extraBuilder();
                if (extra) { box.appendChild(extra); }
            }
            const buttonRow = el('div', { className: 'dialogButtons' });
            let cancelValue = buttons[buttons.length - 1].value;
            const buttonElements = [];
            const activeButtons = [];
            const record = { title: title, text: text, heading: heading, body: body, buttons: activeButtons };
            const close = function (value) {
                document.removeEventListener('keydown', onKey, true);
                overlay.remove();
                if (self.active === record) { self.active = null; }
                if (previousFocus && previousFocus.focus) { try { previousFocus.focus(); } catch (ignore) { /* 忽略 */ } }
                resolve(value);
            };
            for (const definition of buttons) {
                const button = el('button', { type: 'button', text: resolveText(definition.text), className: definition.primary ? 'primary' : '' });
                if (definition.cancel) { cancelValue = definition.value; }
                button.addEventListener('click', function () { close(definition.value); });
                buttonRow.appendChild(button);
                buttonElements.push(button);
                activeButtons.push({ definition: definition, element: button });
            }
            const onKey = function (event) {
                if (event.key === 'Escape') { event.preventDefault(); close(cancelValue); }
                else if (event.key === 'Tab') {
                    // 讓焦點只在對話框內循環（按鈕與開場警告裡的語言選單）
                    const focusables = Array.prototype.slice.call(box.querySelectorAll('select, button'));
                    const index = focusables.indexOf(document.activeElement);
                    event.preventDefault();
                    const next = event.shiftKey ? (index <= 0 ? focusables.length - 1 : index - 1)
                        : (index + 1) % focusables.length;
                    focusables[next].focus();
                }
            };
            document.addEventListener('keydown', onKey, true);
            box.appendChild(buttonRow);
            overlay.appendChild(box);
            document.body.appendChild(overlay);
            self.active = record;
            // 預設焦點放在「次要」按鈕上，避免使用者連按 Enter 就確認危險操作
            const defaultButton = buttonElements.length > 1 ? buttonElements[buttonElements.length - 1] : buttonElements[0];
            defaultButton.focus();
        });
    }
};

// ==========================================================================
// 通訊記錄
// 以 DOM 逐行附加，超過上限時從最舊的移除。不使用 C# 版那種每次都重新計算全部行數的方式。
// ==========================================================================

const LOG_MAX_LINES = 1000;
// entries 保存每一筆記錄的 { kind, time, text }，text 為字串或 LText。
// 因為保存的是「尚未翻譯的訊息」，切換語言時可以用 rebuildLog 整份重翻。
const logState = { pending: [], entries: [], autoScroll: true };

function appendLog(kind, text) {
    const entry = { kind: kind, time: new Date(), text: text };
    logState.pending.push(entry);
    logState.entries.push(entry);
    if (logState.entries.length > LOG_MAX_LINES) { logState.entries.shift(); }
}

// 單筆記錄的顯示文字（時間 + 兩個空格 + 依目前語言翻譯的內容）與樣式名稱。
function logLineText(entry) {
    return formatClock(entry.time) + '  ' + resolveText(entry.text);
}

function logLineClass(entry) {
    return 'log' + entry.kind.charAt(0).toUpperCase() + entry.kind.slice(1);
}

// 目前保留的全部記錄文字，供「複製記錄」使用。
function getLogText() {
    return logState.entries.map(logLineText).join('\n');
}

function flushLog() {
    if (logState.pending.length === 0) { return; }
    const box = $('CommLog_richTextBox');
    if (!box) { logState.pending.length = 0; return; }
    const fragment = document.createDocumentFragment();
    const items = logState.pending.splice(0, logState.pending.length);
    // 一次最多附加最新的 LOG_MAX_LINES 行，避免突發大量記錄拖慢畫面
    const start = Math.max(0, items.length - LOG_MAX_LINES);
    for (let i = start; i < items.length; i++) {
        fragment.appendChild(el('div', { className: logLineClass(items[i]), text: logLineText(items[i]) }));
    }
    box.appendChild(fragment);
    while (box.childNodes.length > LOG_MAX_LINES) { box.removeChild(box.firstChild); }
    if (logState.autoScroll) { box.scrollTop = box.scrollHeight; }
}

// 切換語言時整份重建：用目前語言把所有保留的記錄重新翻譯一次。
function rebuildLog() {
    const box = $('CommLog_richTextBox');
    if (!box) { return; }
    logState.pending.length = 0;
    while (box.firstChild) { box.removeChild(box.firstChild); }
    const fragment = document.createDocumentFragment();
    for (const entry of logState.entries) {
        fragment.appendChild(el('div', { className: logLineClass(entry), text: logLineText(entry) }));
    }
    box.appendChild(fragment);
    if (logState.autoScroll) { box.scrollTop = box.scrollHeight; }
}

function clearLog() {
    logState.pending.length = 0;
    logState.entries.length = 0;
    const box = $('CommLog_richTextBox');
    while (box.firstChild) { box.removeChild(box.firstChild); }
}

const renderRegistry = { fields: [], lamps: [] };
const renderCache = {};

// 控制模式名稱（key），顯示時為「編號 + 空格 + 依語言翻譯的名稱」。
const CONTROL_MODE_KEYS = ['Position control', 'Velocity control', 'Torque control', 'Full closed control'];

function formatFieldValue(fmt, value, prop) {
    switch (fmt) {
        case 'hex4': return toHex(value, 4) + 'h';
        case 'hex8': return toHex(value, 8) + 'h';
        case 'bin5': return toBinaryString(value, 5);
        case 'bin8': return toBinaryString(value, 8);
        case 'text': return String(value);
        case 'errcode':
            return value === 0 ? ('0 (' + t('No Error') + ')') : ('Err' + ((value >> 8) & 0xFF) + '.' + (value & 0xFF));
        case 'ctrlmode':
            return CONTROL_MODE_KEYS[value] ? (value + ' ' + t(CONTROL_MODE_KEYS[value])) : String(value);
        default: return String(value);
    }
}

// 建立一欄欄位。每個欄位是「標籤文字加唯讀輸入框」。
function buildFieldColumn(definitions, onAction) {
    const column = el('div', { className: 'fieldColumn' });
    for (const definition of definitions) {
        const row = el('div', { className: 'fieldRow' });
        // 標籤、提示、無障礙文字都用 bindText 綁定，切換語言時整批重刷
        const caption = el('span', { title: definition.tip });
        bindText(caption, 'text', definition.label);
        bindText(caption, 'title', definition.tip);
        row.appendChild(caption);
        const input = el('input', { type: 'text', readOnly: true, id: definition.prop + '_textBox', className: 'valueBox' });
        bindText(input, 'title', definition.tip);
        bindText(input, 'aria', definition.label);
        if (definition.kind === 'action') {
            // 讀值框之外，再加一個「寫入魔術值」的輸入框與按鈕，例如清除多圈資料用的 6165
            input.id = definition.prop + '_textBox1';
            const magicBox = el('input', { type: 'text', id: definition.prop + '_textBox', className: 'shortBox', value: definition.defaultMagic, maxLength: 4 });
            bindText(magicBox, 'title', '要寫入的十六進位值');
            bindText(magicBox, 'aria', '{0} 寫入值', lx(definition.label));
            const button = el('button', { type: 'button', id: definition.prop + '_button' });
            bindText(button, 'text', definition.buttonText);
            button.addEventListener('click', function () { onAction(definition.prop); });
            const line = el('div', { className: 'withButton' }, [input, magicBox, button]);
            row.appendChild(line);
            renderRegistry.fields.push({ element: input, prop: definition.prop, fmt: 'dec' });
        } else {
            row.appendChild(input);
            renderRegistry.fields.push({ element: input, prop: definition.prop, fmt: definition.fmt });
        }
        column.appendChild(row);
    }
    return column;
}

function buildStatusPages(onAction) {

// ==========================================================================

function buildLampGrid(containerId, className, lampDefinitions, prop, idPrefix, wide) {
    const container = $(containerId);
    container.className = 'lampGrid ' + className;
    for (const definition of lampDefinitions) {
        const lamp = el('span', { className: 'lamp isUnknown' + (wide ? ' wide' : '') });
        bindText(lamp, 'text', definition[0]);     // 訊號代號多半不翻譯（字典沒有就原樣顯示），動作狀態等名稱會翻譯
        if (idPrefix) { lamp.id = idPrefix + definition[0] + '_label'; }
        container.appendChild(lamp);
        renderRegistry.lamps.push({ element: lamp, prop: prop, bit: definition[1] });
    }
}

function buildIoPanel() {
    // 實體輸入 SI1 到 SI10，實體輸出 SO1 到 SO6
    const siLamps = []; for (let i = 1; i <= 10; i++) { siLamps.push(['SI' + i, i - 1]); }
    const soLamps = []; for (let i = 1; i <= 6; i++) { soLamps.push(['SO' + i, i - 1]); }
    buildLampGrid('PhysicalInputLamps_panel', 'cols5', siLamps, 'PhysicalInput', 'Pin');
    buildLampGrid('PhysicalOutputLamps_panel', 'cols3', soLamps, 'PhysicalOutput', 'Pout');
    // 邏輯輸入與輸出：C# 版是三欄，由上往下、由左往右排列。以 CSS grid 的欄優先排列達成。
    buildLampGrid('LogicalInputLamps_panel', 'cols3 columnFlow8', LOGICAL_INPUT_LAMPS, 'LogicalInput', 'LonIn_');
    buildLampGrid('LogicalOutputLamps_panel', 'cols3 columnFlow6', LOGICAL_OUTPUT_LAMPS, 'LogicalOutput', 'LonOut_');
    buildLampGrid('MotorStateLamps_panel', 'cols2', MOTOR_STATE_LAMPS, 'MotorActivationState', 'Sta_');
    // Block 狀態燈號的訊號名稱較長（如 HOME-CMP、B-CTRL1），一列兩個才不會被截斷
    buildLampGrid('BlockStatusLamps_panel', 'cols2', BLOCK_STATUS_LAMPS, 'BlockStatusFlag', 'Blk_');
    // 數值文字框（二進位顯示）
    const binaryBoxes = [
        ['PhysicalInput_textBox', 'PhysicalInput', 'bin10'],
        ['PhysicalOutput_textBox', 'PhysicalOutput', 'bin6'],
        ['LogicalInput_textBox', 'LogicalInput', 'bin32'],
        ['VirtualInput_textBox', 'VirtualInput', 'bin32'],
        ['LogicalOutput_textBox', 'LogicalOutput', 'bin32'],
        ['MotorActivationState_textBox', 'MotorActivationState', 'bin4']
    ];
    for (const entry of binaryBoxes) {
        renderRegistry.fields.push({ element: $(entry[0]), prop: entry[1], fmt: entry[2] });
    }
}

// ==========================================================================
// 畫面更新
// ==========================================================================

function formatBinaryField(fmt, value) {
    const bits = parseInt(fmt.slice(3), 10);
    return toBinaryString(value, bits);
}

function setElementValue(element, text) {
    if (renderCache[element.id] !== text) {
        renderCache[element.id] = text;
        element.value = text;
    }
}

// 是否已經收到過任何輪詢資料（沒有的話燈號顯示灰色）。
function hasLiveData() {
    return runtime.lastUpdate !== null && bus.linkAlive;
}

function renderStatus() {
    const live = hasLiveData();
    if (!runtime.statusDirty && renderCache.live === live) { return; }
    runtime.statusDirty = false;
    renderCache.live = live;

    for (const entry of renderRegistry.fields) {
        const value = status[entry.prop];
        let text;
        if (!live) { text = ''; }
        else if (entry.fmt.indexOf('bin') === 0) { text = formatBinaryField(entry.fmt, value); }
        else { text = formatFieldValue(entry.fmt, value, entry.prop); }
        setElementValue(entry.element, text);
    }
    for (const lamp of renderRegistry.lamps) {
        let className = 'lamp' + (lamp.element.classList.contains('wide') ? ' wide' : '');
        if (!live) { className += ' isUnknown'; }
        else if (((status[lamp.prop] >>> lamp.bit) & 1) === 1) { className += ' isOn'; }
        if (lamp.element.className !== className) { lamp.element.className = className; }
    }

    // 錯誤碼訊息
    const errorBox = $('ErrorCodeMess_label');
    if (live) {
        const info = describeErrorCode(status.ErrorCode);
        if (renderCache.errorText !== info.text) {
            renderCache.errorText = info.text;
            errorBox.textContent = info.text;
            errorBox.className = 'errorCodeBox ' + (info.hasError ? 'hasError' : 'noError');
        }
    } else {
        // 還沒有資料：未連線顯示「尚未連線」，已連線但還沒收到資料顯示「尚未取得資料」
        const idleText = ui.connected ? t('尚未取得資料') : t('尚未連線');
        if (renderCache.errorText !== idleText) {
            renderCache.errorText = idleText;
            errorBox.textContent = idleText;
            errorBox.className = 'errorCodeBox';
        }
    }

    // Servo ON 按鈕的文字依狀態切換
    const servoButton = $('ServoOn_Button');
    const servoIsOn = live && ((status.LogicalInput & 0x01) !== 0);
    const servoText = servoIsOn ? 'Servo OFF' : 'Servo ON';
    if (servoButton.textContent !== servoText) {
        servoButton.textContent = servoText;
        servoButton.className = servoIsOn ? 'isOn' : '';
    }
}

// 狀態列：連線、錯誤次數、逾時次數、通訊權、最後更新時間。每 250 毫秒更新一次。
function renderStatusStrip() {
    const connectionLabel = $('Connection_StatusLabel');
    let text;
    let className;
    if (!ui.connected) { text = t('Off Line'); className = 'stateOff'; }
    else if (bus.linkAlive) { text = t('On Line'); className = 'stateOn'; }
    else { text = t('Comm Lost（通訊中斷）'); className = 'stateLost'; }
    if (connectionLabel.textContent !== text) {
        connectionLabel.textContent = text;
        connectionLabel.className = className;
    }
    $('Error_StatusLabel').textContent = t('Error: {0}', bus.stats.errorCount);
    $('Timeout_StatusLabel').textContent = t('Timeout: {0}   Retry: {1}', bus.stats.timeoutCount, bus.stats.retryCount);
    let rightText;
    if (!ui.connected) { rightText = t('none'); }
    else if (status.ModbusCommunicationMode === MAGIC_COMM_RIGHT_ACQUIRE) { rightText = t('Acquired (55h)'); }
    else if (status.ModbusCommunicationMode === MAGIC_COMM_RIGHT_RELEASE) { rightText = t('Released (AAh)'); }
    else { rightText = toHex(status.ModbusCommunicationMode, 2) + 'h'; }
    $('CommRight_StatusLabel').textContent = t('Comm right: {0}', rightText);
    $('LastUpdate_StatusLabel').textContent = t('Last Updated: {0}',
        runtime.lastUpdate ? formatClock(runtime.lastUpdate) : t('none'));
}


/* ==========================================================================
   第五部分：畫面層（下）
   內容：控制項啟用狀態、連線與關閉、Block 參數頁、Block 規劃頁、試運轉與 JOG、
         通訊權保護、事件綁定（attachDomEvents）與初始化。

   舊版 A6.html 打不開連接埠的第一個原因，就是 attachDomEvents() 被呼叫卻從未定義，
   連線按鈕根本沒有綁定事件。這裡明確定義了 attachDomEvents()，並在初始化時用
   try catch 包住，任何錯誤都會顯示在畫面上，不會悄悄失敗。
   ========================================================================== */

// ==========================================================================
// 小工具
// ==========================================================================

function parseIntegerText(text) {
    const trimmed = String(text).trim();
    return /^[+-]?\d+$/.test(trimmed) ? Number(trimmed) : NaN;
}

function waitForCondition(predicate, timeoutMs) {
    return new Promise(function (resolve) {
        const startedAt = nowMs();
        const check = function () {
            if (predicate()) { resolve(true); }
            else if (nowMs() - startedAt > timeoutMs) { resolve(false); }
            else { setTimeout(check, 50); }
        };
        check();
    });
}

function withTimeout(promise, timeoutMs, label) {
    return new Promise(function (resolve, reject) {
        const timer = setTimeout(function () { reject(new LocalizedError(lx('{0} 逾時', label || lx('操作')))); }, timeoutMs);
        promise.then(function (value) { clearTimeout(timer); resolve(value); },
            function (error) { clearTimeout(timer); reject(error); });
    });
}

// 取得錯誤訊息的「目前語言字串」。需要保存起來、之後切換語言仍要重翻的地方，請改用 errorText(error)。
function errorMessageOf(error) {
    return resolveText(errorText(error));
}

// 使用者操作失敗時：寫入記錄並顯示對話框。連線已被關閉造成的中止不再重複提示。
// label 是延遲翻譯物件（LText），記錄與對話框都保存「未翻譯」的訊息，所以切換語言時會一起重翻。
async function reportError(label, error) {
    if (error && error.kind === 'closed') {
        appendLog('warn', lx('{0} 已中止：連線已關閉', label));
        return;
    }
    const message = errorText(error);
    appendLog('error', lx('{0} 失敗：{1}', label, message));
    await MessageBox.ok([lx('{0} 失敗', label), '', message], APP_TITLE, 'error');
}

// 一次只允許一個使用者操作（讀寫 Block、EEPROM 等），避免畫面狀態互相打架。
// label 為延遲翻譯物件（LText）。
async function runExclusive(label, work) {
    if (!brandGuard.verify()) { return false; }      // LOGO 被改動時，所有讀寫操作都不執行
    if (ui.busy) {
        appendLog('warn', lx('正在執行「{0}」，請稍候再執行「{1}」。', ui.busyLabel, label));
        return false;
    }
    ui.busy = true;
    ui.busyLabel = label;
    updateControlState();
    try {
        await work();
        return true;
    } catch (error) {
        await reportError(label, error);
        return false;
    } finally {
        ui.busy = false;
        ui.busyLabel = '';
        updateControlState();
    }
}

// ==========================================================================
// 控制項啟用狀態
// ==========================================================================

function setEnabled(id, enabled) {
    const element = $(id);
    if (element) { element.disabled = !enabled; }
}

function updateControlState() {
    const connected = ui.connected;
    const idle = connected && !ui.busy && jogController.state === 'idle';
    const trialOn = trial.enabled;
    const accepted = ui.accepted && !brandGuard.isLocked();     // LOGO 防護鎖定後，連線相關控制項一律停用

    // 連線列
    $('OpenPort_Button').textContent = connected ? t('Close Port') : t('Open Port');
    $('OpenPort_Button').className = connected ? 'danger' : 'primary';
    $('OpenPort_Button').disabled = !accepted || ui.opening || ui.closing || (connected && (ui.busy || jogController.state !== 'idle'));
    for (const id of ['ComPort_ComboBox', 'ComportUpdate_Button', 'BaudRate_ComboBox', 'DataBit_ComboBox',
        'Parity_ComboBox', 'StopBit_ComboBox', 'SlaveAddress_textBox']) {
        setEnabled(id, accepted && !connected && !ui.opening && !ui.closing);
    }

    // 一般讀寫操作
    for (const id of ['AbsoluteMultiturnDataClearFunction_button', 'TripResetFunction_button',
        'BlockParameterRead_button', 'BlockParameterEEP_button',
        'BLOCKMotionPlanningRead_button', 'BLOCKMotionPlanningWrite_button', 'BLOCKMotionPlanningEEP_button',
        'BLOCKMotionPlanningCheck_button', 'CommRight_checkBox', 'CommRightTimeout_textBox']) {
        setEnabled(id, idle);
    }
    // Block 參數必須先成功讀取過才能寫入（寫入時要保留驅動器上的 Pr60.48）
    setEnabled('BlockParameterWrite_button', idle && ui.blockParamsLoaded);

    // 試運轉
    setEnabled('TrialOperation_checkBox', idle);
    for (const id of ['TrialVelocity_textBox', 'TrialAcceleration_textBox', 'TrialDeceleration_textBox']) {
        setEnabled(id, connected && trialOn && jogController.state === 'idle');
    }
    setEnabled('ServoOn_Button', idle && trialOn);
    setEnabled('BlockRun_Button', idle && trialOn);
    setEnabled('BlockRunNumber_textBox', idle && trialOn);
    // JOG 按鈕：運轉中要保持可用，才收得到放開事件
    setEnabled('JogPositive_Button', connected && trialOn && !ui.busy);
    setEnabled('JogNegative_Button', connected && trialOn && !ui.busy);
    // 停止按鈕任何時候都可以按
    setEnabled('SStop_Button', connected);
    setEnabled('HStop_Button', connected);
}

// ==========================================================================
// 序列埠清單與連線
// Web Serial 無法列出所有 COM 埠，使用者必須按「Select Port」從瀏覽器對話框授權；
// 授權過的埠之後會自動出現在下拉清單中。
// ==========================================================================

// 回傳延遲翻譯物件（LText），下拉清單與記錄都能隨語言切換重翻。
function describePort(port, index) {
    let info = {};
    try { info = port.getInfo() || {}; } catch (ignore) { /* 忽略 */ }
    let usb = '';
    if (info.usbVendorId !== undefined) {
        usb = '  USB ' + toHex(info.usbVendorId, 4) + ':' + toHex(info.usbProductId || 0, 4);
    }
    return lx('Serial port {0}{1}', index + 1, usb);
}

async function refreshPortList(preferredPort) {
    const combo = $('ComPort_ComboBox');
    const previous = ui.ports[combo.selectedIndex];
    ui.ports = await navigator.serial.getPorts();
    rebuildPortOptions(preferredPort, previous);
}

// 依 ui.ports 重建下拉清單。切換語言時不帶參數呼叫，會保留目前選取的序列埠並重翻文字。
function rebuildPortOptions(preferredPort, previousPort) {
    const combo = $('ComPort_ComboBox');
    const previous = (previousPort !== undefined) ? previousPort : ui.ports[combo.selectedIndex];
    while (combo.firstChild) { combo.removeChild(combo.firstChild); }
    if (ui.ports.length === 0) {
        combo.appendChild(el('option', { text: t('(尚未授權序列埠，請按 Select Port)'), value: '' }));
        return;
    }
    ui.ports.forEach(function (port, index) {
        combo.appendChild(el('option', { text: resolveText(describePort(port, index)), value: String(index) }));
    });
    let selected = ui.ports.indexOf(preferredPort);
    if (selected < 0) { selected = ui.ports.indexOf(previous); }
    combo.selectedIndex = selected >= 0 ? selected : 0;
}

async function onSelectPortClick() {
    try {
        const port = await navigator.serial.requestPort();
        await refreshPortList(port);
        appendLog('info', lx('已授權序列埠：{0}', describePort(port, ui.ports.indexOf(port))));
    } catch (error) {
        if (error && error.name === 'NotFoundError') {
            appendLog('info', lx('未選擇序列埠。'));
        } else {
            appendLog('error', lx('選擇序列埠失敗：{0}', errorText(error)));
        }
    }
}

function describeOpenError(error) {
    const name = error && error.name ? error.name : '';
    // 回傳 LText 陣列（以換行串接），對話框保存未翻譯的內容
    const message = [lx('無法開啟序列埠。'), '', errorText(error), ''];
    if (name === 'InvalidStateError') {
        message.push(lx('這個序列埠已經是開啟狀態，可能被本頁面的另一個分頁使用。'));
    } else {
        message.push(lx('最常見的原因是這個 COM 埠正被其他程式占用，例如 C# 版程式、PANATERM、序列埠終端機，或另一個瀏覽器分頁。請先關閉它們再重試。也請確認 USB 轉 RS485 或 RS232 轉接器已插好。'));
    }
    return message;
}

function resetStatusModel() {
    const fresh = createA6Status();
    for (const key of Object.keys(fresh)) { status[key] = fresh[key]; }
    runtime.lastUpdate = null;
    runtime.statusDirty = true;
    runtime.commRightEnabled = false;
}

async function openPort() {
    if (ui.connected || ui.opening || ui.closing) { return; }
    if (!brandGuard.verify()) { return; }           // LOGO 被改動時不允許開啟序列埠
    const index = $('ComPort_ComboBox').selectedIndex;
    const port = ui.ports[index];
    if (!port) {
        await MessageBox.ok(lx('請先按「Select Port」，在瀏覽器對話框中選擇要使用的序列埠。'), lx('Open Port'), 'warning');
        return;
    }
    const slave = parseIntegerText($('SlaveAddress_textBox').value);
    if (!(slave >= 1 && slave <= 127)) {
        await MessageBox.ok(lx('站號必須是 1 到 127 的整數（對應驅動器 Pr5.31）。'), lx('Open Port'), 'warning');
        return;
    }
    const options = {
        baudRate: Number($('BaudRate_ComboBox').value),
        dataBits: Number($('DataBit_ComboBox').value),
        stopBits: Number($('StopBit_ComboBox').value),
        parity: $('Parity_ComboBox').value
    };
    ui.opening = true;
    updateControlState();
    const link = new SerialLink(bus.buffer, { onReadError: handleReadError, onFatalError: handleFatalLinkError });
    try {
        await link.open(port, options);
    } catch (error) {
        ui.opening = false;
        updateControlState();
        appendLog('error', lx('開啟序列埠失敗：{0}', errorText(error)));
        await MessageBox.ok(describeOpenError(error), lx('Open Port'), 'error');
        return;
    }
    ui.link = link;
    ui.currentPort = port;
    resetStatusModel();
    for (const key of Object.keys(renderCache)) { delete renderCache[key]; }
    blockParamSupport.unitRegisters = null;      // 換了驅動器就要重新探測韌體功能
    bus.slaveAddress = slave;
    bus.logPolling = $('ShowPolling_checkBox').checked;
    bus.handlers = {
        onLog: appendLog,
        onLinkState: handleLinkState,
        onPollResult: handlePollResult,
        onPollError: handlePollError,
        onFatalError: handleFatalLinkError
    };
    bus.start(link, options.baudRate, new PollScheduler(POLL_GROUPS, POLL_TIER_INTERVALS_MS));
    ui.connected = true;
    ui.opening = false;
    ui.autoRead = { params: false, plan: false };
    ui.fatalHandled = false;
    appendLog('info', lx('序列埠已開啟：{0} bps，資料位元 {1}，同位檢查 {2}，停止位元 {3}，站號 {4}',
        options.baudRate, options.dataBits, options.parity, options.stopBits, slave));
    updateControlState();
    identifyDrive();      // 在記錄中顯示驅動器型號與軟體版本
    // 目前停在 Block 頁籤的話，立刻自動讀取一次
    selectTab(currentTabId());
}

// 關閉連線。forced 為 true 代表序列埠已經失效，略過還原試運轉等需要通訊的步驟。
async function closePort(forced) {
    if (!ui.connected || ui.closing) { return; }
    ui.connected = false;     // 先標記，避免重複進入
    ui.closing = true;        // 關閉期間（最久可能數秒）不允許重新開啟，也不允許其他操作
    updateControlState();
    try {
        await closePortSteps(forced);
    } finally {
        ui.closing = false;
        updateControlState();
    }
}

// 關閉連線的實際步驟，由 closePort 包住，確保 closing 旗標一定會被清除。
async function closePortSteps(forced) {
    if (!forced) {
        // 1. 停止 JOG
        jogController.release(lx('關閉連線'));
        await waitForCondition(function () { return jogController.state === 'idle'; }, 8000);
        // 2. 還原試運轉改寫的資料
        if (trial.enabled) {
            try { await withTimeout(disableTrialOperation(), 4000, lx('還原試運轉資料')); appendLog('info', lx('已還原試運轉改寫的資料。')); }
            catch (error) { appendLog('error', lx('關閉連線前還原試運轉資料失敗：{0}，請重新讀取 Block 資料確認。', errorText(error))); }
        }
        // 3. 釋放通訊權
        if (runtime.commRightEnabled) {
            try { await withTimeout(releaseCommRight(), 2000, lx('釋放通訊權')); appendLog('info', lx('已釋放通訊權。')); }
            catch (error) { appendLog('warn', lx('釋放通訊權失敗：{0}', errorText(error))); }
        }
    }
    trial.enabled = false;
    trial.backup = null;
    trial.lastJogParams = null;
    runtime.commRightEnabled = false;
    await bus.stop();
    if (ui.link) { await ui.link.close(); }
    ui.link = null;
    ui.currentPort = null;
    ui.blockParamsLoaded = false;
    $('TrialOperation_checkBox').checked = false;
    $('CommRight_checkBox').checked = false;
    runtime.statusDirty = true;
    appendLog('info', lx('序列埠已關閉。'));
    updateControlState();
}

function handleReadError(error) {
    // 同位檢查或框架錯誤通常代表傳輸格式設定與驅動器不一致，節流後提示
    const now = nowMs();
    if (!ui.lastReadErrorAt || now - ui.lastReadErrorAt > 2000) {
        ui.lastReadErrorAt = now;
        appendLog('warn', lx('序列埠接收錯誤（{0}）：請確認同位檢查、停止位元與傳輸速率和驅動器設定一致（Pr5.29、Pr5.30、Pr5.38）。', error && error.name ? error.name : ''));
    }
}

// 序列埠被拔除或寫入失敗：關閉連線並告知使用者。
async function handleFatalLinkError(error) {
    if (!ui.connected || ui.fatalHandled) { return; }
    ui.fatalHandled = true;
    appendLog('error', lx('序列埠已中斷：{0}', errorText(error)));
    const wasJogging = jogController.state !== 'idle';
    await closePort(true);
    const lines = [lx('序列埠已中斷（可能是轉接器被拔除）。連線已關閉。'), ''];
    if (wasJogging || trial.backup !== null) {
        lines.push(lx('注意：中斷當下馬達可能仍在運轉，請立即使用外部緊急停止確認！'));
    }
    lines.push(lx('若驅動器的 Pr5.40 逾時保護與通訊權已啟用，驅動器會自行發生 Err80.0 並停止。'));
    await MessageBox.ok(lines, APP_TITLE, 'error');
}

function handleLinkState(isAlive) {
    runtime.statusDirty = true;
    if (isAlive) { appendLog('info', lx('通訊已恢復。')); }
    else { appendLog('error', lx('通訊中斷：連續 {0} 次交易失敗。請檢查接線、站號與驅動器通訊參數。', LINK_LOST_FAILURES)); }
}

// ==========================================================================
// 分頁
// ==========================================================================

function currentTabId() {
    const selected = document.querySelector('#A6_tabControl [role="tab"][aria-selected="true"]');
    return selected ? selected.id : 'StatusPage_tab';
}

function selectTab(tabId) {
    const tabs = document.querySelectorAll('#A6_tabControl [role="tab"]');
    for (const tab of tabs) {
        const isSelected = (tab.id === tabId);
        tab.setAttribute('aria-selected', isSelected ? 'true' : 'false');
        tab.tabIndex = isSelected ? 0 : -1;
        $(tab.getAttribute('aria-controls')).hidden = !isSelected;
    }
    // 第一次切到 Block 頁籤時自動讀取一次（與 C# 版切換分頁時讀取的行為一致）。
    // 自動讀取失敗只寫入記錄，不跳對話框。
    if (ui.connected && !ui.busy && ui.autoRead) {
        if (tabId === 'BLOCKMotionParameters_tab' && !ui.autoRead.params) {
            ui.autoRead.params = true;
            onBlockParameterRead(true);
        } else if (tabId === 'BLOCKMotionPlanning_tab' && !ui.autoRead.plan) {
            ui.autoRead.plan = true;
            onBlockPlanningRead(true);
        }
    }
}

// ==========================================================================
// 狀態頁面上的動作：清除多圈資料、清除警報
// ==========================================================================

function parseMagicValue(inputId, expected) {
    const text = $(inputId).value.trim();
    if (!/^[0-9a-fA-F]{1,4}$/.test(text)) { return NaN; }
    const value = parseInt(text, 16);
    return (value === expected) ? value : NaN;
}

async function onStatusAction(prop) {
    if (prop === 'AbsoluteMultiturnDataClearFunction') {
        await runExclusive(lx('清除多圈資料'), async function () {
            const value = parseMagicValue('AbsoluteMultiturnDataClearFunction_textBox', MAGIC_ABSOLUTE_CLEAR);
            if (Number.isNaN(value)) {
                await MessageBox.ok(lx('寫入值必須是 6165（十六進位）才會執行清除多圈資料。'), APP_TITLE, 'warning');
                return;
            }
            // 文件 2-7-2：清除前必須先關閉 Servo。
            if ((status.LogicalInput & 0x01) !== 0) {
                await MessageBox.ok(lx('目前 Servo 為 ON。清除多圈資料前必須先關閉 Servo（文件 2-7-2）。'), APP_TITLE, 'warning');
                return;
            }
            const answer = await MessageBox.yesNo([
                lx('即將清除絕對式編碼器的多圈資料。'), '',
                lx('請確認：'),
                lx('1. Servo 已關閉，並已用煞車或其他方式固定機構'),
                lx('2. 清除後必須關閉控制電源再重新送電，位置座標才會重新建立'),
                lx('3. 透過 Modbus 清除時不會發生 Err27.1，但仍然要重新送電'), '',
                lx('是否繼續？')], APP_TITLE, 'warning');
            if (answer !== 'Yes') { return; }
            await clearMultiTurnData(value);
            appendLog('info', lx('已送出清除多圈資料（4100h = 6165h），請關閉控制電源後重新送電。'));
            await MessageBox.ok([lx('已送出清除多圈資料。'), lx('請關閉控制電源，再重新送電。')], APP_TITLE, 'info');
        });
    } else if (prop === 'TripResetFunction') {
        await runExclusive(lx('清除警報'), async function () {
            const value = parseMagicValue('TripResetFunction_textBox', MAGIC_TRIP_RESET);
            if (Number.isNaN(value)) {
                await MessageBox.ok(lx('寫入值必須是 7274（十六進位）才會執行清除警報。'), APP_TITLE, 'warning');
                return;
            }
            await clearAlarm(value);
            appendLog('info', lx('已送出清除警報與警告（4102h = 7274h）。部分警報屬於不可清除類型，需重新送電。'));
        });
    }
}

const BLOCK_PARAM_FIELD_IDS = {
    velocity: function (i) { return 'BlockVelocity' + i + '_textBox'; },
    acceleration: function (i) { return 'BlockAcceleration' + i + '_textBox'; },
    deceleration: function (i) { return 'BlockDeceleration' + i + '_textBox'; }
};

function setSelectValue(select, value) {
    const text = String(value);
    let found = false;
    for (const option of select.options) {
        if (option.value === text) { found = true; }
    }
    if (!found) {
        select.appendChild(bindText(el('option', { value: text }), 'text', '{0} : 未定義值', text));
    }
    select.value = text;
}

function fillBlockParametersToUi(model) {
    for (let i = 0; i < 16; i++) {
        $(BLOCK_PARAM_FIELD_IDS.velocity(i)).value = String(model.velocities[i]);
        $(BLOCK_PARAM_FIELD_IDS.acceleration(i)).value = String(model.accelerations[i]);
        $(BLOCK_PARAM_FIELD_IDS.deceleration(i)).value = String(model.decelerations[i]);
    }
    $('BlockHomeOffset_textBox').value = String(model.homeOffset);
    $('BlockMaxPositionLimit_textBox').value = String(model.maxLimit);
    $('BlockMinPositionLimit_textBox').value = String(model.minLimit);
    $('BlockHomingSpeedHigh_textBox').value = String(model.homingHigh);
    $('BlockHomingSpeedLow_textBox').value = String(model.homingLow);
    $('BlockHomingAcceleration_textBox').value = String(model.homingAccel);
    setSelectValue($('BlockHomingless_ComboBox'), model.homingless);
    setSelectValue($('BlockAccelerationUnit_ComboBox'), model.accUnit);
    setSelectValue($('BlockDecelerationUnit_ComboBox'), model.decUnit);
    // 韌體不支援 Pr60.56 與 Pr60.57 時，單位選單停用並說明
    for (const id of ['BlockAccelerationUnit_ComboBox', 'BlockDecelerationUnit_ComboBox']) {
        $(id).disabled = !model.unitSupported;
    }
    ui.unitNoteVisible = !model.unitSupported;
    refreshBlockUnitNote();
    $('BlockOperationMethod_textBox').value = toHex(model.method & 0xFFFF, 4) + 'h';
    for (const input of $('BLOCKMotionParameters_tabPage').querySelectorAll('input')) { input.classList.remove('invalid'); }
}

// 顯示或清除「韌體不支援加減速時間單位」的提示。切換語言時也會呼叫它重翻文字。
function refreshBlockUnitNote() {
    const unitNote = $('BlockUnitNote_label');
    if (!unitNote) { return; }
    unitNote.textContent = ui.unitNoteVisible ?
        t('此驅動器韌體不支援加減速時間單位（Pr60.56、Pr60.57 需功能增強版 8 以上），時間單位固定為 ms。') : '';
}

// 從畫面收集 Block 參數。無法解析的欄位會標示紅框並記錄在 invalid 清單。
function collectBlockParametersFromUi() {
    const model = createBlockParameters();
    const invalid = [];
    const read = function (id) {
        const input = $(id);
        const value = parseIntegerText(input.value);
        if (Number.isNaN(value)) { input.classList.add('invalid'); invalid.push(id); return NaN; }
        input.classList.remove('invalid');
        return value;
    };
    for (let i = 0; i < 16; i++) {
        model.velocities[i] = read(BLOCK_PARAM_FIELD_IDS.velocity(i));
        model.accelerations[i] = read(BLOCK_PARAM_FIELD_IDS.acceleration(i));
        model.decelerations[i] = read(BLOCK_PARAM_FIELD_IDS.deceleration(i));
    }
    model.homeOffset = read('BlockHomeOffset_textBox');
    model.maxLimit = read('BlockMaxPositionLimit_textBox');
    model.minLimit = read('BlockMinPositionLimit_textBox');
    model.homingHigh = read('BlockHomingSpeedHigh_textBox');
    model.homingLow = read('BlockHomingSpeedLow_textBox');
    model.homingAccel = read('BlockHomingAcceleration_textBox');
    model.homingless = Number($('BlockHomingless_ComboBox').value);
    model.unitSupported = (blockParamSupport.unitRegisters !== false);
    model.accUnit = Number($('BlockAccelerationUnit_ComboBox').value);
    model.decUnit = Number($('BlockDecelerationUnit_ComboBox').value);
    return { model: model, invalid: invalid };
}

async function onBlockParameterRead(quiet) {
    const label = lx('Block 參數讀取');
    if (quiet) {
        // 自動讀取：失敗只記錄，不跳對話框
        if (ui.busy) { return; }
        ui.busy = true; ui.busyLabel = label; updateControlState();
        try {
            const model = await readBlockParameters();
            fillBlockParametersToUi(model);
            ui.blockParamsLoaded = true;
            appendLog('info', lx('Block 參數讀取完成。'));
        } catch (error) {
            ui.autoRead.params = false;
            appendLog('warn', lx('Block 參數自動讀取失敗：{0}', errorText(error)));
        } finally {
            ui.busy = false; ui.busyLabel = ''; updateControlState();
        }
        return;
    }
    await runExclusive(label, async function () {
        const model = await readBlockParameters();
        fillBlockParametersToUi(model);
        ui.blockParamsLoaded = true;
        appendLog('info', lx('Block 參數讀取完成。'));
    });
}

async function onBlockParameterWrite() {
    await runExclusive(lx('Block 參數寫入'), async function () {
        const collected = collectBlockParametersFromUi();
        if (collected.invalid.length > 0) {
            await MessageBox.ok(lx('有 {0} 個欄位不是有效的整數（已標示紅框），請修正後再寫入。', collected.invalid.length), APP_TITLE, 'warning');
            return;
        }
        const check = validateBlockParameters(collected.model);
        if (check.errors.length > 0) {
            const lines = [lx('輸入資料有錯誤，未寫入：'), ''].concat(check.errors.slice(0, 12));
            if (check.errors.length > 12) { lines.push(lx('... 另有 {0} 項', check.errors.length - 12)); }
            await MessageBox.ok(lines, APP_TITLE, 'warning');
            return;
        }
        if (check.warnings.length > 0) {
            const answer = await MessageBox.yesNo(check.warnings.concat(['', lx('仍要寫入嗎？')]), APP_TITLE, 'warning');
            if (answer !== 'Yes') { return; }
        }
        const result = await writeBlockParameters(collected.model);
        if (result.verified) {
            appendLog('info', lx('Block 參數寫入完成，讀回驗證一致。尚未寫入 EEPROM，斷電後會遺失。'));
            await MessageBox.ok([lx('Block 參數已寫入並讀回驗證一致。'), '', lx('尚未寫入 EEPROM，斷電後會遺失；要永久保存請按 EEP。')], APP_TITLE, 'info');
        } else {
            appendLog('warn', lx('Block 參數讀回不一致：{0}', result.mismatches.join(', ')));
            await MessageBox.ok([lx('寫入後讀回有 {0} 個暫存器與寫入值不同：', result.mismatches.length),
                result.mismatches.slice(0, 10).join(', '), '',
                lx('Pr60.48 到 Pr60.55 屬於重新上電後生效的參數，讀回值可能維持舊值；其餘位址不一致請重新讀取確認。')], APP_TITLE, 'warning');
        }
    });
}

function buildBlockPlanningPage() {
    const page = $('BLOCKMotionPlanning_tabPage');
    const toolbar = el('div', { className: 'planToolbar' }, [
        textButton('BLOCKMotionPlanningRead_button', 'Read'),
        textButton('BLOCKMotionPlanningWrite_button', 'Write', 'primary'),

        el('span', { id: 'BlockPlanProgress_label', className: 'noteText planInfo' })
    ]);
    const table = el('table', { className: 'planTable' });
    const head = el('thead');
    const headRow = el('tr');
    for (const name of ['Block', 'Command (dec)', 'Command (hex)', 'Data (dec)', 'Data (hex)', '說明（解碼僅供參考）']) {

    table.appendChild(head);

function refreshPlanRow(index) {
    const command = ui.plan.commands[index];
    const data = ui.plan.data[index];
    $('BlockCommand' + index + '_TextBox').value = String(command);
    $('BlockCommandHex' + index + '_TextBox').value = toHex(command, 8);
    $('BlockData' + index + '_TextBox').value = String(data);
    $('BlockDataHex' + index + '_TextBox').value = toHex(data, 8);
    const description = describeBlock(command, data);
    $('BlockDesc' + index + '_label').textContent = description;
    const row = $('BlockRow' + index + '_row');
    const baseline = ui.planBaseline;
    const isDirty = baseline !== null && (baseline.commands[index] !== command || baseline.data[index] !== data);
    const isEmpty = (command === 0 && data === 0);
    row.className = (isDirty ? 'rowDirty' : '') + (isEmpty ? ' rowEmpty' : '');
    for (const id of ['BlockCommand' + index + '_TextBox', 'BlockCommandHex' + index + '_TextBox',
        'BlockData' + index + '_TextBox', 'BlockDataHex' + index + '_TextBox']) {
        $(id).classList.remove('invalid');
    }
}

function refreshAllPlanRows() {
    for (let i = 0; i < BLOCK_COUNT; i++) { refreshPlanRow(i); }
}

// 只重新產生「說明」欄的文字（切換語言時使用）。不動輸入框，才不會清掉使用者標示的紅框。
function refreshAllPlanDescriptions() {
    for (let i = 0; i < BLOCK_COUNT; i++) {
        const cell = $('BlockDesc' + i + '_label');
        if (cell) { cell.textContent = describeBlock(ui.plan.commands[i], ui.plan.data[i]); }
    }
}

function parsePlanValue(text, isHex) {
    const trimmed = text.trim();
    if (isHex) {
        if (!/^(0x)?[0-9a-fA-F]{1,8}$/.test(trimmed)) { return NaN; }
        return parseInt(trimmed.replace(/^0x/, ''), 16) | 0;
    }
    const value = parseIntegerText(trimmed);
    if (Number.isNaN(value) || value < -2147483648 || value > 2147483647) { return NaN; }
    return value;
}

function onPlanFieldChanged(event) {
    const input = event.target;
    if (input.blockIndex === undefined) { return; }
    const index = input.blockIndex;
    const kind = input.fieldKind;
    const isHex = (kind === 'cmdHex' || kind === 'dataHex');
    const value = parsePlanValue(input.value, isHex);
    if (Number.isNaN(value)) {
        input.classList.add('invalid');
        appendLog('warn', lx('Block {0} 的輸入值無效：{1}（十進位須為 32 位元整數，十六進位須為 1 到 8 位）', index, input.value));
        return;
    }
    if (kind === 'cmdDec' || kind === 'cmdHex') { ui.plan.commands[index] = value; }
    else { ui.plan.data[index] = value; }
    refreshPlanRow(index);
}

// 規劃頁的進度文字。text 可以是 LText，會保存在 ui.planProgress，切換語言時用同一個物件重新翻譯。
function setPlanProgress(text) {
    ui.planProgress = text;
    const label = $('BlockPlanProgress_label');
    if (label) { label.textContent = resolveText(text); }
}

async function onBlockPlanningRead(quiet) {
    const label = lx('Block 規劃讀取');
    const work = async function () {
        const plan = await readBlockPlan(function (done, total) {
            setPlanProgress(lx('讀取中 {0} / {1}', done, total));
        });
        ui.plan = plan;
        ui.planBaseline = { commands: plan.commands.slice(), data: plan.data.slice() };
        ui.planLoaded = true;
        refreshAllPlanRows();
        setPlanProgress(lx('讀取完成。修改的列會以綠底標示。'));
        appendLog('info', lx('Block 規劃讀取完成（256 個 Block）。'));
    };
    if (quiet) {
        if (ui.busy) { return; }
        ui.busy = true; ui.busyLabel = label; updateControlState();
        try { await work(); }
        catch (error) {
            ui.autoRead.plan = false;
            setPlanProgress(lx('讀取失敗，畫面資料維持不變。'));
            appendLog('warn', lx('Block 規劃自動讀取失敗：{0}', errorText(error)));
        } finally { ui.busy = false; ui.busyLabel = ''; updateControlState(); }
        return;
    }
    await runExclusive(label, async function () {
        try { await work(); }
        catch (error) { setPlanProgress(lx('讀取失敗，畫面資料維持不變。')); throw error; }
    });
}

// 檢查 Block 規劃會不會引用到數值為 0 的速度或加減速（文件 3-1 註解 *3，會發生 Err93.1）。
function checkPlanAgainstParameters() {
    const collected = collectBlockParametersFromUi();
    if (collected.invalid.length > 0) { return null; }
    return findZeroParameterReferences(ui.plan.commands, collected.model);
}

async function onBlockPlanningCheck() {
    const problems = checkPlanAgainstParameters();
    if (problems === null) {
        await MessageBox.ok(lx('Block 參數頁有無效的欄位，無法檢查。請先修正。'), APP_TITLE, 'warning');
        return;
    }
    if (problems.length === 0) {
        appendLog('info', lx('Block 規劃檢查：沒有發現引用到 0 的速度或加減速時間。'));
        await MessageBox.ok(lx('沒有發現引用到數值為 0 的速度、加速時間或減速時間。'), APP_TITLE, 'info');
    } else {
        appendLog('warn', lx('Block 規劃檢查發現 {0} 個問題。', problems.length));
        const lines = [lx('發現 {0} 個問題（啟動時會發生 Err93.1）：', problems.length), ''].concat(problems.slice(0, 15));
        if (problems.length > 15) { lines.push(lx('... 另有 {0} 項', problems.length - 15)); }
        await MessageBox.ok(lines, APP_TITLE, 'warning');
    }
}

async function onBlockPlanningWrite() {
    await runExclusive(lx('Block 規劃寫入'), async function () {
        if (!ui.planLoaded) {
            const answer = await MessageBox.yesNo([
                lx('尚未成功讀取過 Block 規劃。'),
                lx('寫入會以畫面上的 256 個 Block 覆蓋驅動器內容，沒有填寫的列會變成 0。'), '',
                lx('是否繼續？')], APP_TITLE, 'warning');
            if (answer !== 'Yes') { return; }
        }
        const problems = checkPlanAgainstParameters();
        if (problems !== null && problems.length > 0) {
            const lines = [lx('發現 {0} 個引用到數值為 0 的速度或加減速時間（啟動時會發生 Err93.1）：', problems.length), ''].concat(problems.slice(0, 8));
            if (problems.length > 8) { lines.push(lx('... 另有 {0} 項', problems.length - 8)); }
            lines.push('', lx('仍要寫入嗎？'));
            const answer = await MessageBox.yesNo(lines, APP_TITLE, 'warning');
            if (answer !== 'Yes') { return; }
        }
        const result = await writeBlockPlan(ui.plan, function (done, total) {
            setPlanProgress(lx('寫入與驗證中 {0} / {1}', done, total));
        });
        if (result.verified) {
            ui.planBaseline = { commands: ui.plan.commands.slice(), data: ui.plan.data.slice() };
            ui.planLoaded = true;
            refreshAllPlanRows();
            setPlanProgress(lx('寫入完成，讀回驗證一致。'));
            appendLog('info', lx('Block 規劃寫入完成，讀回驗證一致。尚未寫入 EEPROM。'));
            await MessageBox.ok([lx('Block 規劃已寫入並讀回驗證一致。'), '', lx('尚未寫入 EEPROM，斷電後會遺失；要永久保存請按 EEP。')], APP_TITLE, 'info');
        } else {
            setPlanProgress(lx('讀回驗證失敗，共 {0} 個 Block 不一致。', result.mismatchBlocks.length));
            appendLog('warn', lx('Block 規劃讀回不一致：{0}', result.mismatchBlocks.slice(0, 20).join(', ')));
            await MessageBox.ok([lx('寫入後讀回有 {0} 個 Block 與畫面不同：', result.mismatchBlocks.length),
                result.mismatchBlocks.slice(0, 20).join(', '), '', lx('請重新讀取確認。')], APP_TITLE, 'warning');
        }
    });
}

// 兩段警告都是 LText 陣列（每個元素一行，空字串代表空行），對話框顯示時才依當下語言翻譯。
const TRIAL_WARNING_1 = [

    lx('• Block 254 與 Block 255（測試用的正向與負向 JOG）'),
    lx('• Velocity 15、Acceleration 15、Deceleration 15'), '',

    lx('是否繼續？')
];

const TRIAL_WARNING_2 = [
    lx('警告：JOG 會讓馬達實際轉動。'), '',
    lx('請確認：'),
    lx('1. 馬達與機構周圍沒有人員與障礙物'),
    lx('2. 已備妥外部緊急停止'),
    lx('3. 驅動器已設定為 Modbus 啟動的 Block 運轉（Pr6.28 為 1，Pr5.37 為 1 或 2，並已重新上電）'), '',
    lx('只有按住 JOG 按鈕時馬達才會轉，放開、切換視窗或關閉分頁都會立刻減速停止。'), '',
    lx('是否繼續？')
];

function readTrialParameters() {
    const velocity = parseIntegerText($('TrialVelocity_textBox').value);
    const acceleration = parseIntegerText($('TrialAcceleration_textBox').value);
    const deceleration = parseIntegerText($('TrialDeceleration_textBox').value);
    const errors = [];
    // 速度與加減速時間為 0 會讓 Block 啟動時發生 Err93.1，所以最小值是 1
    if (!(velocity >= 1 && velocity <= 20000)) { errors.push(lx('Velocity 必須是 1 到 20000 的整數（r/min）')); }
    if (!(acceleration >= 1 && acceleration <= 10000)) { errors.push(lx('Acceleration 必須是 1 到 10000 的整數')); }
    if (!(deceleration >= 1 && deceleration <= 10000)) { errors.push(lx('Deceleration 必須是 1 到 10000 的整數')); }
    return { ok: errors.length === 0, errors: errors, velocity: velocity, acceleration: acceleration, deceleration: deceleration };
}

async function refreshBlockParametersQuietly() {
    try {
        const model = await readBlockParameters();
        fillBlockParametersToUi(model);
        ui.blockParamsLoaded = true;
    } catch (error) {
        appendLog('warn', lx('重新讀取 Block 參數失敗：{0}', errorText(error)));
    }
}

async function onTrialCheckChanged() {
    const box = $('TrialOperation_checkBox');
    if (box.checked) {
        box.checked = false;      // 成功之後才真正勾選，失敗或取消時畫面不會停在錯誤狀態
        await runExclusive(lx('啟用試運轉'), async function () {
            const params = readTrialParameters();
            if (!params.ok) {
                await MessageBox.ok([lx('試運轉參數有錯誤：'), ''].concat(params.errors), APP_TITLE, 'warning');
                return;
            }
            if ((await MessageBox.yesNo(TRIAL_WARNING_1, APP_TITLE, 'warning')) !== 'Yes') { return; }
            if ((await MessageBox.yesNo(TRIAL_WARNING_2, APP_TITLE, 'warning')) !== 'Yes') { return; }
            await enableTrialOperation(params.velocity, params.acceleration, params.deceleration);
            box.checked = true;
            appendLog('info', lx('試運轉已啟用：Block 254 為正向 JOG、Block 255 為負向 JOG，使用第 15 組速度與加減速。'));
            await refreshBlockParametersQuietly();
        });
    } else {
        await runExclusive(lx('結束試運轉'), async function () {
            jogController.release(lx('結束試運轉'));
            await disableTrialOperation();
            appendLog('info', lx('試運轉已結束，Block 254、255 與第 15 組參數已還原。'));
            await refreshBlockParametersQuietly();
        });
    }
}

async function onServoOnClick() {
    await runExclusive(lx('Servo ON OFF'), async function () {
        const isOn = (status.LogicalInput & 0x01) !== 0;
        await setServoOn(!isOn);
        appendLog('info', lx('Servo 已切換為 {0}（若 SRV-ON 也指定給 I/F 連接器輸入，兩者為 AND 關係）。', isOn ? 'OFF' : 'ON'));
    });
}

async function onBlockRunClick() {
    await runExclusive(lx('Block RUN'), async function () {
        const number = parseIntegerText($('BlockRunNumber_textBox').value);
        if (!(number >= 0 && number <= 255)) {
            await MessageBox.ok(lx('Block 編號必須是 0 到 255 的整數。'), APP_TITLE, 'warning');
            return;
        }
        if ((status.LogicalInput & 0x01) === 0) {
            await MessageBox.ok(lx('Servo 尚未 ON，請先按 Servo ON。'), APP_TITLE, 'warning');
            return;
        }
        if (status.ErrorCode !== 0) {
            await MessageBox.ok(lx('驅動器目前有警報，請先排除並清除。'), APP_TITLE, 'warning');
            return;
        }
        await startBlock(number);

// 停止按鈕。S-STOP 為減速停止，H-STOP 為立即停止。任何時候都能按，不受忙碌狀態限制。
async function onStopClick(kind) {
    jogController.pressed = false;        // 讓 JOG 的安全檢查接手時也不會再啟動
    try {
        const result = await stopMotion(kind);
        if (result.stopped) {
            appendLog('info', lx('{0}完成，馬達已低於 30 r/min。', kind === 'H' ? lx('立即停止') : lx('減速停止')));
        } else {
            appendLog('error', lx('停止後馬達仍未低於 30 r/min。'));
            await MessageBox.ok([lx('停止命令已送出，但馬達在時限內仍未停止。'), lx('請立刻使用外部緊急停止！')], APP_TITLE, 'error');
        }
    } catch (error) {
        await reportError(lx('停止命令'), error);
    }
}

// JOG 按鈕：按下才運轉、放開就停。使用 Pointer Events，滑鼠、觸控與手寫筆都適用，
// 並用 setPointerCapture 確保游標移出按鈕後仍收得到放開事件。
function attachJogButton(button, direction) {
    const start = async function () {
        if (!brandGuard.verify()) { return; }       // LOGO 被改動時不允許啟動 JOG
        const params = readTrialParameters();
        if (!params.ok) {
            await MessageBox.ok([lx('JOG 參數有錯誤：'), ''].concat(params.errors), APP_TITLE, 'warning');
            return;
        }
        button.classList.add('isHolding');
        await jogController.press(direction, params);
        if (jogController.state === 'idle') { button.classList.remove('isHolding'); }
    };
    const stop = function (reason) {
        button.classList.remove('isHolding');
        jogController.release(reason);
    };
    button.addEventListener('pointerdown', function (event) {
        if (event.pointerType === 'mouse' && event.button !== 0) { return; }
        event.preventDefault();
        try { button.setPointerCapture(event.pointerId); } catch (ignore) { /* 不支援時忽略 */ }
        start();
    });
    for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        button.addEventListener(name, function () { stop(lx('JOG 按鈕放開')); });
    }
    button.addEventListener('contextmenu', function (event) { event.preventDefault(); });
    // 鍵盤操作：按住空白鍵或 Enter 等同按住按鈕
    button.addEventListener('keydown', function (event) {
        if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) { event.preventDefault(); start(); }
    });
    button.addEventListener('keyup', function (event) {
        if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); stop(lx('JOG 按鍵放開')); }
    });
    button.addEventListener('blur', function () { stop(lx('JOG 按鈕失去焦點')); });
}

function setupJogController() {
    // 分頁隱藏、視窗失去焦點或連線中斷時，一律視為不安全，必須停止。
    jogController.isSafeToContinue = function () {
        return document.visibilityState === 'visible' && document.hasFocus() && ui.connected && bus.running;
    };
    jogController.onState = function (state) {
        const line = $('TrialState_label');
        const texts = { idle: 'JOG 閒置', starting: 'JOG 啟動中...', running: 'JOG 運轉中，放開按鈕即停止', stopping: 'JOG 停止中...' };
        line.textContent = texts[state] ? t(texts[state]) : state;
        line.className = 'trialStateLine noteText' + (state === 'running' ? ' warn' : '');
        if (state === 'idle') {
            $('JogPositive_Button').classList.remove('isHolding');
            $('JogNegative_Button').classList.remove('isHolding');
        }
        updateControlState();
    };
    jogController.onMessage = function (level, text) {
        appendLog(level, text);
        if (level === 'error') { MessageBox.ok(text, APP_TITLE, 'error'); }
    };
    // 任何可能讓使用者看不到畫面的情況，都先停止 JOG
    window.addEventListener('blur', function () { jogController.release(lx('視窗失去焦點')); });
    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible') { jogController.release(lx('分頁被隱藏')); }
    });
    window.addEventListener('pagehide', function () { jogController.release(lx('頁面關閉')); });
}

// ==========================================================================
// 通訊權保護（選用）
// 勾選後：讀取 Pr5.40（通訊逾時時間），若為 0 則詢問是否寫入；再取得通訊權 4300h = 55h。
// 取得通訊權後，只要網頁停止通訊超過 Pr5.40，驅動器就會自行發生 Err80.0 並停止。
// 輪詢會持續送出請求，所以正常使用時不會誤觸發。
// 注意：取得通訊權後，驅動器前面板除監視模式外全部無法操作。
// ==========================================================================

async function onCommRightChanged() {
    const box = $('CommRight_checkBox');
    if (box.checked) {
        box.checked = false;
        await runExclusive(lx('啟用通訊權保護'), async function () {
            const timeoutMs = parseIntegerText($('CommRightTimeout_textBox').value);
            if (!(timeoutMs >= 100 && timeoutMs <= 10000)) {
                await MessageBox.ok(lx('逾時時間必須是 100 到 10000 毫秒（對應 Pr5.40，上限 10000）。'), APP_TITLE, 'warning');
                return;
            }
            const current = await readServoParameter(5, 40);
            if (current === 0) {
                const answer = await MessageBox.show([
                    lx('Pr5.40（通訊逾時時間）目前為 0，代表逾時保護不會生效。'), '',
                    lx('要把 Pr5.40 寫成 {0} 毫秒嗎？', timeoutMs),
                    lx('（寫入後只存在驅動器記憶體，要永久保存需按 EEP。）')],
                    APP_TITLE, [
                        { text: lx('寫入並啟用'), value: 'write', primary: true },
                        { text: lx('不寫入，只取得通訊權'), value: 'skip' },
                        { text: lx('取消'), value: 'cancel', cancel: true }
                    ], 'warning');
                if (answer === 'cancel') { return; }
                if (answer === 'write') {
                    await writeServoParameter(5, 40, timeoutMs);
                    appendLog('info', lx('Pr5.40 已寫入 {0} ms。', timeoutMs));
                }
            } else {
                appendLog('info', lx('Pr5.40 目前為 {0} ms，沿用此設定。', current));
            }
            await acquireCommRight();
            box.checked = true;
            appendLog('info', lx('已取得通訊權（4300h = 55h）。驅動器前面板除監視模式外已無法操作。'));
        });
    } else {
        await runExclusive(lx('釋放通訊權'), async function () {
            await releaseCommRight();
            appendLog('info', lx('已釋放通訊權（4300h = AAh）。'));
        });
    }
}

// ==========================================================================
// 事件綁定
// 舊版 A6.html 呼叫了 attachDomEvents() 卻沒有定義它，連線按鈕因此從未綁定事件。

function attachDomEvents() {
    $('ComportUpdate_Button').addEventListener('click', onSelectPortClick);
    $('OpenPort_Button').addEventListener('click', function () {
        if (ui.connected) { closePort(false); } else { openPort(); }
    });

    // 分頁：點擊與左右方向鍵切換
    const tabs = Array.prototype.slice.call(document.querySelectorAll('#A6_tabControl [role="tab"]'));
    tabs.forEach(function (tab, index) {
        tab.addEventListener('click', function () { selectTab(tab.id); });
        tab.addEventListener('keydown', function (event) {
            let next = -1;
            if (event.key === 'ArrowRight') { next = (index + 1) % tabs.length; }
            else if (event.key === 'ArrowLeft') { next = (index + tabs.length - 1) % tabs.length; }
            if (next >= 0) { event.preventDefault(); tabs[next].focus(); selectTab(tabs[next].id); }
        });
    });

    // Block 參數與規劃
    $('BlockParameterRead_button').addEventListener('click', function () { onBlockParameterRead(false); });
    $('BlockParameterWrite_button').addEventListener('click', onBlockParameterWrite);
    $('BlockParameterEEP_button').addEventListener('click', onEepClick);
    $('BLOCKMotionPlanningRead_button').addEventListener('click', function () { onBlockPlanningRead(false); });
    $('BLOCKMotionPlanningWrite_button').addEventListener('click', onBlockPlanningWrite);
    $('BLOCKMotionPlanningEEP_button').addEventListener('click', onEepClick);
    $('BLOCKMotionPlanningCheck_button').addEventListener('click', onBlockPlanningCheck);

    // 試運轉
    $('TrialOperation_checkBox').addEventListener('change', onTrialCheckChanged);
    $('ServoOn_Button').addEventListener('click', onServoOnClick);
    $('BlockRun_Button').addEventListener('click', onBlockRunClick);
    $('SStop_Button').addEventListener('click', function () { onStopClick('S'); });
    $('HStop_Button').addEventListener('click', function () { onStopClick('H'); });
    attachJogButton($('JogPositive_Button'), 0);
    attachJogButton($('JogNegative_Button'), 1);

    // 通訊權保護
    $('CommRight_checkBox').addEventListener('change', onCommRightChanged);

    // 語言選單：選了立刻切換整個畫面，並記住這次的選擇
    $('Language_ComboBox').addEventListener('change', function () { setLanguage(this.value, true); });

    // 通訊記錄
    $('ShowPolling_checkBox').addEventListener('change', function () { bus.logPolling = this.checked; });
    $('AutoScroll_checkBox').addEventListener('change', function () { logState.autoScroll = this.checked; });
    $('ClearLog_button').addEventListener('click', clearLog);
    $('CopyLog_button').addEventListener('click', async function () {
        try {
            await navigator.clipboard.writeText(getLogText());
            appendLog('info', lx('通訊記錄已複製到剪貼簿。'));
        } catch (error) {
            appendLog('warn', lx('複製失敗：{0}', errorText(error)));
        }
    });
}

// 填入下拉選單。item 可以用 text（固定文字）或 key（多語系 key，切換語言時會重新翻譯）。
function fillSelect(id, items, selectedValue) {
    const select = $(id);
    for (const item of items) {
        const option = el('option', { value: String(item.value) });
        if (item.key !== undefined) { bindText(option, 'text', item.key); }
        else { option.textContent = item.text; }
        select.appendChild(option);
    }
    select.value = String(selectedValue);
}

// ==========================================================================
// 多語系：語言選單與即時切換
// ==========================================================================

// 把語言選單填好並選到目前語言。每個語言選單都帶 languageSelect 樣式名稱，切換時一起同步。
function fillLanguageSelect(select) {
    select.classList.add('languageSelect');
    while (select.firstChild) { select.removeChild(select.firstChild); }
    for (const language of LANGUAGES) {
        select.appendChild(el('option', { value: language.code, text: language.name }));
    }
    select.value = i18nState.language;
    return select;
}

// 綁定 HTML 裡以 data-i18n、data-i18n-title、data-i18n-aria 標示的靜態文字。
function applyStaticBindings() {
    for (const element of document.querySelectorAll('[data-i18n]')) {
        bindText(element, 'text', element.getAttribute('data-i18n'));
    }
    for (const element of document.querySelectorAll('[data-i18n-title]')) {
        bindText(element, 'title', element.getAttribute('data-i18n-title'));
    }
    for (const element of document.querySelectorAll('[data-i18n-aria]')) {
        bindText(element, 'aria', element.getAttribute('data-i18n-aria'));
    }
}

// 切換語言後，把所有「不是用 bindText 綁定」的動態內容重新產生一遍。
function refreshLanguageDependentUi() {
    refreshBindings();                      // 標籤、按鈕、頁籤、欄位名稱等靜態文字
    rebuildPortOptions();                   // 序列埠下拉清單的文字
    for (const key of Object.keys(renderCache)) { delete renderCache[key]; }
    runtime.statusDirty = true;
    renderStatus();                         // 欄位數值、錯誤碼說明、Servo 按鈕
    renderStatusStrip();                    // 底部狀態列
    jogController.onState(jogController.state);   // JOG 狀態文字
    refreshAllPlanDescriptions();           // Block 規劃表的說明欄
    setPlanProgress(ui.planProgress);       // 規劃頁進度文字
    refreshBlockUnitNote();                 // 加減速時間單位提示
    rebuildLog();                           // 通訊記錄整份重翻
    MessageBox.refreshActive();             // 正在顯示的對話框
    updateControlState();                   // 連線按鈕文字等
}

// 切換語言。persist 為 true 時記住使用者的選擇（自動偵測的結果不記，這樣之後換系統語言還會跟著變）。
function setLanguage(code, persist) {
    if (!isSupportedLanguage(code)) { code = DEFAULT_LANGUAGE; }
    i18nState.language = code;
    if (persist) { saveLanguage(code); }
    document.documentElement.lang = code;
    for (const select of document.querySelectorAll('select.languageSelect')) { select.value = code; }
    refreshLanguageDependentUi();
}

function buildStaticLists() {
    fillSelect('BaudRate_ComboBox', BAUD_RATES.map(function (rate) { return { value: rate, text: String(rate) }; }), DEFAULT_BAUD_RATE);
    fillSelect('DataBit_ComboBox', [{ value: 8, text: '8' }, { value: 7, text: '7' }], 8);
    fillSelect('Parity_ComboBox', [{ value: 'none', key: 'None' }, { value: 'even', key: 'Even' }, { value: 'odd', key: 'Odd' }], 'none');
    fillSelect('StopBit_ComboBox', [{ value: 1, text: '1' }, { value: 2, text: '2' }], 1);
    $('SlaveAddress_textBox').value = String(DEFAULT_SLAVE_ADDRESS);
    fillLanguageSelect($('Language_ComboBox'));
}

function showFatalInitError(error) {
    const banner = bindText(el('div', { className: 'unsupportedBanner' }), 'text', '程式初始化失敗：{0}', errorMessageOf(error));

async function showStartupWarning() {
    // 開場警告裡附一個語言選單，讓使用者在同意之前就能先換成看得懂的語言
    const buildLanguagePicker = function () {
        const select = fillLanguageSelect(el('select', { id: 'Language_DialogComboBox' }));

        return el('div', { className: 'dialogLanguage' }, [label, select]);
    };
    const answer = await MessageBox.show([
        lx('本程式是測試用的範例工具，用來設定與操作松下 MINAS A6 伺服驅動器。'), '',
        lx('錯誤的操作可能造成機械損壞或人員受傷，尤其是試運轉與 JOG。'),
        lx('使用前請確認周圍安全並備妥外部緊急停止，使用風險由使用者自行承擔。'), '',
        lx('驅動器需先設定：Pr5.31 站號（不可為 0）、Pr5.37 為 1 或 2、Pr6.28 為 1（Block 運轉）。')],
        APP_TITLE + '  ' + APP_VERSION, [
            { text: lx('我了解，繼續'), value: 'accept', primary: true },
            { text: lx('離開'), value: 'decline', cancel: true }
        ], 'warning', buildLanguagePicker);
    return answer === 'accept';
}

async function initializeApplication() {
    // 語言：使用者上次的選擇優先，其次是系統語言，都不支援就用英文
    i18nState.language = chooseInitialLanguage();
    document.documentElement.lang = i18nState.language;
    document.title = APP_TITLE + '  ' + APP_VERSION;
    $('AppTitle_label').textContent = APP_TITLE + '  ' + APP_VERSION;
    applyStaticBindings();
    buildStaticLists();
    buildStatusPages(onStatusAction);
    buildIoPanel();
    buildBlockParametersPage();
    buildBlockPlanningPage();
    setupJogController();
    jogController.onState(jogController.state);     // 讓初始的 JOG 狀態文字也套用目前語言
    attachDomEvents();       // 一定要在所有控制項建立完成之後才綁定
    uiHooks.log = appendLog;
    selectTab('StatusPage_tab');
    updateControlState();

    // 畫面定時更新：記錄、狀態欄位、狀態列
    setInterval(flushLog, 100);
    setInterval(renderStatus, 100);
    setInterval(renderStatusStrip, 250);
    renderStatus();
    renderStatusStrip();

    // LOGO 完整性防護：先立即檢查一次，失敗就不顯示開場警告（鎖定畫面已蓋上），通過再持續監看
    if (!brandGuard.verify()) { return; }
    brandGuard.start();

    if (!('serial' in navigator)) {
        const banner = bindText(el('div', { className: 'unsupportedBanner' }), 'text',
            '這個瀏覽器不支援 Web Serial，無法連接序列埠。請使用桌面版 Chrome、Edge 或較新版本的 Firefox，並以 HTTPS 或 localhost 開啟本頁。');
        document.body.insertBefore(banner, document.body.firstChild);
        appendLog('error', lx('瀏覽器不支援 Web Serial（navigator.serial 不存在）。'));
        return;
    }
    navigator.serial.addEventListener('disconnect', function (event) {
        if (ui.connected && event.target === ui.currentPort) {
            handleFatalLinkError(new LocalizedError(lx('序列埠已被拔除')));
        } else {
            refreshPortList().catch(function () { /* 忽略 */ });
        }
    });
    navigator.serial.addEventListener('connect', function () {
        refreshPortList().catch(function () { /* 忽略 */ });
    });
    ui.accepted = await showStartupWarning();
    if (!ui.accepted) {
        appendLog('warn', lx('已選擇離開。請關閉此頁面。'));
        updateControlState();
        return;
    }
    await refreshPortList();
    appendLog('info', lx('{0} {1} 已就緒。請按 Select Port 授權序列埠，再按 Open Port。', APP_TITLE, APP_VERSION));
    updateControlState();
}

document.addEventListener('DOMContentLoaded', function () {
    initializeApplication().catch(showFatalInitError);
});
/* ==========================================================================
   第五部分：LOGO 完整性防護（brandGuard）
   用途：標題列的 LOGO 是用純 CSS 繪製的（見 style.css 的 .brandLogo 區塊）。
         這支程式會確認 LOGO 仍然完整、可見、沒有被改動；一旦發現被刪除、隱藏、
         改形狀、改顏色或被遮蓋，就先安全關閉連線，再以全螢幕鎖定畫面停用所有功能。

   【檢查項目與驗證代碼】
     1  找不到 LOGO 元件，或色塊數量、順序不對（HTML 被刪改）
     2  LOGO 或其上層元件被隱藏（display、visibility、opacity）
     3  LOGO 太小或長寬比不對
     4  色塊形狀被改（clip-path 與 BRAND_LOGO_SPEC 不同）
     5  色塊顏色被改，或被加上背景圖
     6  點擊測試不符（LOGO 被遮蓋，或形狀與預期不同）

   【檢查時機】
     a. 啟動時（initializeApplication）立即檢查一次，失敗就不顯示開場警告。
     b. 每秒定時檢查。因為在瀏覽器開發人員工具裡直接改 CSS 規則不會觸發 DOM 事件，
        所以必須定時檢查。
     c. MutationObserver：LOGO、其上層元件、head 內的樣式被改動時立刻檢查。
     d. 重要操作前：開啟序列埠、所有讀寫操作（runExclusive）、JOG 按下。
     連續兩次檢查都失敗（間隔 300 毫秒）才鎖定，避免版面重排的瞬間誤判；
     重要操作前的檢查則是失敗就立即鎖定。

   【鎖定後】
     1. 以既有的安全流程關閉連線（停止 JOG、還原試運轉資料、釋放通訊權）。
     2. 蓋上全螢幕鎖定畫面（樣式全部寫在元件上，不依賴 style.css，CSS 被刪也不受影響）。
        鎖定畫面被移除或隱藏時，定時檢查會立刻補回。
     3. 鎖定狀態只存在程式內部，無法在頁面上解除，必須還原 LOGO 後重新整理頁面。

   【限制（務必了解）】
     這是單一 HTML 檔、程式碼完全公開，因此這個防護只能擋「刪除或修改 LOGO 樣式」的刻意操作，
     擋不住會直接修改本程式碼（把檢查拿掉）的人。要真正防止，必須改由伺服器端授權驗證。
   ========================================================================== */

// 預期的 LOGO 規格。這份數字必須與 style.css 的 .brandLogo 區塊一致（改其中一邊，另一邊也要改）。
// polygon：clip-path 各頂點的 x、y 百分比，依序排列；rgb：預期背景色；
// probe：色塊內部一個一定被該色塊覆蓋的點（百分比座標），用於點擊測試。
const BRAND_LOGO_SPEC = {
    panelId: 'BrandLogo_panel',         // LOGO 外框的 id
    aspect: 2.11,                       // 寬 ÷ 高
    aspectTolerance: 0.15,              // 長寬比容許誤差
    minHeight: 12,                      // 最小高度（像素），縮到比這小視同被改
    colorTolerance: 30,                 // 每個色彩通道容許的誤差（避免瀏覽器擴充功能微調顏色而誤判）
    polygonTolerance: 0.06,             // clip-path 數字容許誤差（瀏覽器序列化可能有些微差異）
    parts: [
        { name: 'redLeft', polygon: [0, 0, 24.28, 0, 37.11, 33.78, 25.67, 64.69], rgb: [237, 28, 36], probe: [18, 15] },
        { name: 'green', polygon: [71.39, 0, 50.01, 0, 13.03, 100, 34.39, 100], rgb: [0, 166, 80], probe: [42.2, 50] },
        { name: 'redRight', polygon: [100, 0, 78.6, 0, 41.61, 100, 63.01, 100], rgb: [237, 28, 36], probe: [70.8, 50] }
    ],
    gapProbe: [60.7, 30]                // 綠色塊與右側紅色塊之間的空隙，這個點不可被任何色塊覆蓋
};

const brandGuard = (function () {
    const LOCK_OVERLAY_ID = 'BrandLock_panel';
    // 鎖定畫面的樣式全部直接寫在元件上，不依賴任何樣式表。
    const LOCK_OVERLAY_STYLE = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;' +
        'display:flex;align-items:center;justify-content:center;background:rgba(8,10,13,0.97);' +
        'color:#f2f5f8;font:15px/1.6 system-ui,"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;';
    const LOCK_CARD_STYLE = 'max-width:520px;margin:16px;padding:28px 32px;border:1px solid #e5534b;' +
        'border-radius:8px;background:#1a2027;text-align:left;';

    let locked = false;           // 是否已鎖定（只存在於這個閉包內，頁面上無法直接改）
    let reasonCode = 0;           // 鎖定的驗證代碼
    let overlay = null;           // 鎖定畫面
    let started = false;
    let recheckTimer = 0;

    // ----------------------------------------------------------------------
    // 小工具
    // ----------------------------------------------------------------------

    // 取出字串中所有數字（clip-path 的計算值，例如 "polygon(0% 0%, 24.28% 0%, ...)"）。
    function numbersOf(text) {
        const matches = String(text || '').match(/-?\d+(?:\.\d+)?/g);
        return matches ? matches.map(Number) : [];
    }

    function samePolygon(actualText, expected, tolerance) {
        const actual = numbersOf(actualText);
        if (actual.length !== expected.length) { return false; }
        for (let i = 0; i < expected.length; i++) {
            if (Math.abs(actual[i] - expected[i]) > tolerance) { return false; }
        }
        return true;
    }

    // 解析 "rgb(237, 28, 36)" 或 "rgba(237, 28, 36, 1)"，回傳 [r, g, b, a]；不是這兩種格式回傳 null。
    function parseRgb(text) {
        const match = /^rgba?\(\s*(\d+(?:\.\d+)?)[,\s]+(\d+(?:\.\d+)?)[,\s]+(\d+(?:\.\d+)?)(?:[,\s/]+(\d*\.?\d+%?))?\s*\)$/.exec(String(text).trim());
        if (!match) { return null; }
        let alpha = 1;
        if (match[4] !== undefined) {
            alpha = (match[4].charAt(match[4].length - 1) === '%') ? parseFloat(match[4]) / 100 : parseFloat(match[4]);
        }
        return [Number(match[1]), Number(match[2]), Number(match[3]), alpha];
    }

    // ----------------------------------------------------------------------
    // 檢查：回傳 0 代表通過，其他數字為驗證代碼（見檔頭說明）
    // ----------------------------------------------------------------------
    function inspect() {
        const spec = BRAND_LOGO_SPEC;
        const logo = document.getElementById(spec.panelId);

        // 代碼 1：結構
        if (!logo || !logo.isConnected || logo.children.length !== spec.parts.length) { return 1; }
        const parts = Array.prototype.slice.call(logo.children);
        for (let i = 0; i < parts.length; i++) {
            if (parts[i].getAttribute('data-part') !== spec.parts[i].name || !parts[i].classList.contains('brandLogoPart')) { return 1; }
        }

        // 代碼 2：可見性。上層元件被隱藏或半透明，LOGO 也就看不到了。
        for (let node = logo.parentElement; node && node.nodeType === 1; node = node.parentElement) {
            const ancestor = window.getComputedStyle(node);
            if (ancestor.display === 'none' || parseFloat(ancestor.opacity) < 0.99) { return 2; }
        }
        for (const node of [logo].concat(parts)) {
            const style = window.getComputedStyle(node);
            if (style.display === 'none' || style.visibility !== 'visible' || parseFloat(style.opacity) < 0.99) { return 2; }
        }

        // 沒有版面引擎的環境（例如單元測試用的 jsdom）無法量測大小與點擊測試，到此為止。
        // 一般瀏覽器一定有 elementFromPoint，所以不會因此被繞過。
        if (typeof document.elementFromPoint !== 'function') { return 0; }

        // 代碼 3：大小與長寬比
        const box = logo.getBoundingClientRect();
        if (box.height < spec.minHeight || box.width < spec.minHeight * spec.aspect * 0.8) { return 3; }
        if (Math.abs(box.width / box.height - spec.aspect) > spec.aspectTolerance) { return 3; }
        for (const part of parts) {
            const rect = part.getBoundingClientRect();
            if (Math.abs(rect.width - box.width) > 1.5 || Math.abs(rect.height - box.height) > 1.5 ||
                Math.abs(rect.left - box.left) > 1.5 || Math.abs(rect.top - box.top) > 1.5) { return 3; }
        }

        // 代碼 4 與 5：每個色塊的形狀與顏色
        for (let i = 0; i < parts.length; i++) {
            const style = window.getComputedStyle(parts[i]);
            if (!samePolygon(style.clipPath || style.webkitClipPath, spec.parts[i].polygon, spec.polygonTolerance)) { return 4; }
            const color = parseRgb(style.backgroundColor);
            if (!color || color[3] < 0.99 || style.backgroundImage !== 'none') { return 5; }
            for (let channel = 0; channel < 3; channel++) {
                if (Math.abs(color[channel] - spec.parts[i].rgb[channel]) > spec.colorTolerance) { return 5; }
            }
        }

        // 代碼 6：點擊測試。有對話框蓋住整個畫面、或 LOGO 沒有完整在可視範圍內時略過，下次再測。
        const fullyVisible = box.left >= 0 && box.top >= 0 && box.right <= window.innerWidth && box.bottom <= window.innerHeight;
        if (fullyVisible && MessageBox.active === null) {
            for (let i = 0; i < parts.length; i++) {
                const probe = spec.parts[i].probe;
                if (document.elementFromPoint(box.left + box.width * probe[0] / 100, box.top + box.height * probe[1] / 100) !== parts[i]) { return 6; }
            }
            const gap = document.elementFromPoint(box.left + box.width * spec.gapProbe[0] / 100, box.top + box.height * spec.gapProbe[1] / 100);
            if (gap && gap.classList.contains('brandLogoPart')) { return 6; }
        }
        return 0;
    }

    // ----------------------------------------------------------------------
    // 鎖定
    // ----------------------------------------------------------------------

    // 鎖定畫面。每次都重新套用樣式並確認有掛在文件上，被人移除或隱藏就補回來。
    function ensureOverlay() {
        if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = LOCK_OVERLAY_ID;
            overlay.setAttribute('role', 'alertdialog');
            const card = document.createElement('div');
            card.style.cssText = LOCK_CARD_STYLE;
            const title = document.createElement('div');
            title.style.cssText = 'font-size:19px;font-weight:700;color:#ff8a80;margin-bottom:10px;';
            bindText(title, 'text', 'LOGO 驗證失敗，程式已停止運作');
            const message = document.createElement('div');
            bindText(message, 'text', '標題列的 LOGO 被刪除或修改了。為確保使用的是原始版本，所有通訊與操作功能都已停用。請還原 LOGO（或重新取得原始檔案）後重新整理頁面。');
            const code = document.createElement('div');
            code.style.cssText = 'margin-top:10px;color:#8997a6;font-size:13px;';
            bindText(code, 'text', '驗證代碼：{0}', reasonCode);
            const button = document.createElement('button');
            button.type = 'button';
            button.style.cssText = 'margin-top:18px;padding:7px 18px;border:1px solid #4c9be8;border-radius:4px;' +
                'background:#4c9be8;color:#06121f;font:inherit;font-weight:600;cursor:pointer;';
            bindText(button, 'text', '重新整理頁面');
            button.addEventListener('click', function () { window.location.reload(); });
            card.appendChild(title);
            card.appendChild(message);
            card.appendChild(code);
            card.appendChild(button);
            overlay.appendChild(card);
        }
        overlay.style.cssText = LOCK_OVERLAY_STYLE;
        overlay.hidden = false;
        if (overlay.parentNode !== document.documentElement) { document.documentElement.appendChild(overlay); }
        // 鎖定畫面底下的主畫面不可操作、不可用鍵盤聚焦
        const root = document.getElementById('appRoot');
        if (root) { root.inert = true; root.setAttribute('aria-hidden', 'true'); }
    }

    function lock(code) {
        if (locked) { return; }
        locked = true;
        reasonCode = code;
        ui.accepted = false;
        appendLog('error', lx('LOGO 驗證失敗（代碼 {0}），程式已停止運作。', code));
        ensureOverlay();
        // 以既有的安全流程關閉連線：停止 JOG、還原試運轉資料、釋放通訊權
        if (ui.connected) {
            closePort(false).catch(function () { /* 關閉失敗也不影響鎖定 */ }).then(updateControlState);
        }
        updateControlState();
        const button = overlay.querySelector('button');
        if (button) { button.focus(); }
    }

    // ----------------------------------------------------------------------
    // 對外介面
    // ----------------------------------------------------------------------

    // 立即檢查一次。通過回傳 true；失敗就鎖定並回傳 false。
    // 重要操作前呼叫：if (!brandGuard.verify()) { return; }
    function verify() {
        if (locked) { return false; }
        const code = inspect();
        if (code === 0) { return true; }
        lock(code);
        return false;
    }

    // 定時與事件觸發用：失敗時先等 300 毫秒再確認一次，仍失敗才鎖定。
    function tick() {
        if (locked) { ensureOverlay(); return; }
        if (inspect() === 0 || recheckTimer) { return; }
        recheckTimer = window.setTimeout(function () {
            recheckTimer = 0;
            if (locked) { return; }
            const code = inspect();
            if (code !== 0) { lock(code); }
        }, 300);
    }

    // 開始持續監看（定時與 MutationObserver）。只會啟動一次。
    function start() {
        if (started) { return; }
        started = true;
        window.setInterval(tick, 1000);
        if (typeof MutationObserver === 'function') {
            const observer = new MutationObserver(tick);
            const logo = document.getElementById(BRAND_LOGO_SPEC.panelId);
            if (logo) {
                observer.observe(logo, { attributes: true, childList: true, subtree: true });
                if (logo.parentNode) { observer.observe(logo.parentNode, { attributes: true, childList: true }); }
            }
            // 樣式表被刪改，或鎖定畫面被移除
            observer.observe(document.head, { attributes: true, childList: true, subtree: true, characterData: true });
            observer.observe(document.documentElement, { childList: true });
        }
    }

    return Object.freeze({
        verify: verify,
        start: start,
        isLocked: function () { return locked; }
    });
})();

</script>
